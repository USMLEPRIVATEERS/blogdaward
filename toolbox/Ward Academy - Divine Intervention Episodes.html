<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward Academy — Divine Intervention Podcast</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg: #f5f6fa;
  --bg2: #ffffff;
  --bg3: #eef0f6;
  --card: #ffffff;
  --border: #e0e4ed;
  --accent: #4f46e5;
  --accent2: #6366f1;
  --accent-light: #eef2ff;
  --accent-glow: rgba(79,70,229,0.1);
  --text: #1e293b;
  --text2: #475569;
  --text3: #94a3b8;
  --green: #059669;
  --green-bg: #ecfdf5;
  --orange: #d97706;
  --orange-bg: #fffbeb;
  --radius: 16px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}

/* === HEADER === */
.header {
  background: linear-gradient(135deg, #312e81 0%, #4338ca 50%, #4f46e5 100%);
  padding: 44px 24px 36px; text-align:center;
  position:relative; overflow:hidden;
}
.header::before {
  content:''; position:absolute; inset:0;
  background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M20 20h20v20H20z'/%3E%3C/g%3E%3C/svg%3E");
}
.hdr { position:relative; z-index:2; max-width:700px; margin:0 auto; }
.hdr-logo {
  display:inline-flex; align-items:center; gap:10px;
  font-size:12px; font-weight:700; color:rgba(255,255,255,0.65);
  letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;
}
.hdr-logo b {
  width:32px; height:32px; border-radius:9px;
  background:rgba(255,255,255,0.15); display:flex;
  align-items:center; justify-content:center; font-size:16px; color:#fff;
}
.hdr h1 {
  font-size:clamp(26px,4.5vw,42px); font-weight:800; color:#fff;
  line-height:1.15; margin-bottom:8px;
}
.hdr p { font-size:clamp(13px,2vw,16px); color:rgba(255,255,255,0.6); line-height:1.5; }
.hdr-stats {
  display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px;
}
.chip {
  display:flex; align-items:center; gap:7px;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.14);
  padding:7px 16px; border-radius:100px; color:#fff; font-size:13px; font-weight:500;
}
.chip strong { font-weight:800; font-size:17px; }

/* === TOOLBAR === */
.toolbar {
  position:sticky; top:0; z-index:100;
  background:rgba(245,246,250,0.92); backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); padding:12px 24px;
}
.toolbar-inner {
  max-width:1200px; margin:0 auto;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.search-w { flex:1; min-width:200px; position:relative; }
.search-w svg {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; color:var(--text3); pointer-events:none;
}
.search-w input {
  width:100%; padding:11px 14px 11px 42px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:12px; font-size:15px; font-family:inherit; color:var(--text);
  transition:all .2s;
}
.search-w input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.search-w input::placeholder { color:var(--text3); }
.finfo { font-size:13px; color:var(--text3); white-space:nowrap; }
.finfo strong { color:var(--accent); font-weight:700; }

/* === CONTENT === */
.content { max-width:1200px; margin:0 auto; padding:24px 24px 60px; }

/* === CATEGORY CARDS === */
.cat-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;
}
.cat-card {
  background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius);
  padding:22px 20px 18px; cursor:pointer; transition:all .2s;
  display:flex; flex-direction:column; gap:10px;
}
.cat-card:hover {
  border-color:var(--accent); box-shadow:var(--shadow-lg),0 0 0 3px var(--accent-glow);
  transform:translateY(-2px);
}
.cc-top { display:flex; align-items:center; gap:14px; }
.cc-icon {
  width:50px; height:50px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;
}
.cc-info { flex:1; }
.cc-info h3 { font-size:15px; font-weight:700; line-height:1.3; color:var(--text); margin-bottom:2px; }
.cc-info span { font-size:13px; color:var(--text3); }
.cc-bottom {
  display:flex; align-items:center; justify-content:space-between;
  padding-top:8px; border-top:1px solid var(--bg3);
}
.cc-bottom .cc-hint { font-size:12px; color:var(--text3); font-weight:500; }
.cc-bottom .cc-arrow {
  width:26px; height:26px; border-radius:7px; background:var(--bg3);
  display:flex; align-items:center; justify-content:center;
  color:var(--text3); font-size:14px; font-weight:700; transition:all .15s;
}
.cat-card:hover .cc-arrow { background:var(--accent-light); color:var(--accent); }

/* === DETAIL VIEW === */
.back-btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; background:var(--bg2); border:1.5px solid var(--border);
  border-radius:10px; font-size:14px; font-weight:600; color:var(--text2);
  cursor:pointer; font-family:inherit; transition:all .15s; margin-bottom:20px;
}
.back-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }

.detail-hdr {
  display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;
}
.detail-hdr .d-icon {
  width:52px; height:52px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; font-size:26px;
}
.detail-hdr h2 { font-size:22px; font-weight:800; }
.detail-hdr .d-count {
  font-size:13px; font-weight:600; color:var(--accent);
  background:var(--accent-light); padding:4px 12px; border-radius:100px;
}

/* === GLOSSARY BOX === */
.glossary {
  background: linear-gradient(135deg, #fefce8, #fef9c3);
  border: 1.5px solid #fde68a;
  border-radius:14px; padding:20px 22px; margin-bottom:24px;
  position:relative;
}
.glossary::before {
  content:'📖'; position:absolute; top:-12px; left:18px;
  background:#fef9c3; padding:0 6px; font-size:18px;
}
.glossary h4 {
  font-size:14px; font-weight:700; color:#92400e;
  margin-bottom:8px; display:flex; align-items:center; gap:6px;
}
.glossary p {
  font-size:13.5px; color:#78350f; line-height:1.65;
}
.glossary .g-terms {
  display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;
}
.glossary .g-tag {
  font-size:11px; font-weight:600; padding:4px 10px;
  border-radius:100px; background:rgba(146,64,14,0.1); color:#92400e;
}

/* === EPISODE CARDS WITH LINKS === */
.ep-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px;
}
.ep-card {
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  padding:16px 18px; transition:all .2s;
  display:flex; flex-direction:column; gap:10px;
}
.ep-card:hover { border-color:var(--accent); box-shadow:var(--shadow); }
.ep-top { display:flex; align-items:flex-start; gap:12px; }
.ep-num {
  min-width:34px; height:34px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:#fff; flex-shrink:0;
}
.ep-title { flex:1; font-size:14px; font-weight:500; color:var(--text); line-height:1.45; }
.ep-title .hl { background:#fef3c7; color:#92400e; border-radius:3px; padding:0 3px; }

.ep-links { display:flex; gap:8px; flex-wrap:wrap; padding-top:4px; }
.ep-link {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:9px;
  font-size:12.5px; font-weight:600; text-decoration:none;
  transition:all .15s; border:1.5px solid transparent;
}
.ep-link:hover { transform:translateY(-1px); }
.link-page {
  background:var(--accent-light); color:var(--accent); border-color:#c7d2fe;
}
.link-page:hover { background:#ddd6fe; border-color:var(--accent); }
.link-mp3 {
  background:var(--green-bg); color:var(--green); border-color:#a7f3d0; cursor:pointer;
}
.link-mp3:hover { background:#d1fae5; border-color:var(--green); }
.link-mp3.playing { background:#059669; color:#fff; border-color:#059669; animation:pulse-glow 2s infinite; }
@keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,0.3)} 50%{box-shadow:0 0 0 6px rgba(5,150,105,0)} }

/* === PLAYER BAR (hidden when inside iframe, parent toolbox handles playback) === */
.player-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:var(--bg2); border-top:1.5px solid var(--border);
  box-shadow:0 -4px 20px rgba(0,0,0,0.08);
  transform:translateY(100%); transition:transform .35s ease;
  padding:0;
}
.player-bar.visible { transform:translateY(0); }
body.in-iframe .player-bar { display:none !important; }
.player-inner {
  max-width:1200px; margin:0 auto;
  display:flex; align-items:center; gap:12px;
  padding:12px 20px;
}
.p-play-btn {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,#059669,#10b981);
  border:none; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:18px; transition:all .15s;
  box-shadow:0 2px 8px rgba(5,150,105,0.3);
}
.p-play-btn:hover { transform:scale(1.08); }
.p-info { flex:1; min-width:0; }
.p-title {
  font-size:13px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.p-cat { font-size:11px; color:var(--text3); margin-top:1px; }
.p-time-row { display:flex; align-items:center; gap:8px; margin-top:6px; }
.p-time { font-size:11px; color:var(--text3); font-weight:600; font-variant-numeric:tabular-nums; min-width:36px; }
.p-track {
  flex:1; height:6px; background:var(--bg3); border-radius:100px;
  cursor:pointer; position:relative; overflow:hidden;
}
.p-fill {
  height:100%; border-radius:100px;
  background:linear-gradient(90deg,#059669,#34d399);
  transition:width .2s;
  pointer-events:none;
}
.p-speed-btn {
  padding:4px 10px; border-radius:6px; border:1.5px solid var(--border);
  background:var(--bg2); font-size:11px; font-weight:700; color:var(--text2);
  cursor:pointer; font-family:inherit; transition:all .15s; flex-shrink:0;
}
.p-speed-btn:hover { border-color:var(--accent); color:var(--accent); }
.p-close-btn {
  width:30px; height:30px; border-radius:8px; border:none;
  background:var(--bg3); cursor:pointer; font-size:16px; color:var(--text3);
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0;
}
.p-close-btn:hover { background:#fee2e2; color:#dc2626; }

/* player visible -> add padding to body (not in iframe mode) */
body.player-open:not(.in-iframe) .footer { padding-bottom:90px; }
body.player-open:not(.in-iframe) .content { padding-bottom:100px; }

/* === EMPTY === */
.empty { text-align:center; padding:60px 24px; color:var(--text3); }
.empty .e-icon { font-size:42px; margin-bottom:10px; }

/* === FOOTER === */
.footer {
  text-align:center; padding:32px 24px; border-top:1px solid var(--border);
  color:var(--text3); font-size:13px; background:var(--bg2);
}
.footer strong { color:var(--text); }

@media (max-width:640px) {
  .cat-grid { grid-template-columns:1fr; }
  .ep-grid { grid-template-columns:1fr; }
  .header { padding:32px 16px 28px; }
  .content { padding:16px 12px 60px; }
}
</style>
</head>

<div class="header">
  <div class="hdr">
    <div class="hdr-logo"><b>W</b> Ward Academy</div>
    <h1>Divine Intervention Podcast</h1>
    <p>Episodios organizados por especialidade com acesso direto aos links e audios.</p>

<div class="content" id="content"></div>

<div class="player-bar" id="playerBar">

        <span class="p-time" id="pDur">0:00</span>
      </div>
    </div>
    <button class="p-speed-btn" id="pSpeed" onclick="cycleSpeed()">1x</button>
    <button class="p-close-btn" onclick="closePlayer()" title="Fechar">&times;</button>
  </div>
</div>

<footer class="footer">
  <strong>Ward Academy</strong> — Mentoria USMLE para Old Graduates brasileiros<br>

</footer>

function meta(c) { return CAT[c] || {icon:"\ud83d\udcc4",bg:"#f8fafc",color:"#64748b",gloss:"",terms:[]}; }

// State
let openCat = null;
const searchEl = document.getElementById('searchInput');

// Categories
const catMap = {};
EPS.forEach(ep => { if(!catMap[ep.category]) catMap[ep.category]=[]; catMap[ep.category].push(ep); });
const catKeys = Object.keys(catMap).sort((a,b) => {
  const top=["Rapid Review Series (Mixed)","Study Strategy / Announcements","USMLE Free 120 / Question Discussions"];
  const ai=top.indexOf(a),bi=top.indexOf(b);
  if(ai>=0&&bi>=0) return ai-bi; if(ai>=0) return -1; if(bi>=0) return 1;
  return a.localeCompare(b);
});

function hl(text,q) {
  if(!q) return text;
  const terms=q.split(/\s+/).filter(t=>t.length>1);
  let r=text;
  terms.forEach(t=>{
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    r=r.replace(re,'<span class="hl">$1</span>');
  });
  return r;
}

function renderHome() {
  const q=searchEl.value.toLowerCase().trim();
  let cats=catKeys;
  if(q) cats=catKeys.filter(c=>c.toLowerCase().includes(q)||catMap[c].some(e=>e.title.toLowerCase().includes(q)));
  document.getElementById('finfo').innerHTML=q?'<strong>'+cats.length+'</strong> categorias':'';
  if(!cats.length) { document.getElementById('content').innerHTML='<div class="empty"><div class="e-icon">\ud83d\udd0d</div><p>Nenhuma categoria encontrada</p></div>'; return; }
  let h='<div class="cat-grid">';
  cats.forEach(c=>{
    const m=meta(c), n=catMap[c].length;
    h+='<div class="cat-card" onclick="openCategory(\''+c.replace(/'/g,"\\'")+'\')">'
      +'<div class="cc-top"><div class="cc-icon" style="background:'+m.bg+'">'+m.icon+'</div>'
      +'<div class="cc-info"><h3>'+c+'</h3><span>'+n+' episodio'+(n!==1?'s':'')+'</span></div></div>'
      +'<div class="cc-bottom"><span class="cc-hint">Abrir episodios</span><span class="cc-arrow">\u279c</span></div>'
      +'</div>';
  });
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderDetail(cat) {
  const m=meta(cat);
  const q=searchEl.value.toLowerCase().trim();
  let eps=catMap[cat];
  if(q) eps=eps.filter(e=>e.title.toLowerCase().includes(q));
  document.getElementById('finfo').innerHTML='<strong>'+eps.length+'</strong> episodio'+(eps.length!==1?'s':'');

  let h='<button class="back-btn" onclick="goHome()">\u2190 Voltar para categorias</button>';
  h+='<div class="detail-hdr"><div class="d-icon" style="background:'+m.bg+'">'+m.icon+'</div>'
    +'<h2>'+cat+'</h2><span class="d-count">'+catMap[cat].length+' episodios</span></div>';

  // Glossary
  if(m.gloss) {
    h+='<div class="glossary"><h4>Sobre esta categoria</h4><p>'+m.gloss+'</p>';
    if(m.terms && m.terms.length) {
      h+='<div class="g-terms">';
      m.terms.forEach(t=>{ h+='<span class="g-tag">'+t+'</span>'; });
      h+='</div>';
    }
    h+='</div>';
  }

  if(!eps.length) {
    h+='<div class="empty"><div class="e-icon">\ud83d\udd0d</div><p>Nenhum episodio encontrado</p></div>';
  } else {
    h+='<div class="ep-grid">';
    eps.forEach((ep,i)=>{
      h+='<div class="ep-card"><div class="ep-top">'
        +'<div class="ep-num" style="background:'+m.color+'">'+(i+1)+'</div>'
        +'<div class="ep-title">'+hl(ep.title,q)+'</div></div>'
        +'<div class="ep-links">';
      if(ep.page) h+='<a class="ep-link link-page" href="'+ep.page+'" target="_blank" rel="noopener">\ud83d\udcc4 Abrir Pagina</a>';
      if(ep.mp3) h+='<a class="ep-link link-mp3" href="#" onclick="playEp(\''+ep.mp3.replace(/'/g,"\\'")+'\',\''+ep.title.replace(/'/g,"\\'")+'\',\''+ep.category.replace(/'/g,"\\'")+'\',this);return false;">\ud83c\udfa7 Ouvir MP3</a>';
      if(!ep.page && !ep.mp3) h+='<span style="font-size:12px;color:var(--text3)">Links indisponiveis</span>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  document.getElementById('content').innerHTML=h;
}

function render() {
  document.getElementById('sEps').textContent=EPS.length;
  document.getElementById('sCats').textContent=catKeys.length;
  if(openCat) renderDetail(openCat); else renderHome();
}

function openCategory(c) { openCat=c; render(); window.scrollTo({top:200,behavior:'smooth'}); }
function goHome() { openCat=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }

let st;
searchEl.addEventListener('input',()=>{ clearTimeout(st); st=setTimeout(render,200); });

render();

// === AUDIO PLAYER ===
var isInIframe = window.parent !== window;
if(isInIframe) document.body.classList.add('in-iframe');
var currentMp3Btn = null;

// In iframe: just send URL to parent toolbox, it handles everything
// Standalone: use local audio + local player bar
if(isInIframe) {

  function playEp(url, title, cat, btn) {
    if(currentMp3Btn) currentMp3Btn.classList.remove('playing');
    currentMp3Btn = btn;
    if(btn) btn.classList.add('playing');
    window.parent.postMessage({ source: 'divine-player', type: 'play', url: url, title: title, category: cat }, '*');
  }
  // These are no-ops in iframe mode (player bar is hidden)
  function togglePlay() {}
  function closePlayer() {}
  function seekAudio() {}
  function cycleSpeed() {}

} else {

  // Standalone mode - local audio player
  var localAudio = new Audio();
  var currentMp3Url = '';
  var speeds = [1, 1.25, 1.5, 1.75, 2, 0.75];
  var speedIdx = 0;

  function fmtTime(s) {
    if(!s||isNaN(s)) return '0:00';
    var m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  function playEp(url, title, cat, btn) {
    var bar = document.getElementById('playerBar');
    if(currentMp3Url === url && !localAudio.paused) {
      localAudio.pause();
      return;
    }
    currentMp3Url = url;
    document.getElementById('pTitle').textContent = title;
    document.getElementById('pCat').textContent = cat;
    bar.classList.add('visible');
    document.body.classList.add('player-open');
    if(currentMp3Btn) currentMp3Btn.classList.remove('playing');
    currentMp3Btn = btn;
    if(btn) btn.classList.add('playing');
    if(localAudio.src !== url) {
      localAudio.src = url;
      localAudio.playbackRate = speeds[speedIdx];
    }
    localAudio.play().catch(function(err) { console.error('Play failed:', err); });
  }

  function togglePlay() {
    if(!currentMp3Url) return;
    if(localAudio.paused) localAudio.play().catch(function(){});
    else localAudio.pause();
  }

  function closePlayer() {
    localAudio.pause();
    localAudio.removeAttribute('src');
    currentMp3Url = '';
    document.getElementById('playerBar').classList.remove('visible');
    document.body.classList.remove('player-open');
    if(currentMp3Btn) currentMp3Btn.classList.remove('playing');
    currentMp3Btn = null;
    document.getElementById('pPlayBtn').innerHTML = '&#9654;';
    document.getElementById('pFill').style.width = '0%';
  }

  function seekAudio(e) {
    var rect = e.currentTarget.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if(localAudio.duration) localAudio.currentTime = pct * localAudio.duration;
  }

  function cycleSpeed() {
    speedIdx = (speedIdx + 1) % speeds.length;
    localAudio.playbackRate = speeds[speedIdx];
    document.getElementById('pSpeed').textContent = speeds[speedIdx] + 'x';
  }

  localAudio.addEventListener('timeupdate', function() {
    if(!localAudio.duration) return;
    var pct = (localAudio.currentTime / localAudio.duration) * 100;
    document.getElementById('pFill').style.width = pct + '%';
    document.getElementById('pCur').textContent = fmtTime(localAudio.currentTime);
    document.getElementById('pDur').textContent = fmtTime(localAudio.duration);
  });
  localAudio.addEventListener('play', function() {
    document.getElementById('pPlayBtn').innerHTML = '&#9646;&#9646;';
    if(currentMp3Btn) currentMp3Btn.classList.add('playing');
  });
  localAudio.addEventListener('pause', function() {
    document.getElementById('pPlayBtn').innerHTML = '&#9654;';
    if(currentMp3Btn) currentMp3Btn.classList.remove('playing');
  });
  localAudio.addEventListener('ended', function() {
    document.getElementById('pPlayBtn').innerHTML = '&#9654;';
    if(currentMp3Btn) currentMp3Btn.classList.remove('playing');
    document.getElementById('pFill').style.width = '0%';
  });
}
</script>
</body>
