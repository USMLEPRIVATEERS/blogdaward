.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}.logo-m{width:30px;height:30px;border-radius:7px;background:var(--b);display:grid;place-items:center;color:#fff;font-family:'Instrument Serif',serif;font-size:17px;line-height:1}.logo-t{font-family:'Instrument Serif',serif;font-size:17px;color:var(--ink);letter-spacing:-.3px}

.sb{position:relative;margin-bottom:14px;z-index:80}.sb input{width:100%;padding:14px 18px 14px 46px;font-size:15px;font-family:'Outfit',sans-serif;border:1.5px solid var(--ln);border-radius:13px;background:var(--w);color:var(--ink);outline:none;transition:all .25s}.sb input:focus{border-color:var(--b);box-shadow:0 0 0 3px var(--bs)}.sb input::placeholder{color:var(--i4);font-weight:300}.sb .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--i4);pointer-events:none}.sb .sc{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:7px;border:none;background:var(--bg);color:var(--i3);cursor:pointer;display:none;place-items:center;font-size:15px}.sb .sc.v{display:grid}.sb .sc:hover{background:var(--ln)}

.row{border-bottom:1px solid var(--ln);animation:ri .2s ease both}@keyframes ri{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}.rh{display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.rh:hover .rt{color:var(--b)}.rn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--i4);background:var(--bg);flex-shrink:0;transition:all .2s}.row.ex .rn{background:var(--b);color:#fff}.row.done .rn{background:var(--gs);color:var(--g)}.row.ex.done .rn{background:var(--b);color:#fff}.row.doubt .rn{box-shadow:0 0 0 2px var(--y)}.ri{flex:1;min-width:0}.rt{font-size:14px;font-weight:500;color:var(--ink);transition:color .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs{font-size:11.5px;color:var(--i3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr{display:flex;align-items:center;gap:1px;flex-shrink:0}.rb{width:30px;height:30px;border-radius:6px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--i4);transition:all .15s;position:relative;-webkit-tap-highlight-color:transparent}.rb:hover{background:var(--bg);color:var(--i3)}.rb.s-bk{color:var(--b)}.rb.s-dn{color:var(--g)}.rb.s-db{color:var(--y)}.rb .dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--y);display:none}.rb.s-db .dot{display:block}.chv{transition:transform .3s;color:var(--i4)}.row.ex .chv{transform:rotate(180deg);color:var(--b)}

.dtg-geral{background:#f0f0f2;color:#86868b}.dtg-elegibilidade{background:#FFF2E8;color:#C0582A}.dtg-inscricao{background:#E8F0FF;color:#2660C4}.dtg-ecfmg{background:#FEF3E2;color:#B87333}.dtg-conteudo{background:#F3EBF9;color:#7B3DB5}.dtg-pratica{background:#EDE4F7;color:#5B2C8E}.dtg-prova{background:#E6F7EC;color:#1D8348}.dtg-seguranca{background:#FFE8EA;color:#C0392B}.dtg-resultado{background:#FFF8E6;color:#B8860B}.dtg-acomodacao{background:#E4F5F7;color:#117A8B}.dtg-residency{background:#E8F4E8;color:#2D6A2E}.dtg-recursos{background:#ECEEF1;color:#4A4E57}
.rdi-ac{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.al{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;background:var(--b);color:#fff;text-decoration:none;transition:opacity .2s;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}.al:hover{opacity:.85}.as{display:inline-flex;align-items:center;gap:3px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;background:var(--bg);color:var(--i3);border:1px solid var(--ln);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;-webkit-tap-highlight-color:transparent}.as:hover{border-color:var(--bl);color:var(--b)}
.rdi-nt{margin-top:8px;max-height:0;overflow:hidden;opacity:0;transition:all .3s}.rdi-nt.v{max-height:130px;opacity:1}.rdi-nt textarea{width:100%;max-width:460px;padding:9px 12px;font-family:'Outfit',sans-serif;font-size:12.5px;border:1.5px solid var(--ln);border-radius:8px;outline:none;resize:vertical;min-height:50px;color:var(--ink)}.rdi-nt textarea:focus{border-color:var(--b)}.rdi-nt textarea::placeholder{color:var(--i4)}
.rdi-qs{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px}.rdi-q{font-size:10.5px;padding:3px 8px;border-radius:5px;background:var(--bus);color:var(--bu);font-weight:500}
.empty{padding:50px 20px;text-align:center}.empty h3{font-family:'Instrument Serif',serif;font-size:20px;font-weight:400;color:var(--i3);margin-bottom:3px}.empty p{font-size:12.5px;color:var(--i4)}
mark{background:var(--bm);color:var(--ink);border-radius:2px;padding:0 1px}
footer{max-width:960px;margin:0 auto;padding:20px;text-align:center;font-size:10.5px;color:var(--i4);border-top:1px solid var(--ln)}footer a{color:var(--b);text-decoration:none}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:70}.ov.v{display:block}
@media(max-width:700px){.hdr-in{padding:10px 14px}.logo-t{font-size:15px}.pill{font-size:9.5px;padding:3px 7px}.hero{padding:26px 14px 0}.hero h2{font-size:24px}.hero-sub{font-size:12.5px;margin-bottom:18px}.sb input{padding:13px 16px 13px 42px;font-size:14px;border-radius:11px}.sb .si{left:13px}.cw{margin:0 -14px;padding:0 14px 3px}.tabs{padding:0 14px}.tb{padding:10px 11px;font-size:11.5px}.qp{padding:12px 14px 0}.qg{grid-template-columns:1fr 1fr}.qc{font-size:11px;padding:7px 9px}.la{padding:4px 14px 80px}.rh{gap:8px;padding:12px 0}.rt{font-size:13px}.rs{font-size:10.5px}.rn{width:24px;height:24px;font-size:9px}.rb{width:28px;height:28px}.rb svg{width:12px;height:12px}.chv{width:12px;height:12px}.rdi{padding:0 0 16px 0}.rdi-sm{font-size:12.5px}.rdi-ac{gap:5px}.al{padding:9px 14px;font-size:11.5px}.as{padding:9px 10px;font-size:11.5px}.rdi-nt textarea{max-width:100%}.pill-lb{display:none}}

<script>
const D=[
// ═══ MÓDULO INTRO (21) ═══
{id:1,m:"intro",t:"About the USMLE",s:"O que é, quem governa, missão",url:"https://www.usmle.org/about-usmle",tg:["geral"],kw:["usmle","about","o que é","nbme","fsmb","licensure","licença","missão"],qs:["O que é o USMLE?","Quem governa o USMLE?"],sum:"O USMLE é o sistema unificado de avaliação para licenciamento médico nos EUA desde 1992. De propriedade conjunta da FSMB e NBME, composto por três Steps que avaliam desde ciências básicas até prática clínica independente. Cada state medical board utiliza os resultados para conceder a licença."},
{id:2,m:"intro",t:"The Path to Licensure",s:"Jornada do exame à licença médica",url:"https://www.usmle.org/path-licensure",tg:["geral"],kw:["path","licensure","caminho","licença","jornada","etapas","pathway"],qs:["Qual o caminho para obter a licença?"],sum:"Visão geral do caminho desde a aplicação até a licença médica nos EUA. Explica como os três Steps se encaixam no processo de licensure, as diferenças entre graduados US e IMGs, e o papel dos state medical boards na concessão da licença."},
{id:3,m:"intro",t:"Step Exams — Hub Geral",s:"Portal central dos três Steps",url:"https://www.usmle.org/step-exams",tg:["geral","conteudo"],kw:["step exams","hub","steps","portal","visão geral"],qs:["Onde vejo informações de todos os Steps?"],sum:"Hub central com links para Step 1, Step 2 CK e Step 3. Ponto de partida para entender a estrutura, formato e conteúdo de cada etapa do exame."},
{id:4,m:"intro",t:"Bulletin of Information",s:"Documento oficial completo — leitura obrigatória",url:"https://www.usmle.org/bulletin-information",tg:["geral"],kw:["bulletin","boletim","oficial","regulamento","regras"],qs:["Onde encontro todas as regras?"],sum:"O manual completo do USMLE que todo candidato deve ler. Reúne elegibilidade, inscrição, agendamento, regras do exame, scoring e conduta. Ao aplicar, o candidato concorda com todas as condições."},
{id:5,m:"intro",t:"Bulletin → About the USMLE",s:"Importância e comitês de criação",url:"https://www.usmle.org/bulletin-information/about-usmle-and-why-its-important",tg:["geral"],kw:["importância","committees","comitês","fairness","equidade"],qs:["Por que o USMLE é importante?","Quem cria as questões?"],sum:"O USMLE garante um padrão rigoroso de competência. Questões criadas por centenas de educadores voluntários, cada uma avaliada por pelo menos dois comitês interdisciplinares."},
{id:6,m:"intro",t:"Bulletin → Cautions",s:"Precauções e transição ECFMG → FSMB",url:"https://www.usmle.org/bulletin-information/cautions",tg:["geral","inscricao"],kw:["cautions","precauções","transição","ecfmg","fsmb","transition"],qs:["O que está mudando nos serviços?"],sum:"Transição de serviços: FSMB e NBME centralizando funções. Serviços para IMGs (hoje ECFMG) serão transferidos à FSMB. NÃO afeta requisitos de ECFMG Certification."},
{id:7,m:"intro",t:"USMLE Service Transition Hub",s:"Acompanhe a transição de serviços",url:"https://www.usmle.org/usmle-service-transition",tg:["geral","ecfmg"],kw:["transition","transição","hub","mudanças","ecfmg","fsmb","serviços"],qs:["Como acompanho a transição?"],sum:"Hub central para acompanhar cronograma e impacto da transição de serviços do USMLE. Especialmente importante para IMGs que aplicam via ECFMG."},
{id:8,m:"intro",t:"Announcements",s:"Notícias e atualizações oficiais",url:"https://www.usmle.org/announcements",tg:["geral"],kw:["announcements","anúncios","notícias","news","atualizações","passing score"],qs:["Onde vejo novidades do USMLE?"],sum:"Comunicados sobre mudanças nos exames, passing scores, políticas e transição de serviços. Acompanhamento regular fundamental para IMGs."},
{id:9,m:"intro",t:"Podcasts USMLE",s:"Conteúdo em áudio oficial",url:"https://www.usmle.org/podcasts",tg:["recursos"],kw:["podcasts","áudio","episódios","ouvir"],qs:["O USMLE tem podcasts?"],sum:"Podcasts sobre preparação, políticas, entrevistas com comitês e dicas para o exame. Útil durante deslocamentos e plantões."},
{id:10,m:"intro",t:"Common Questions (FAQ)",s:"Respostas para dúvidas frequentes",url:"https://www.usmle.org/common-questions",tg:["geral"],kw:["faq","perguntas","custo","cost","taxa","água","water","nome","name change"],qs:["Quanto custa o USMLE?","Posso levar água?","Como mudo meu nome?"],sum:"FAQ oficial: custos nos sites das entidades; água permitida em recipiente transparente; mudanças de nome com documentação até 7 dias antes da prova."},
{id:11,m:"intro",t:"Medical School Toolkit",s:"Recursos para escolas médicas",url:"https://www.usmle.org/medical-school-toolkit",tg:["recursos"],kw:["toolkit","escola médica","materiais"],qs:["Recursos para escolas médicas?"],sum:"Materiais informativos e guias para orientadores acadêmicos sobre o processo de licenciamento nos EUA."},
{id:12,m:"intro",t:"USMLE Updates & Research",s:"Pesquisas e futuro do programa",url:"https://www.usmle.org/usmle-updates-research",tg:["recursos","geral"],kw:["updates","research","pesquisa","futuro"],qs:["Que pesquisas o USMLE conduz?"],sum:"Pesquisas sobre eficácia preditiva, equidade, novas modalidades de avaliação e impacto do Step 1 pass/fail."},
{id:13,m:"intro",t:"Privacy Policy",s:"Política de privacidade do USMLE",url:"https://www.usmle.org/usmle-privacy-policy",tg:["geral"],kw:["privacy","privacidade","dados","policy"],qs:["Qual a política de privacidade?"],sum:"Como o USMLE coleta, armazena e utiliza dados pessoais dos candidatos. Importante para entender seus direitos sobre informações fornecidas durante o processo."},
{id:14,m:"intro",t:"NBME",s:"National Board of Medical Examiners",url:"https://www.nbme.org",tg:["geral","recursos"],kw:["nbme","national board","organização","examiners"],qs:["O que é o NBME?"],sum:"Co-proprietário do USMLE junto com a FSMB. Desenvolve e administra os exames. Também oferece self-assessments (CBSSA/CCSSA/CCMSA) vendidos separadamente para prática."},
{id:15,m:"intro",t:"FSMB",s:"Federation of State Medical Boards",url:"https://www.fsmb.org",tg:["geral","recursos"],kw:["fsmb","federation","state boards","licenciamento"],qs:["O que é a FSMB?"],sum:"Co-proprietária do USMLE. Representa os state medical boards dos EUA. Administra inscrições do Step 3 e transcripts. Portal para IMGs acessarem o USMLE."},
{id:16,m:"intro",t:"ECFMG",s:"Certificação para médicos internacionais",url:"https://www.ecfmg.org",tg:["ecfmg","geral"],kw:["ecfmg","img","international","certificação","graduado internacional"],qs:["O que é o ECFMG?"],sum:"Educational Commission for Foreign Medical Graduates. Certifica IMGs para entrada em programas de residência nos EUA. Administra inscrições de Step 1/2 CK para IMGs e verifica credenciais."},
{id:17,m:"intro",t:"ECFMG Certification Overview",s:"Visão geral da certificação ECFMG",url:"https://www.ecfmg.org/certification/",tg:["ecfmg","elegibilidade"],kw:["certification","certificação","ecfmg","overview","requisitos"],qs:["Como funciona a ECFMG Certification?"],sum:"Requisitos completos para ECFMG Certification: aprovação nos Steps, verificação de credenciais médicas, e requisitos da escola médica. Obrigatória para IMGs entrarem em residências acreditadas pelo ACGME."},
{id:18,m:"intro",t:"ACGME",s:"Accreditation Council for GME",url:"https://www.acgme.org",tg:["geral","residency"],kw:["acgme","accreditation","residência","acreditação","gme"],qs:["O que é o ACGME?"],sum:"Acredita programas de residência e fellowship nos EUA. Todo programa de residência reconhecido deve ter acreditação ACGME. Essencial para entender requisitos de treinamento."},
{id:19,m:"intro",t:"World Directory of Medical Schools",s:"Verificar se sua escola é reconhecida",url:"https://www.wdoms.org",tg:["elegibilidade","ecfmg"],kw:["world directory","wdoms","escola médica","reconhecida","verificar"],qs:["Minha escola é reconhecida?"],sum:"Banco de dados global de escolas médicas. A escola do IMG DEVE estar listada no WDOMS e atender requisitos ECFMG. Primeira verificação a fazer antes de iniciar o processo."},
{id:20,m:"intro",t:"Pathway — US Students",s:"Infográfico: caminho para graduados US",url:"https://www.usmle.org/sites/default/files/2026-01/U.S.%20USMLE%20Pathway%20to%20Licensure.jpg",tg:["geral","recursos"],kw:["pathway","infográfico","us students","caminho","fluxograma"],qs:["Qual o pathway para graduados US?"],sum:"Infográfico oficial mostrando o caminho completo para graduados de escolas médicas americanas: Step 1 → Step 2 CK → Residência → Step 3 → Licença."},
{id:21,m:"intro",t:"Pathway — International (IMG)",s:"Infográfico: caminho para IMGs",url:"https://www.usmle.org/sites/default/files/2026-01/International%20USMLE%20Pathway%20to%20Licensure.jpg",tg:["geral","ecfmg","recursos"],kw:["pathway","infográfico","img","international","caminho","fluxograma"],qs:["Qual o pathway para IMGs?"],sum:"Infográfico oficial do caminho para IMGs: ECFMG Certification + Steps → Match → Residência → Step 3 → Licença. Mostra todas as etapas específicas para graduados internacionais."},

// ═══ MÓDULO INSCRIÇÃO (26) ═══
{id:22,m:"inscricao",t:"Eligibility",s:"Requisitos de elegibilidade",url:"https://www.usmle.org/bulletin-information/eligibility",tg:["elegibilidade"],kw:["eligibility","elegibilidade","requisitos","img","ecfmg","diploma","world directory"],qs:["Quem pode fazer o USMLE?","Elegibilidade para IMGs?"],sum:"Para IMGs, escola deve estar no WDOMS atendendo requisitos ECFMG. Step 1/2 CK pelo ECFMG; Step 3 pela FSMB. Desde julho 2025, canadenses são IMGs."},
{id:23,m:"inscricao",t:"Preparing for the USMLE",s:"Visão comparativa dos três Steps",url:"https://www.usmle.org/bulletin-information/prepare-usmle",tg:["conteudo","pratica"],kw:["preparação","estudar","step 1","step 2","step 3","mcq","ccs"],qs:["Como me preparar?","Diferença entre os Steps?"],sum:"Step 1: ~280 MCQs, 7 blocos, 8h. Step 2 CK: ~318 MCQs, 8 blocos, 9h. Step 3: dois dias com MCQs + simulações CCS. Step 3 apenas nos EUA."},
{id:24,m:"inscricao",t:"Applying & Scheduling",s:"Inscrição e agendamento",url:"https://www.usmle.org/bulletin-information/applying-scheduling",tg:["inscricao"],kw:["applying","scheduling","inscrição","agendar","scheduling permit"],qs:["Como me inscrevo?","Onde agendo?","O que é scheduling permit?"],sum:"IMGs: Step 1/2 CK pelo ECFMG, Step 3 pela FSMB. Centros Prometric. Agendar assim que receber o permit — vagas esgotam rápido."},
{id:25,m:"inscricao",t:"Apply for Exams (Taxas 2026)",s:"Portal de aplicação e valores",url:"https://www.usmle.org/apply-exams",tg:["inscricao"],kw:["apply","portal","inscrição","taxas","fees","2026","valores"],qs:["Onde faço inscrição?","Quanto custa?"],sum:"Hub com taxas atualizadas de 2026 e links para portais de aplicação: IMGs → ECFMG/FSMB; graduados US → NBME/FSMB."},
{id:26,m:"inscricao",t:"Reschedule an Exam — Info & Taxas",s:"Regras e custos de reagendamento",url:"https://www.usmle.org/reschedule-exam",tg:["inscricao"],kw:["reschedule","reagendar","taxas","fees","mudar data","cancelar"],qs:["Quanto custa reagendar?","Regras de reagendamento?"],sum:"Políticas oficiais de reagendamento com tabela de taxas por antecedência. Quanto mais próximo da data, maior o custo. Inclui informações sobre cancelamento."},
{id:27,m:"inscricao",t:"Bulletin → Abbreviations",s:"Glossário de siglas oficiais",url:"https://www.usmle.org/bulletin-information/abbreviations",tg:["geral","recursos"],kw:["abbreviations","siglas","glossário","abreviações","termos"],qs:["O que significam as siglas?"],sum:"Lista oficial de todas as siglas usadas no USMLE: ECFMG, FSMB, NBME, LCME, ACGME, CIN, CIR, etc. Referência rápida essencial."},
{id:28,m:"inscricao",t:"Contact Us",s:"Canais oficiais de contato",url:"https://www.usmle.org/contact-us",tg:["geral"],kw:["contato","ajuda","suporte","email"],qs:["Como contato o USMLE?"],sum:"Formulário online e direcionamentos: ECFMG (IMGs Step 1/2 CK), FSMB (Step 3), NBME (graduados US)."},
{id:29,m:"inscricao",t:"Bulletin → Communicating",s:"Como se comunicar sobre o USMLE",url:"https://www.usmle.org/bulletin-information/communicating",tg:["geral"],kw:["communicating","comunicação","contato","informações","bulletin"],qs:["Como me comunicar com as entidades?"],sum:"Orientações sobre como e quando contatar NBME, FSMB e ECFMG. Quais assuntos direcionar a qual entidade. Prazos de resposta e canais preferidos."},
{id:30,m:"inscricao",t:"MyUSMLE (NBME)",s:"Portal para graduados US",url:"https://www.myusmle.org",tg:["inscricao"],kw:["myusmle","nbme","portal","login","us students"],qs:["Onde é o portal NBME?"],sum:"Portal de autoatendimento para graduados de escolas médicas americanas. Aplicar para Step 1/2 CK, acompanhar status, acessar scheduling permits e resultados."},
{id:31,m:"inscricao",t:"NBME Fee Assistance",s:"Programa de assistência financeira",url:"https://www.nbme.org/contributions/learner-programs-and-resources",tg:["inscricao","recursos"],kw:["fee assistance","assistência","financeira","desconto","ajuda","custo"],qs:["Existe desconto nas taxas?","Assistência financeira?"],sum:"Programa do NBME que oferece assistência financeira para candidatos elegíveis. Pode reduzir significativamente o custo dos exames. Verificar critérios e prazos."},
{id:32,m:"inscricao",t:"FSMB USMLE Portal (IMGs)",s:"Portal de registro para IMGs",url:"https://usmle.fsmb.org",tg:["inscricao","ecfmg"],kw:["fsmb","portal","img","registro","step 3","login"],qs:["Onde IMGs registram para Step 3?"],sum:"Portal da FSMB para IMGs aplicarem ao Step 3 e gerenciarem transcripts. Também utilizado na transição de serviços para Step 1/2 CK de IMGs."},
{id:33,m:"inscricao",t:"MyIntealth (ECFMG)",s:"Conta ECFMG para IMGs",url:"https://www.myintealth.app",tg:["ecfmg","inscricao"],kw:["myintealth","ecfmg","login","conta","account","img"],qs:["Onde acesso minha conta ECFMG?"],sum:"Portal de conta pessoal ECFMG (antigo IWA/OASIS). Aplicar para Step 1/2 CK, acompanhar verificação de credenciais, status de certificação e comunicações."},
{id:34,m:"inscricao",t:"ECFMG Verification of Credentials",s:"Verificação de diploma e credenciais",url:"https://www.ecfmg.org/certification/verification-of-credentials.html",tg:["ecfmg","elegibilidade"],kw:["verification","verificação","credenciais","diploma","credentials"],qs:["Como funciona a verificação de diploma?"],sum:"Processo pelo qual o ECFMG verifica autenticidade do diploma, escola médica e credenciais do IMG. Etapa obrigatória da certificação. Inclui verificação primária junto à escola."},
{id:35,m:"inscricao",t:"ECFMG 2026 Pathways",s:"Pathways de certificação atuais",url:"https://www.ecfmg.org/certification-pathways/",tg:["ecfmg","elegibilidade"],kw:["pathways","certificação","2026","ecfmg","rotas","caminhos"],qs:["Quais os pathways ECFMG em 2026?"],sum:"Pathways de certificação disponíveis em 2026 para IMGs. Diferentes rotas dependendo da situação do candidato. Verificar qual pathway se aplica ao seu caso."},
{id:36,m:"inscricao",t:"ECFMG FAQ",s:"Perguntas frequentes do ECFMG",url:"https://www.ecfmg.org/certification/",tg:["ecfmg"],kw:["ecfmg","faq","perguntas","dúvidas","certificação"],qs:["FAQ do ECFMG?"],sum:"Perguntas frequentes sobre ECFMG Certification: prazos, documentos necessários, custos, validade e processo de recertificação."},
{id:37,m:"inscricao",t:"ECFMG Processing Times",s:"Tempos de processamento atuais",url:"https://www.ecfmg.org/online-services/current-processing-times.html",tg:["ecfmg"],kw:["processing","tempo","prazo","processamento","demora","waiting"],qs:["Quanto demora o processamento?"],sum:"Tempos atualizados de processamento de aplicações, verificações e certificações do ECFMG. Essencial para planejamento do cronograma de estudos e aplicação."},
{id:38,m:"inscricao",t:"Schedule an Exam (Prometric)",s:"Agendar prova no Prometric",url:"https://www.prometric.com/test-takers/search/usmle",tg:["inscricao"],kw:["schedule","prometric","agendar","centro de teste","vagas","data"],qs:["Onde agendo no Prometric?"],sum:"Site da Prometric: ~335 centros EUA/Canadá e ~100 internacionais. Agendar cedo — vagas esgotam nos períodos pré-ERAS."},
{id:39,m:"inscricao",t:"Reschedule (Prometric)",s:"Reagendar diretamente no Prometric",url:"https://proscheduler.prometric.com/scheduling/appointmentsearch",tg:["inscricao"],kw:["reschedule","reagendar","prometric","mudar data"],qs:["Como reagendo no Prometric?"],sum:"Ferramenta direta para alterar data/centro. Verificar políticas de taxa antes de reagendar."},
{id:40,m:"inscricao",t:"Practice Session (Prometric)",s:"Sessão prática no centro real",url:"https://apps.nbme.org/CBTPSRegistrationWeb/jsp/usmle_CBTPS_registration.jsp",tg:["pratica"],kw:["practice session","prometric","centro","simulação","ambiente"],qs:["Posso praticar no Prometric?"],sum:"Sessão no centro real: check-in, sala, estação, segurança, breaks. Valioso para reduzir ansiedade sobre o ambiente."},
{id:41,m:"inscricao",t:"Test Accommodations — Overview",s:"Acomodações para necessidades especiais",url:"https://www.usmle.org/what-to-know/test-accommodations",tg:["acomodacao"],kw:["accommodations","acomodações","disability","ada","tempo extra","amamentação"],qs:["Posso pedir tempo extra?","Acomodação para amamentação?"],sum:"Acomodações ADA: tempo adicional, intervalos, salas separadas, amamentação. Avaliação individualizada."},
{id:42,m:"inscricao",t:"Test Accommodations — Make a Request",s:"Como solicitar acomodações",url:"https://www.usmle.org/what-to-know/test-accommodations/make-a-request",tg:["acomodacao"],kw:["request","solicitar","formulário","documentação","acomodação"],qs:["Como solicito acomodações?"],sum:"Formulário + documentação médica. Reconsideração se negado. Pré-aprovados sem solicitação: protetores auriculares, água transparente."},
{id:43,m:"inscricao",t:"2026 Bulletin PDF",s:"Documento completo para download",url:"https://www.usmle.org/sites/default/files/2025-08/2026Bulletin.pdf",tg:["geral","recursos"],kw:["bulletin","2026","pdf","download"],qs:["Onde baixo o Bulletin 2026?"],sum:"PDF completo do Bulletin 2026 com todas as regras e políticas. Manter cópia local para referência."},
{id:44,m:"inscricao",t:"2026 Bulletin Addendum PDF",s:"Atualizações ao Bulletin principal",url:"https://www.usmle.org/sites/default/files/2025-12/2026%20Bulletin%20Addendum.pdf",tg:["geral","recursos"],kw:["addendum","adendo","atualização","bulletin","2026","pdf"],qs:["Há atualizações ao Bulletin?"],sum:"Adendo com mudanças e correções ao Bulletin 2026 principal. Publicado após o Bulletin original. Ler em conjunto para ter informação mais atualizada."},
{id:45,m:"inscricao",t:"USMLE Checklist 2025 (PDF)",s:"Lista de verificação oficial",url:"https://www.usmle.org/sites/default/files/2025-08/USMLE_Checklist_2025.pdf",tg:["inscricao","recursos"],kw:["checklist","lista","verificação","pdf","passo a passo"],qs:["Existe checklist oficial?"],sum:"PDF com todas as etapas: Bulletin, elegibilidade, aplicação, permit, agendamento, materiais, exame e scoring."},
{id:46,m:"inscricao",t:"USMLE Content Outline (PDF)",s:"Outline geral de conteúdo",url:"https://www.usmle.org/sites/default/files/2021-08/USMLE_Content_Outline.pdf",tg:["conteudo","recursos"],kw:["content outline","conteúdo","outline","geral","pdf","sistemas","disciplinas"],qs:["O que cai no USMLE em geral?"],sum:"Documento geral descrevendo a estrutura de conteúdo em duas dimensões: sistemas orgânicos e processos/disciplinas. Aplica-se a todos os Steps."},
{id:47,m:"inscricao",t:"Physician Tasks & Competencies (PDF)",s:"Tarefas e competências avaliadas",url:"https://www.usmle.org/sites/default/files/2021-08/USMLE_Physician_Tasks_Competencies.pdf",tg:["conteudo","recursos"],kw:["physician tasks","competencies","competências","tarefas","habilidades"],qs:["Que competências são avaliadas?"],sum:"Framework de tarefas médicas e competências que o USMLE avalia: diagnóstico, manejo, ciência biomédica, comunicação, profissionalismo. Base conceitual dos três Steps."},

// ═══ MÓDULO STEPS (23) ═══
{id:48,m:"steps",t:"Step 1 — Visão Geral",s:"Formato, duração e estrutura",url:"https://www.usmle.org/step-exams/step-1",tg:["conteudo"],kw:["step 1","overview","formato","blocos","duração","280","pass fail","ciências básicas"],qs:["Quantas questões no Step 1?","Step 1 é pass/fail?"],sum:"7 blocos de 60 min, até 280 questões, 8h de sessão. 45 min de break + tutorial de 15 min. Desde jan/2022, resultado é pass/fail. Avalia ciências básicas."},
{id:49,m:"steps",t:"Step 1 — Exam Content",s:"Conteúdo e materiais obrigatórios",url:"https://www.usmle.org/step-exams/step-1/step-1-exam-content",tg:["conteudo"],kw:["content","conteúdo","step 1","items","testing experience"],qs:["Qual conteúdo do Step 1?","Simulador é obrigatório?"],sum:"Ciências básicas em duas dimensões — sistema × processo. OBRIGATÓRIO executar a Interactive Testing Experience antes da prova. Tutorial no exame é resumido."},
{id:50,m:"steps",t:"Step 1 Materials Hub",s:"Central de recursos oficiais",url:"https://www.usmle.org/exam-resources/step-1-materials",tg:["recursos","pratica"],kw:["materials","materiais","hub","step 1","recursos"],qs:["Materiais oficiais do Step 1?"],sum:"Centraliza Content Outline, Interactive Testing, Sample Questions e Question Formats. Base antes de UWorld/Amboss."},
{id:51,m:"steps",t:"Step 1 Content Outline & Specs",s:"Pesos por sistema e disciplina",url:"https://www.usmle.org/exam-resources/step-1-materials/step-1-content-outline-and-specifications",tg:["conteudo"],kw:["content outline","especificações","sistemas","disciplinas","peso","anatomia","patologia","farmacologia"],qs:["Peso de cada disciplina no Step 1?"],sum:"O QUE CAI: sistema orgânico × processo. Questões exigem raciocínio aplicado, não memorização. NÃO é guia de estudo — é framework conceitual."},
{id:52,m:"steps",t:"Step 1 Sample Questions",s:"Questões-exemplo oficiais",url:"https://www.usmle.org/exam-resources/step-1-materials/step-1-sample-test-questions",tg:["pratica"],kw:["sample","questões","exemplo","step 1","prática"],qs:["Questões oficiais do Step 1?"],sum:"Questões dos comitês USMLE que representam fielmente estilo e complexidade. Benchmark mais autêntico possível."},
{id:53,m:"steps",t:"Step 1 Question Formats",s:"Tipos e estratégias de resposta",url:"https://www.usmle.org/exam-resources/step-1-materials/step-1-test-question-formats",tg:["pratica","conteudo"],kw:["formato","question format","single best answer","estratégia","vignette","eliminação"],qs:["Formatos de questão do Step 1?"],sum:"Single-Best-Answer: vinheta + opções A-E. Gerar resposta antes de ver alternativas, eliminar incorretas. SEMPRE responder."},
{id:54,m:"steps",t:"Step 1 Interactive Testing",s:"Simulador oficial gratuito (NBME)",url:"https://orientation.nbme.org/Launch/USMLE/STPF1",tg:["pratica"],kw:["simulador","software","nbme","tutorial","step 1","interface"],qs:["Simulador do Step 1?"],sum:"Simulador gratuito = software real. OBRIGATÓRIO. Timer, marcação, calculadora, lab values. Economia de tempo e ansiedade."},
{id:55,m:"steps",t:"NBME Self-Assessment — Step 1",s:"Simulados oficiais CBSSA",url:"https://www.nbme.org/examinees/self-assessments",tg:["pratica"],kw:["nbme","self-assessment","cbssa","simulado","step 1","nota","score"],qs:["Como fazer simulados oficiais do Step 1?"],sum:"Self-assessments pagos do NBME (CBSSA). Melhor preditor de desempenho real junto com UWorld. Recomenda-se fazer pelo menos 2-3 nas semanas finais de preparação."},
{id:56,m:"steps",t:"Step 2 CK — Visão Geral",s:"Formato e estrutura do Step 2 CK",url:"https://www.usmle.org/step-exams/step-2-ck",tg:["conteudo"],kw:["step 2","step 2 ck","clinical knowledge","formato","blocos","318"],qs:["Quantas questões no Step 2 CK?","Formato do Step 2 CK?"],sum:"8 blocos de 60 min, até 318 questões, 9h de sessão. Avalia conhecimento clínico necessário para supervisão. Score numérico em 3 dígitos, mínimo 218 desde jul/2025."},
{id:57,m:"steps",t:"Step 2 CK — Exam Content",s:"Conteúdo clínico avaliado",url:"https://www.usmle.org/step-exams/step-2-ck/step-2-ck-exam-content",tg:["conteudo"],kw:["content","conteúdo","step 2 ck","clínico","clinical"],qs:["O que cai no Step 2 CK?"],sum:"Conhecimento clínico por sistemas e processos. Ênfase em diagnóstico, manejo, prevenção e manutenção da saúde. Cenários de pacientes em contexto ambulatorial e hospitalar."},
{id:58,m:"steps",t:"Step 2 CK Materials Hub",s:"Central de recursos Step 2 CK",url:"https://www.usmle.org/exam-resources/step-2-ck-materials",tg:["recursos","pratica"],kw:["materials","step 2 ck","hub","recursos"],qs:["Materiais oficiais do Step 2 CK?"],sum:"Outline, sample questions, question formats e interactive testing para Step 2 CK. Todos gratuitos no site oficial."},
{id:59,m:"steps",t:"Step 2 CK Content Outline & Specs",s:"Pesos e especificações clínicas",url:"https://www.usmle.org/exam-resources/step-2-ck-materials/step-2-ck-content-outline-specifications",tg:["conteudo"],kw:["content outline","step 2 ck","especificações","sistemas","clínico"],qs:["Peso das disciplinas no Step 2 CK?"],sum:"Framework de conteúdo clínico: sistemas orgânicos × processos clínicos. Especificações de distribuição de questões por área."},
{id:60,m:"steps",t:"Step 2 CK Sample Questions",s:"Questões-exemplo oficiais",url:"https://www.usmle.org/exam-resources/step-2-ck-materials/step-2-ck-sample-test-questions",tg:["pratica"],kw:["sample","questões","step 2 ck","exemplo"],qs:["Questões oficiais do Step 2 CK?"],sum:"Questões-exemplo oficiais do Step 2 CK. Representam fielmente o nível e formato do exame real."},
{id:61,m:"steps",t:"Step 2 CK Question Formats",s:"Tipos de questão clínica",url:"https://www.usmle.org/exam-resources/step-2-ck-materials/step-2-ck-test-question-formats",tg:["pratica","conteudo"],kw:["formato","step 2 ck","question format","clinical"],qs:["Formatos de questão do Step 2 CK?"],sum:"Formatos específicos do Step 2 CK incluindo vinhetas clínicas mais longas e complexas que o Step 1, com ênfase em próximo passo de manejo."},
{id:62,m:"steps",t:"Step 2 CK Interactive Testing",s:"Simulador oficial Step 2 CK",url:"https://orientation.nbme.org/Launch/USMLE/STPF2",tg:["pratica"],kw:["simulador","step 2 ck","software","nbme","interface"],qs:["Simulador do Step 2 CK?"],sum:"Simulador gratuito do software real para Step 2 CK. Mesma recomendação: executar ANTES da prova obrigatoriamente."},

const TG={geral:"Geral",elegibilidade:"Elegibilidade",inscricao:"Inscrição",ecfmg:"ECFMG",conteudo:"Conteúdo",pratica:"Prática",prova:"Dia da Prova",seguranca:"Segurança",resultado:"Resultados",acomodacao:"Acomodações",residency:"Residency",recursos:"Recursos"};
const MO={all:{l:"Todos"},intro:{l:"Introdução"},inscricao:{l:"Inscrição & ECFMG"},steps:{l:"Steps 1, 2 CK & 3"},prova:{l:"Prova & Scores"},residency:{l:"Residency & Match"}};
const aQ=[];D.forEach(r=>r.qs.forEach(q=>{const f=aQ.find(a=>a.t===q);f?f.ids.push(r.id):aQ.push({t:q,ids:[r.id]})}));

let S={q:'',mod:'all',tags:[],qIdx:null,fm:null,
bk:new Set(JSON.parse(localStorage.getItem('w5_bk')||'[]')),
dn:new Set(JSON.parse(localStorage.getItem('w5_dn')||'[]')),
db:new Set(JSON.parse(localStorage.getItem('w5_db')||'[]')),
nt:JSON.parse(localStorage.getItem('w5_nt')||'{}'),
ex:new Set(),nv:new Set(),qVis:true,allEx:false};
const sv=()=>{localStorage.setItem('w5_bk',JSON.stringify([...S.bk]));localStorage.setItem('w5_dn',JSON.stringify([...S.dn]));localStorage.setItem('w5_db',JSON.stringify([...S.db]));localStorage.setItem('w5_nt',JSON.stringify(S.nt))};

function mt(r,q){if(!q.trim())return false;const w=q.toLowerCase(),p=[r.t,r.s,r.sum,...r.kw,...r.tg.map(t=>TG[t]||t),...r.qs].join(' ').toLowerCase();return w.split(/\s+/).every(x=>p.includes(x))}
function fil(){return D.filter(r=>{if(S.mod!=='all'&&r.m!==S.mod)return false;if(S.tags.length&&!S.tags.some(t=>r.tg.includes(t)))return false;if(S.fm==='saved'&&!S.bk.has(r.id))return false;if(S.fm==='done'&&!S.dn.has(r.id))return false;if(S.fm==='doubt'&&!S.db.has(r.id))return false;if(S.qIdx!==null&&!aQ[S.qIdx].ids.includes(r.id))return false;if(S.q.trim())return mt(r,S.q);return true})}
function hl(t,q){if(!q.trim())return t;const ws=q.trim().split(/\s+/).filter(w=>w.length>1);if(!ws.length)return t;return t.replace(new RegExp(`(${ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})`,'gi'),'<mark>$1</mark>')}

function renderDD(q){const dd=document.getElementById('sD'),ov=document.getElementById('ov');if(!q.trim()){dd.classList.remove('v');ov.classList.remove('v');return}
const res=D.filter(r=>mt(r,q)).slice(0,7),qM=aQ.filter(a=>a.t.toLowerCase().includes(q.toLowerCase())).slice(0,4);
if(!res.length&&!qM.length){dd.innerHTML='<div class="sd-no">Nenhum resultado para "<b>'+q+'</b>"</div>';dd.classList.add('v');ov.classList.add('v');return}
let h='';if(res.length){h+='<div class="sd-sec">Recursos ('+res.length+')</div>';res.forEach(r=>{h+=`<div class="sd-it" onclick="goTo(${r.id})"><div class="sd-nm">${String(r.id).padStart(2,'0')}</div><div class="sd-inf"><div class="sd-tt">${hl(r.t,q)}</div><div class="sd-ss">${hl(r.s,q)}</div></div><svg class="sd-ar" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>`})}
if(qM.length){h+='<div class="sd-sec">Dúvidas relacionadas</div>';qM.forEach(q2=>{const idx=aQ.indexOf(q2);h+=`<div class="sd-q" onclick="goQ(${idx})"><div class="sd-qi"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="sd-qt">${hl(q2.t,q)}</div></div>`})}
dd.innerHTML=h;dd.classList.add('v');ov.classList.add('v')}
function closeDD(){document.getElementById('sD').classList.remove('v');document.getElementById('ov').classList.remove('v')}
function goTo(id){closeDD();S.q='';document.getElementById('sI').value='';S.qIdx=null;S.fm=null;S.tags=[];S.ex.clear();S.allEx=false;S.ex.add(id);render();setTimeout(()=>{const el=document.querySelector(`[data-id="${id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},80)}
function goQ(i){closeDD();S.qIdx=i;S.q='';document.getElementById('sI').value='';S.fm=null;S.tags=[];S.ex.clear();S.allEx=false;render()}

function render(){
const ch=document.getElementById('chips');ch.innerHTML='';Object.entries(TG).forEach(([k,v])=>{const c=document.createElement('button');c.className='chip'+(S.tags.includes(k)?' on':'');c.textContent=v;c.onclick=()=>{S.tags.includes(k)?S.tags=S.tags.filter(x=>x!==k):S.tags.push(k);S.qIdx=null;S.fm=null;S.ex.clear();render()};ch.appendChild(c)});
const tb=document.getElementById('tabs');tb.innerHTML='';Object.entries(MO).forEach(([k,v])=>{const c=k==='all'?D.length:D.filter(r=>r.m===k).length;const b=document.createElement('button');b.className='tb'+(S.mod===k?' on':'');b.textContent=v.l+' ('+c+')';b.onclick=()=>{S.mod=k;S.qIdx=null;S.fm=null;S.ex.clear();render()};tb.appendChild(b)});
const qg=document.getElementById('qG');qg.innerHTML='';aQ.forEach((q,i)=>{const c=document.createElement('button');c.className='qc'+(S.qIdx===i?' on':'');c.textContent=q.t;c.onclick=()=>{S.qIdx=S.qIdx===i?null:i;S.q='';document.getElementById('sI').value='';S.fm=null;S.tags=[];S.ex.clear();render()};qg.appendChild(c)});
document.getElementById('nBk').textContent=S.bk.size;document.getElementById('nDn').textContent=S.dn.size;document.getElementById('nDb').textContent=S.db.size;
document.getElementById('pBk').className='pill'+(S.fm==='saved'?' on':'');document.getElementById('pDn').className='pill'+(S.fm==='done'?' on':'');document.getElementById('pDb').className='pill'+(S.fm==='doubt'?' on':'');
document.getElementById('sC').classList.toggle('v',S.q.length>0);
const ea=document.getElementById('ea');ea.innerHTML=S.allEx?'<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>Recolher':'<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>Expandir todos';
const f=fil();document.getElementById('mc').innerHTML='<b>'+f.length+'</b> de '+D.length+' recursos';
const w=document.getElementById('lW');w.innerHTML='';
if(!f.length){w.innerHTML='<div class="empty"><h3>Nenhum resultado</h3><p>Ajuste filtros ou busque outros termos</p></div>';return}
f.forEach((r,i)=>{const isEx=S.allEx||S.ex.has(r.id),isBk=S.bk.has(r.id),isDn=S.dn.has(r.id),isDb=S.db.has(r.id),isNv=S.nv.has(r.id),nt=S.nt[r.id]||'';
const row=document.createElement('div');row.className='row'+(isEx?' ex':'')+(isDn?' done':'')+(isDb?' doubt':'');row.style.animationDelay=Math.min(i*.02,.4)+'s';row.dataset.id=r.id;
row.innerHTML=`<div class="rh" onclick="tog(${r.id})"><div class="rn">${String(r.id).padStart(2,'0')}</div><div class="ri"><div class="rt">${hl(r.t,S.q)}</div><div class="rs">${hl(r.s,S.q)}</div></div><div class="rr"><button class="rb${isDb?' s-db':''}" title="Dúvida" onclick="event.stopPropagation();tDb(${r.id})"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="dot"></span></button><button class="rb${isDn?' s-dn':''}" title="Lido" onclick="event.stopPropagation();tDn(${r.id})"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button><button class="rb${isBk?' s-bk':''}" title="Salvar" onclick="event.stopPropagation();tBk(${r.id})"><svg width="13" height="13" fill="${isBk?'currentColor':'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg></button><svg class="chv" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div></div><div class="rd"><div class="rdi"><div class="rdi-qs">${r.qs.map(q=>'<span class="rdi-q">'+q+'</span>').join('')}</div><p class="rdi-sm">${hl(r.sum,S.q)}</p><div class="rdi-tg">${r.tg.map(t=>'<span class="dtg dtg-'+t+'">'+(TG[t]||t)+'</span>').join('')}</div><div class="rdi-ac"><a class="al" href="${r.url}" target="_blank" rel="noopener">Abrir <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a><button class="as" onclick="event.stopPropagation();tNv(${r.id})"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>${nt?'Editar':'Anotar'}</button><button class="as" onclick="event.stopPropagation();tDb(${r.id})" style="${isDb?'border-color:var(--y);color:var(--y)':''}"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${isDb?'Dúvida ✓':'Dúvida'}</button></div><div class="rdi-nt${isNv?' v':''}"><textarea placeholder="Suas anotações..." oninput="sNt(${r.id},this.value)">${nt}</textarea></div></div></div>`;
w.appendChild(row)})}

function tog(id){S.ex.has(id)?S.ex.delete(id):S.ex.add(id);render()}
function tBk(id){S.bk.has(id)?S.bk.delete(id):S.bk.add(id);sv();render()}
function tDn(id){S.dn.has(id)?S.dn.delete(id):S.dn.add(id);sv();render()}
function tDb(id){S.db.has(id)?S.db.delete(id):S.db.add(id);sv();render()}
function tNv(id){S.nv.has(id)?S.nv.delete(id):S.nv.add(id);render()}
function sNt(id,v){S.nt[id]=v;sv()}
function filt(t){S.fm=S.fm===t?null:t;S.qIdx=null;S.tags=[];S.ex.clear();render()}
function clr(){S.q='';document.getElementById('sI').value='';closeDD();S.ex.clear();render()}
function togQ(){S.qVis=!S.qVis;document.getElementById('qW').classList.toggle('shut',!S.qVis);document.getElementById('qT').classList.toggle('flip',!S.qVis)}
function expAll(){S.allEx=!S.allEx;S.ex.clear();render()}

const sI=document.getElementById('sI');let st;
sI.addEventListener('input',e=>{const v=e.target.value;clearTimeout(st);st=setTimeout(()=>renderDD(v),100);clearTimeout(sI._lt);sI._lt=setTimeout(()=>{S.q=v;S.qIdx=null;S.fm=null;S.tags=[];S.ex.clear();S.allEx=false;render()},350)});
sI.addEventListener('focus',()=>{if(sI.value.trim())renderDD(sI.value)});
document.addEventListener('click',e=>{if(!document.getElementById('sbW').contains(e.target))closeDD()});
render();
</script>
</body>
</html>
