<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Mapa de Observerships USA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: white;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(16,24,40,.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.015em;
        }

        .header-subtitle {
            font-size: 13px;
            color: #667eea;
            font-weight: 500;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .info-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .info-badge i {
            color: #667eea;
        }

        .info-badge strong {
            color: #111827;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Map Section */
        .map-section {
            background: white;
            border-radius: 14px;
            padding: 30px;
            border: 1px solid #eef0f3;
            box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 12px 28px -12px rgba(16,24,40,.14);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .map-title {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.015em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .map-title i {
            color: #667eea;
        }

        .ward-credit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(118,75,162,.25);
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 700px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.08);
            border: 1px solid #e5e7eb;
        }

        .map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(16,24,40,.05), 0 14px 32px -8px rgba(16,24,40,.14);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .overlay-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .overlay-text {
            font-weight: 600;
            color: #111827;
            font-size: 13px;
        }

        /* Instructions */
        .instructions {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border-left: 4px solid #667eea;
        }

        .instructions h3 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instructions h3 i {
            color: #667eea;
        }

        .instructions ul {
            list-style: none;
            padding: 0;
        }

        .instructions li {
            padding: 8px 0;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.55;
            display: flex;
            align-items: start;
            gap: 10px;
        }

        .instructions li:before {
            content: "→";
            color: #667eea;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
            color: #6b7280;
            font-size: 13px;
        }

        .footer-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #111827;
        }

        .footer-logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 999;
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        .watermark-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-info {
                justify-content: center;
            }

            .map-container {
                
                height: 500px;
            }

            .map-header {
                flex-direction: column;
                align-items: start;
            }

            .map-title {
                font-size: 20px;
            }

            .map-overlay {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
            }

            .overlay-text {
                font-size: 12px;
            }

            .watermark {
                bottom: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 11px;
            }

            .instructions {
                padding: 15px;
            }
        }

        /* Loading state */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #667eea;
        }

        .loading i {
            font-size: 40px;
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Watermark -->
    <div class="watermark">
        <div class="watermark-icon">WA</div>
        Ward Academy © 2025
    </div>

    

    <!-- Main Content -->
    <div class="container">
        <div class="map-section">
            <div class="map-header">
                <h1 class="map-title">
                    <i class="fas fa-map-marker-alt"></i>
                    Mapa Interativo de Observerships
                </h1>
                <div class="ward-credit">
                    <i class="fas fa-code"></i>
                    Desenvolvido por Marcos Vilela
                </div>
            </div>
            
            <div class="map-container" id="mapContainer">
                <div class="map-overlay">
                    <div class="overlay-icon">WA</div>
                    <div class="overlay-text">Ward Academy</div>
                </div>

                <iframe 
                    class="map-frame" 
                    id="mapFrame"
                    src="https://www.google.com/maps/d/u/7/embed?mid=1azlfVqpzm2ljJzYD_L-zJPl6gAdhvrw&ehbc=2E312F"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                </iframe>
            </div>

            <div class="instructions">
                <h3>
                    <i class="fas fa-info-circle"></i>
                    Como usar o mapa
                </h3>
                <ul>
                    <li>Clique nos marcadores no mapa para ver informações detalhadas de cada hospital</li>
                    <li>Use os controles de zoom (+/-) para explorar diferentes regiões</li>
                    <li>Arraste o mapa para navegar pelos diferentes estados</li>
                    <li>Clique no ícone de tela cheia para expandir a visualização</li>
                    <li>Os hospitais estão organizados por região geográfica</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">
            <div class="footer-logo-icon">WA</div>
            Ward Academy
        </div>
        <p>© 2025 Ward Academy - Mapa desenvolvido por Marcos Vilela</p>
        <p style="margin-top: 5px; font-size: 12px; color: #999;">
            Todos os direitos reservados
        </p>
    </footer>

    <script>
        // Wait for iframe to load
        const mapFrame = document.getElementById('mapFrame');
        const loadingIndicator = document.getElementById('loadingIndicator');

        mapFrame.addEventListener('load', function() {
            setTimeout(() => {
                loadingIndicator.style.display = 'none';
                mapFrame.style.display = 'block';
            }, 500);
        });

        // Fallback if iframe doesn't load
        setTimeout(() => {
            if (loadingIndicator.style.display !== 'none') {
                loadingIndicator.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <div class="loading-text">
                        Erro ao carregar o mapa. 
                        <a href="#" onclick="location.reload()" style="color: #667eea; text-decoration: underline;">
                            Clique aqui para tentar novamente
                        </a>
                    </div>
                `;
            }
        }, 10000);

        // Copyright protection
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
