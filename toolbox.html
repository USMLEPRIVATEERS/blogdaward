<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Toolbox</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .toolbox-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .toolbox-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .toolbox-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .toolbox-subtitle {
            font-size: 1.1rem;
            color: var(--gray-600);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .app-card {
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .app-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .app-card:hover::before {
            transform: scaleX(1);
        }

        .app-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .app-description {
            font-size: 0.95rem;
            color: var(--gray-600);
            line-height: 1.5;
        }

        .app-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        /* App Modal */
        .app-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            padding: 1rem;
        }

        .app-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .app-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--gray-200);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
        }

        .app-modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0;
        }

        .app-modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .app-modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .app-modal-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .toolbox-title {
                font-size: 2rem;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .app-modal-content {
                height: 95vh;
                max-width: 100%;
                margin: 0;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </div>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="cronograma.html" class="nav-link">Cronograma</a>
                <a href="landmarks.html" class="nav-link">Chamadas</a>
                <a href="curso.html" class="nav-link">Curso</a>
                <a href="links.html" class="nav-link">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="pesquisa.html" class="nav-link">Pesquisa</a>
                <a href="toolbox.html" class="nav-link active">Toolbox</a>
                <a href="diary-uworld.html" class="nav-link" id="nav-diary" style="display: none;">Diario</a>
            </nav>
            <div class="nav-user">
                <a href="profile.html" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="toolbox-container">
            <div class="toolbox-header">
                <h1 class="toolbox-title">🧰 Toolbox</h1>
                <p class="toolbox-subtitle">Ferramentas e utilidades para turbinar seus estudos</p>
            </div>

            <div class="apps-grid" id="apps-grid">
                <!-- Apps will be loaded here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- App Modal -->
    <div id="app-modal" class="app-modal">
        <div class="app-modal-content">
            <div class="app-modal-header">
                <h3 class="app-modal-title" id="modal-app-title">App</h3>
                <button class="app-modal-close" onclick="closeApp()">✕ Fechar</button>
            </div>
            <div class="app-modal-body">
                <div class="loading-spinner" id="app-loading">⏳ Carregando...</div>
                <iframe id="app-iframe" class="app-iframe" style="display: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/assessoria-check.js"></script>
    <script>
        // Categorias de apps
        const categories = [
            { id: 'estagios', name: 'Estágios Internacionais', icon: '✈️' },
            { id: 'usmle', name: 'USMLE', icon: '📚' },
            { id: 'pesquisa', name: 'Pesquisa', icon: '🔬' },
            { id: 'anki', name: 'Anki', icon: '🎴' },
            { id: 'outras', name: 'Outras', icon: '🔧' }
        ];

        // Lista de apps disponíveis
        const apps = [
            {
                id: 'mapa-observerships',
                category: 'estagios',
                title: 'Mapa de Observerships',
                description: 'Visualize e explore oportunidades de observership nos EUA em um mapa interativo.',
                icon: '🗺️',
                file: 'toolbox/mapadeobserverships.html',
                badge: 'Interativo'
            }
            // Adicione mais apps aqui conforme necessário
            // {
            //     id: 'calculadora-usmle',
            //     category: 'usmle',
            //     title: 'Calculadora USMLE',
            //     description: 'Calcule suas chances de match baseado em seus scores.',
            //     icon: '🧮',
            //     file: 'toolbox/calculadora.html',
            //     badge: 'Novo'
            // }
        ];

        let userData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Check diary toggle
            const diariesEnabled = localStorage.getItem('study_diary_enabled') === 'true';
            const diaryLink = document.getElementById('nav-diary');
            if (diaryLink && diariesEnabled) {
                diaryLink.style.display = 'block';
            }

            renderApps();

            // Check if there's an app parameter in URL to auto-open
            const urlParams = new URLSearchParams(window.location.search);
            const appToOpen = urlParams.get('app');
            if (appToOpen) {
                // Small delay to ensure DOM is ready
                setTimeout(() => {
                    openApp(appToOpen);
                }, 100);
            }
        });

        function renderApps() {
            const container = document.getElementById('apps-grid');

            if (apps.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">🔧</div>
                        <h3 style="color: var(--gray-600); margin-bottom: 0.5rem;">Nenhum app disponível ainda</h3>
                        <p style="color: var(--gray-500);">Novos apps serão adicionados em breve!</p>
                    </div>
                `;
                return;
            }

            // Group apps by category
            let html = '';

            categories.forEach(category => {
                const categoryApps = apps.filter(app => app.category === category.id);

                // Only show category if it has apps
                if (categoryApps.length > 0) {
                    html += `
                        <div style="grid-column: 1 / -1; margin-top: ${html ? '2rem' : '0'};">
                            <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--gray-900); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                                <span>${category.icon}</span>
                                <span>${category.name}</span>
                            </h2>
                        </div>
                    `;

                    html += categoryApps.map(app => `
                        <div class="app-card" onclick="openApp('${app.id}')">
                            <span class="app-icon">${app.icon}</span>
                            <h3 class="app-title">${app.title}</h3>
                            <p class="app-description">${app.description}</p>
                            ${app.badge ? `<span class="app-badge">${app.badge}</span>` : ''}
                        </div>
                    `).join('');
                }
            });

            container.innerHTML = html;
        }

        function openApp(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;

            // Update modal title
            document.getElementById('modal-app-title').textContent = app.title;

            // Show modal
            document.getElementById('app-modal').classList.add('active');

            // Load app in iframe
            const iframe = document.getElementById('app-iframe');
            const loading = document.getElementById('app-loading');

            loading.style.display = 'block';
            iframe.style.display = 'none';

            iframe.onload = function() {
                loading.style.display = 'none';
                iframe.style.display = 'block';
            };

            iframe.src = app.file;

            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }

        function closeApp() {
            const modal = document.getElementById('app-modal');
            const iframe = document.getElementById('app-iframe');

            modal.classList.remove('active');
            iframe.src = '';

            // Restore body scroll
            document.body.style.overflow = '';
        }

        // Close modal on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeApp();
            }
        });

        // Close modal when clicking outside
        document.getElementById('app-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeApp();
            }
        });
    </script>
</body>
</html>
