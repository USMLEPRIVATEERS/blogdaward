<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Toolbox</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Alias: --gray-900 é usado nesta página mas não existe no style.css */
        :root {
            --gray-900: #111827;
        }

        .toolbox-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .toolbox-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .toolbox-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .toolbox-subtitle {
            font-size: 1.1rem;
            color: var(--gray-500, #6b7280);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .app-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 1.5rem;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .favorite-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            background: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gray-200, #e5e7eb);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .favorite-btn:hover {
            transform: scale(1.08);
            border-color: var(--gray-400, #9ca3af);
            box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 4px 10px rgba(16, 24, 40, 0.07);
        }

        .favorite-btn.favorited {
            border-color: #f59e0b;
            background: #fef3c7;
        }

        .favorite-btn:active {
            transform: scale(0.95);
        }

        .favorite-btn:focus-visible {
            outline: 2px solid var(--accent-orange, #C45700);
            outline-offset: 2px;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d46312 0%, #C45700 100%);
            transform: scaleX(0);
            transition: transform 0.25s ease;
        }

        .app-card:hover {
            border-color: rgba(196, 87, 0, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 12px 28px -6px rgba(196, 87, 0, 0.16);
        }

        .app-card:hover::before {
            transform: scaleX(1);
        }

        .app-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .app-description {
            font-size: 0.95rem;
            color: var(--gray-500, #6b7280);
            line-height: 1.55;
        }

        .app-badge {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            background: linear-gradient(180deg, #d46312, #C45700);
            color: white;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        /* App Modal */
        .app-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 10000;
            padding: 1rem;
        }

        .app-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-modal-content {
            background: white;
            border-radius: 14px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(16, 24, 40, 0.05), 0 24px 64px -12px rgba(16, 24, 40, 0.3);
        }

        .app-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, #d46312 0%, #C45700 100%);
            color: white;
            border-radius: 14px 14px 0 0;
        }

        .app-modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .app-modal-close {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .app-modal-close:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        .app-modal-close:active {
            transform: translateY(1px);
        }

        .app-modal-close:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .app-modal-header-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .app-modal-fullscreen {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .app-modal-fullscreen:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        .app-modal-fullscreen:active {
            transform: translateY(1px);
        }

        .app-modal-fullscreen:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* Fullscreen mode */
        .app-modal-content.fullscreen {
            max-width: 100%;
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }

        .app-modal-content.fullscreen .app-modal-header {
            display: none;
        }

        .app-modal-content.fullscreen .app-modal-body {
            border-radius: 0;
        }

        /* Floating exit fullscreen button */
        .fullscreen-exit-btn {
            display: none;
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(180deg, #d46312, #C45700);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 10001;
            box-shadow: 0 4px 8px rgba(16, 24, 40, 0.1), 0 14px 32px -8px rgba(16, 24, 40, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .fullscreen-exit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(16, 24, 40, 0.1), 0 18px 40px -8px rgba(196, 87, 0, 0.4);
        }

        .fullscreen-exit-btn:active {
            transform: translateY(1px);
        }

        .fullscreen-exit-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .fullscreen-exit-btn.visible {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-modal-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--accent-orange, #C45700);
        }



        @media (max-width: 768px) {
            .toolbox-title {
                font-size: 2rem;
            }

            .toolbox-header {
                margin-bottom: 2rem;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .app-modal-content {
                height: 95vh;
                max-width: 100%;
                margin: 0;
                border-radius: 10px;
            }

            .app-modal-header {
                border-radius: 10px 10px 0 0;
                padding: 0.75rem 1rem;
            }

            .app-modal-title {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .toolbox-title {
                font-size: 1.75rem;
            }

            .apps-grid {
                gap: 1rem;
            }

            .app-card {
                padding: 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-card,
            .app-card::before,
            .favorite-btn,
            .app-modal-close,
            .app-modal-fullscreen,
            .fullscreen-exit-btn {
                transition: none;
            }

            .app-card:hover,
            .favorite-btn:hover,
            .favorite-btn:active,
            .app-modal-close:hover,
            .app-modal-close:active,
            .app-modal-fullscreen:hover,
            .app-modal-fullscreen:active,
            .fullscreen-exit-btn:hover,
            .fullscreen-exit-btn:active {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/cronograma" class="nav-link">Cronograma</a>
                <a href="/landmarks" class="nav-link">Chamadas</a>
                <a href="/curso" class="nav-link">Curso</a>
                <a href="/wardpedia" class="nav-link">Wardpedia</a>
                <a href="/links" class="nav-link">Links</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/pesquisa" class="nav-link">Pesquisa</a>

                <a href="/profile" class="user-menu-btn">

                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="toolbox-container">
            <div class="toolbox-header">
                <h1 class="toolbox-title">🧰 Toolbox</h1>
                <p class="toolbox-subtitle">Ferramentas e utilidades para turbinar seus estudos</p>
            </div>

            <div class="apps-grid" id="apps-grid">
                <!-- Apps will be loaded here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- App Modal -->
    <div id="app-modal" class="app-modal">
        <div class="app-modal-content">
            <div class="app-modal-header">
                <h3 class="app-modal-title" id="modal-app-title">App</h3>
                <div class="app-modal-header-buttons">
                    <button class="app-modal-fullscreen" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
                    <button class="app-modal-close" onclick="closeApp()">✕ Fechar</button>
                </div>
            </div>
            <div class="app-modal-body">
                <div class="loading-spinner" id="app-loading">⏳ Carregando...</div>
                <iframe id="app-iframe" class="app-iframe" style="display: none;" allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <!-- Fullscreen Exit Button (floating) -->
    <button id="fullscreen-exit-btn" class="fullscreen-exit-btn" onclick="toggleFullscreen()">
        ✕ Sair da Tela Cheia
    </button>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>



    <script src="js/app.js"></script>

            {

                description: 'Salve e organize links e posts do Reddit por categorias.',
                icon: '🔖',
                file: '/toolbox/reddit',
                badge: 'Útil'
            }

        let userData = null;
        let userFavorites = [];

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Block assessoria users from accessing this page
            if (userData.role === 'assessoria') {
                alert('Esta página está disponível apenas para membros completos da Ward Academy.\n\nPara ter acesso, você pode demonstrar interesse através do seu dashboard.');
                window.location.href = '/dashboard-assessoria-avulsa';
                return;
            }

            // Load user favorites
            await loadUserFavorites();

            // Check diary toggle
            const diariesEnabled = localStorage.getItem('study_diary_enabled') === 'true';
            const diaryLink = document.getElementById('nav-diary');
            if (diaryLink && diariesEnabled) {
                diaryLink.style.display = 'block';
            }

            renderApps();

            // Check if there's an app parameter in URL to auto-open
            const urlParams = new URLSearchParams(window.location.search);
            const appToOpen = urlParams.get('app');
            if (appToOpen) {
                // Small delay to ensure DOM is ready
                setTimeout(() => {
                    openApp(appToOpen);
                }, 100);
            }
        });

        function renderApps() {
            const container = document.getElementById('apps-grid');

            if (apps.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">🔧</div>
                        <h3 style="color: var(--gray-600); margin-bottom: 0.5rem;">Nenhum app disponível ainda</h3>
                        <p style="color: var(--gray-500);">Novos apps serão adicionados em breve!</p>
                    </div>
                `;
                return;
            }

            // Group apps by category
            let html = '';

            categories.forEach(category => {
                const categoryApps = apps.filter(app => app.category === category.id);

                // Only show category if it has apps
                if (categoryApps.length > 0) {
                    html += `
                        <div style="grid-column: 1 / -1; margin-top: ${html ? '2rem' : '0'};">
                            <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--gray-900); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                                <span>${category.icon}</span>
                                <span>${category.name}</span>
                            </h2>
                        </div>
                    `;

                    html += categoryApps.map(app => {
                        const isFavorited = userFavorites.includes(app.id);
                        return `
                            <div class="app-card" onclick="openApp('${app.id}')">
                                <button
                                    class="favorite-btn ${isFavorited ? 'favorited' : ''}"
                                    onclick="event.stopPropagation(); toggleFavorite('${app.id}')"
                                    title="${isFavorited ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}">
                                    ${isFavorited ? '⭐' : '☆'}
                                </button>
                                <span class="app-icon">${app.icon}</span>
                                <h3 class="app-title">${app.title}</h3>
                                <p class="app-description">${app.description}</p>
                                ${app.badge ? `<span class="app-badge">${app.badge}</span>` : ''}
                            </div>
                        `;
                    }).join('');
                }
            });

            container.innerHTML = html;
        }

        async function loadUserFavorites() {
            try {
                const { data, error } = await WardApp.db
                    .from('users')
                    .select('toolbox_favorites')
                    .eq('id', userData.id)
                    .single();

                if (error) throw error;

                userFavorites = data?.toolbox_favorites || [];
            } catch (err) {
                console.error('Error loading favorites:', err);
                userFavorites = [];
            }
        }

        async function toggleFavorite(appId) {
            const index = userFavorites.indexOf(appId);

            if (index > -1) {
                // Remove from favorites
                userFavorites.splice(index, 1);
                WardApp.showToast('☆ Removido dos favoritos');
            } else {
                // Add to favorites (limit to 6)
                if (userFavorites.length >= 6) {
                    WardApp.showToast('⚠️ Você pode ter no máximo 6 favoritos. Remova algum primeiro.', 'warning');
                    return;
                }
                userFavorites.push(appId);
                WardApp.showToast('⭐ Adicionado aos favoritos!');
            }

            // Save to database
            try {
                const { error } = await WardApp.db
                    .from('users')
                    .update({ toolbox_favorites: userFavorites })
                    .eq('id', userData.id);

                if (error) throw error;

                // Re-render to update UI
                renderApps();
            } catch (err) {
                console.error('Error saving favorites:', err);
                WardApp.showToast('Erro ao salvar favorito', 'error');
            }
        }

        function openApp(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;

            // Update URL for sharing (without reloading page)
            const newUrl = `${window.location.pathname}?app=${appId}`;
            window.history.pushState({ appId }, app.title, newUrl);

            // Update modal title
            document.getElementById('modal-app-title').textContent = app.title;

            // Show modal
            document.getElementById('app-modal').classList.add('active');

            // Load app in iframe
            const iframe = document.getElementById('app-iframe');
            const loading = document.getElementById('app-loading');

            loading.style.display = 'block';
            iframe.style.display = 'none';

            iframe.onload = function() {
                loading.style.display = 'none';
                iframe.style.display = 'block';
            };

            iframe.src = app.file;

            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }

        function closeApp() {
            const modal = document.getElementById('app-modal');
            const iframe = document.getElementById('app-iframe');
            const modalContent = document.querySelector('.app-modal-content');
            const exitBtn = document.getElementById('fullscreen-exit-btn');

            // Exit fullscreen if active
            modalContent.classList.remove('fullscreen');
            exitBtn.classList.remove('visible');

            modal.classList.remove('active');
            iframe.src = '';

            // Restore body scroll
            document.body.style.overflow = '';

            // Restore URL without app parameter
            window.history.pushState({}, 'Toolbox', window.location.pathname);
        }

        // Handle browser back/forward navigation
        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.appId) {
                openApp(e.state.appId);
            } else {
                // Close app if open
                const modal = document.getElementById('app-modal');
                if (modal.classList.contains('active')) {
                    const iframe = document.getElementById('app-iframe');
                    const modalContent = document.querySelector('.app-modal-content');
                    const exitBtn = document.getElementById('fullscreen-exit-btn');
                    modalContent.classList.remove('fullscreen');
                    exitBtn.classList.remove('visible');
                    modal.classList.remove('active');
                    iframe.src = '';
                    document.body.style.overflow = '';
                }
            }
        });

        function toggleFullscreen() {
            const modalContent = document.querySelector('.app-modal-content');
            const exitBtn = document.getElementById('fullscreen-exit-btn');

            modalContent.classList.toggle('fullscreen');
            exitBtn.classList.toggle('visible');
        }

        // Close modal on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeApp();
            }
        });

        // Close modal when clicking outside
        document.getElementById('app-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeApp();
            }
        });

    </script>
</body>
</html>
