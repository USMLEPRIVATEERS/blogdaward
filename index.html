<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">🎓</div>
            <h1 class="login-title">WARD ACADEMY</h1>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="identifier">CPF ou Email</label>
                    <input
                        type="text"
                        id="identifier"
                        class="form-input"
                        placeholder="000.000.000-00 ou email@exemplo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    ENTRAR
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; text-align: center;">
                <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">
                    Quer fazer nossos Self Assessments gratuitos?
                </p>
                <a href="register.html" class="btn btn-secondary btn-block" style="display: block; text-decoration: none; padding: 0.875rem 1.5rem; background: #f9fafb; border: 2px solid #d97706; color: #d97706; border-radius: 8px; font-weight: 600; transition: all 0.2s ease;">
                    CADASTRAR
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        const identifierInput = document.getElementById('identifier');

        // Apply CPF mask only when user is typing numbers
        identifierInput.addEventListener('input', function(e) {
            let value = e.target.value;

            // Check if it looks like a CPF (only digits and formatting chars)
            const isLikelyCPF = /^[\d.\-]*$/.test(value) && !value.includes('@');

            if (isLikelyCPF) {
                // Remove non-digits
                let digits = value.replace(/\D/g, '');

                if (digits.length <= 11) {
                    // Apply CPF mask 000.000.000-00
                    digits = digits.replace(/(\d{3})(\d)/, '$1.$2');
                    digits = digits.replace(/(\d{3})(\d)/, '$1.$2');
                    digits = digits.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    e.target.value = digits;
                }
            }
            // If it contains @ or letters, treat as email - no mask
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifierValue = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            if (!identifierValue || !password) {
                WardApp.showToast('Preencha todos os campos', 'error');
                return;
            }

            // Determine if it's email or CPF
            const isEmail = identifierValue.includes('@');
            let identifier = identifierValue;

            if (!isEmail) {
                // Remove CPF mask (keep only digits)
                identifier = identifierValue.replace(/\D/g, '');

                if (identifier.length !== 11) {
                    WardApp.showToast('CPF deve ter 11 digitos', 'error');
                    return;
                }
            }

            await WardApp.login(identifier, password);
        });
    </script>
</body>
</html>
