<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Plataforma de Mentoria USMLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <h1 class="logo">Ward Academy</h1>
                <p class="tagline">Mentoria de Old para Old</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="cpf-input">CPF (apenas números)</label>
                    <input 
                        type="text" 
                        id="cpf-input" 
                        placeholder="Digite seu CPF"
                        maxlength="11"
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="btn-primary">Acessar Plataforma</button>
                <p class="error-message" id="error-message"></p>
            </form>
            <div class="login-footer">
                <p>Dúvidas? Entre em contato com nossa equipe</p>
            </div>
        </div>
    </div>

    <!-- Plataforma Principal -->
    <div id="main-platform" class="platform-container" style="display: none;">
        <!-- Header -->
        <header class="platform-header">
            <div class="header-content">
                <!-- Menu Hambúrguer -->
                <button id="hamburger-menu" class="hamburger-btn" title="Menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                
                <!-- Logo e Home -->
                <div class="header-left">
                    <h1 class="platform-logo" id="home-btn">Ward Academy</h1>
                    <button id="home-button" class="btn-home" title="Voltar ao início">
                        <span class="home-icon">🏠</span>
                        <span class="home-text">Início</span>
                    </button>
                </div>
                
                <!-- Ações do Header -->
                <div class="header-actions">
                    <div class="search-container">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Buscar..."
                            autocomplete="off"
                        >
                        <span class="search-icon">🔍</span>

                        <!-- Dropdown de Resultados de Busca -->
                        <div id="search-dropdown" class="search-dropdown">
                            <div id="search-dropdown-content"></div>
                        </div>
                    </div>
                    <button id="theme-toggle" class="theme-toggle" title="Alternar tema">
                        <span id="theme-icon">🌙</span>
                    </button>
                    <button id="logout-btn" class="btn-logout">Sair</button>
                </div>
            </div>
        </header>

        <!-- Overlay para fechar sidebar em mobile -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Container Principal -->
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>Conteúdo</h2>
                </div>
                <div class="tutorial-tip" id="tutorial-tip">
                    <span class="tip-icon">💡</span>
                    <p>Clique nos tópicos para expandir e ver o conteúdo disponível</p>
                    <button class="close-tip" onclick="this.parentElement.style.display='none'">×</button>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav">
                    <!-- Navegação será gerada dinamicamente -->
                </nav>
            </aside>

            <!-- Área de Conteúdo -->
            <main class="content-area" id="content-area">
                <div class="welcome-screen">
                    <h1>Carregando... 🎓</h1>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
