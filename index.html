<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">🎓</div>
            <h1 class="login-title">WARD ACADEMY</h1>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        class="form-input"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    ENTRAR
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; text-align: center;">
                <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">
                    Quer fazer nossos Self Assessments gratuitos?
                </p>
                <button onclick="openRegisterModal()" class="btn btn-secondary btn-block" style="display: block; width: 100%; text-decoration: none; padding: 0.875rem 1.5rem; background: #f9fafb; border: 2px solid #d97706; color: #d97706; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; cursor: pointer;">
                    CADASTRAR
                </button>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="position: relative; background: white; border-radius: 16px; padding: 2rem; max-width: 450px; width: 90%; margin: 1rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <!-- Close X button -->
            <button onclick="closeRegisterModal()" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.5rem; color: #999; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s ease;"
                    onmouseover="this.style.background='#f3f4f6'; this.style.color='#333';"
                    onmouseout="this.style.background='none'; this.style.color='#999';">
                &times;
            </button>

            <div style="font-size: 3rem; margin-bottom: 1rem;">📋</div>
            <h2 style="font-size: 1.5rem; color: #1a1a1a; margin: 0 0 1.25rem 0;">Tipo de Cadastro</h2>

            <!-- Attention box -->
            <div style="background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem;">
                <p style="color: #92400e; font-size: 0.95rem; line-height: 1.6; margin: 0; font-weight: 500;">
                    O cadastro para quem <strong style="color: #78350f;">ja e membro assinante</strong> da Ward Academy e feito de maneira <strong style="color: #78350f;">manual pela nossa equipe</strong>.
                </p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <a href="https://wa.me/5517996777474?text=Ol%C3%A1%20Marcos!%20J%C3%A1%20paguei%20minha%20assinatura%20da%20Ward%20Academy%20e%20gostaria%20de%20ter%20meu%20cadastro%20feito%20na%20plataforma."
                   target="_blank"
                   style="display: block; padding: 1rem 1.5rem; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; border-radius: 10px; font-weight: 600; text-decoration: none; transition: all 0.2s ease;">
                    ✓ Ja paguei assinatura
                </a>
                <a href="/register"
                   style="display: block; padding: 1rem 1.5rem; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: white; border-radius: 10px; font-weight: 600; text-decoration: none; transition: all 0.2s ease;">
                    Continuar gratuitamente
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/security.js"></script>
    <script src="js/secure-auth.js"></script>
    <script>
        // Modal functions
        function openRegisterModal() {
            document.getElementById('register-modal').style.display = 'flex';
        }

        function closeRegisterModal() {
            document.getElementById('register-modal').style.display = 'none';
        }

        // Close modal on background click
        document.getElementById('register-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRegisterModal();
            }
        });

        // Máscara de CPF
        const cpfInput = document.getElementById('cpf');

        cpfInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é dígito

            if (value.length <= 11) {
                // Aplica a máscara 000.000.000-00
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const cpfFormatted = document.getElementById('cpf').value;
            const password = document.getElementById('password').value;

            // Remove a máscara do CPF (deixa apenas números)
            const cpf = cpfFormatted.replace(/\D/g, '');

            if (!cpf || !password) {
                showToast('Preencha todos os campos', 'error');
                return;
            }

            if (cpf.length !== 11) {
                showToast('CPF deve ter 11 dígitos', 'error');
                return;
            }

            // Validar CPF
            if (window.WardSecurity && !WardSecurity.validateCPF(cpf)) {
                showToast('CPF inválido', 'error');
                return;
            }

            // Verificar rate limiting
            if (window.WardSecurity && !WardSecurity.canAttemptLogin()) {
                const remaining = WardSecurity.getLoginLockoutTime();
                showToast(`Muitas tentativas. Aguarde ${remaining} segundos.`, 'error');
                return;
            }

            // Usar login seguro se disponível, senão fallback para login normal
            if (window.WardSecureAuth) {
                await WardSecureAuth.login(cpf, password);
            } else {
                await WardApp.login(cpf, password);
            }
        });
    </script>
</body>
</html>
