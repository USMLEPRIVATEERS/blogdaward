<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">🎓</div>
            <h1 class="login-title">WARD ACADEMY</h1>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        class="form-input"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    ENTRAR
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        // Máscara de CPF
        const cpfInput = document.getElementById('cpf');

        cpfInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é dígito

            if (value.length <= 11) {
                // Aplica a máscara 000.000.000-00
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const cpfFormatted = document.getElementById('cpf').value;
            const password = document.getElementById('password').value;

            // Remove a máscara do CPF (deixa apenas números)
            const cpf = cpfFormatted.replace(/\D/g, '');

            if (!cpf || !password) {
                WardApp.showToast('Preencha todos os campos', 'error');
                return;
            }

            if (cpf.length !== 11) {
                WardApp.showToast('CPF deve ter 11 dígitos', 'error');
                return;
            }

            await WardApp.login(cpf, password);
        });
    </script>
</body>
</html>
