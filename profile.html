<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Meu Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </div>

            <button class="mobile-menu-toggle">☰</button>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="cronograma.html" class="nav-link">Cronograma</a>
                <a href="links.html" class="nav-link">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="pesquisa.html" class="nav-link">Pesquisa</a>
            </nav>

            <div class="nav-user">
                <a href="profile.html" class="user-menu-btn active">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <h1 class="mb-4">👤 Meu Perfil</h1>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-target="#tab-basic">📋 Dados Basicos</button>
            <button class="tab" data-target="#tab-usmle">🎓 USMLE</button>
            <button class="tab" data-target="#tab-prep">📚 Preparacao</button>
            <button class="tab" data-target="#tab-research">🔬 Pesquisa</button>
            <button class="tab" data-target="#tab-clinical">🏥 Estagios</button>
        </div>

        <!-- Tab Content: Basic Data -->
        <div id="tab-basic" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    Dados Pessoais e Profissionais
                </div>
                <div class="card-body">
                    <form id="basic-form">
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="full_name">Nome Completo</label>
                                <input type="text" id="full_name" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-input" readonly>
                            </div>
                        </div>

                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="cpf">CPF</label>
                                <input type="text" id="cpf" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="orcid">ORCID</label>
                                <input type="text" id="orcid" class="form-input">
                            </div>
                        </div>

                        <h4 class="mt-3 mb-2">Endereco</h4>
                        <div class="form-group">
                            <label class="form-label" for="address_line1">Rua/Avenida</label>
                            <input type="text" id="address_line1" class="form-input">
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="address_line2">Numero/Complemento</label>
                                <input type="text" id="address_line2" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="city">Cidade</label>
                                <input type="text" id="city" class="form-input">
                            </div>
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="state">Estado</label>
                                <input type="text" id="state" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="zip_code">CEP</label>
                                <input type="text" id="zip_code" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="country">Pais</label>
                                <input type="text" id="country" class="form-input">
                            </div>
                        </div>

                        <h4 class="mt-3 mb-2">Formacao</h4>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="graduation_date">Data de Formatura</label>
                                <input type="date" id="graduation_date" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="medical_school">Faculdade</label>
                                <input type="text" id="medical_school" class="form-input">
                            </div>
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="current_institution">Instituicao Atual</label>
                                <input type="text" id="current_institution" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="current_specialty">Especialidade Atual</label>
                                <input type="text" id="current_specialty" class="form-input">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="intended_specialty_usa">Especialidade Pretendida nos EUA</label>
                            <input type="text" id="intended_specialty_usa" class="form-input">
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">💾 Salvar Alteracoes</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tab Content: USMLE -->
        <div id="tab-usmle" class="tab-content">
            <div class="card">
                <div class="card-header">
                    Dados do USMLE
                </div>
                <div class="card-body">
                    <form id="usmle-form">
                        <div class="form-group">
                            <label class="form-label">Caminho</label>
                            <select id="pathway" class="form-select">
                                <option value="traditional">USMLE Tradicional</option>
                                <option value="alternate">Alternate Pathway</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Tem Visto?</label>
                                <select id="has_visa" class="form-select">
                                    <option value="true">Sim</option>
                                    <option value="false">Nao</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="visa_type">Tipo de Visto</label>
                                <input type="text" id="visa_type" class="form-input">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="current_stage">Etapa Atual</label>
                            <input type="text" id="current_stage" class="form-input">
                        </div>

                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="next_exam">Proxima Prova</label>
                                <select id="next_exam" class="form-select">
                                    <option value="">Selecione</option>
                                    <option value="step1">Step 1</option>
                                    <option value="step2ck">Step 2 CK</option>
                                    <option value="step3">Step 3</option>
                                    <option value="oet">OET</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="next_exam_date">Data Prevista</label>
                                <input type="date" id="next_exam_date" class="form-input">
                            </div>
                        </div>

                        <h4 class="mt-3 mb-2">Planejamento</h4>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="first_pass_months">First Pass (meses)</label>
                                <input type="number" id="first_pass_months" class="form-input" min="1" max="12">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="second_pass_months">Second Pass (meses)</label>
                                <input type="number" id="second_pass_months" class="form-input" min="0" max="6">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="dedicated_months">Dedicated (meses)</label>
                                <input type="number" id="dedicated_months" class="form-input" min="0" max="3">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">💾 Salvar Alteracoes</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tab Content: Preparation -->
        <div id="tab-prep" class="tab-content">
            <div class="card">
                <div class="card-header">
                    UWorld e Anki
                </div>
                <div class="card-body">
                    <form id="prep-form">
                        <h4 class="mb-2">UWorld</h4>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Comprou?</label>
                                <select id="uworld_purchased" class="form-select">
                                    <option value="true">Sim</option>
                                    <option value="false">Nao</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ativou?</label>
                                <select id="uworld_activated" class="form-select">
                                    <option value="true">Sim</option>
                                    <option value="false">Nao</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="uworld_expiration">Vencimento</label>
                                <input type="date" id="uworld_expiration" class="form-input">
                            </div>
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="questions_done">Questoes Feitas</label>
                                <input type="number" id="questions_done" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="overall_percentage">% Geral de Acertos</label>
                                <input type="number" id="overall_percentage" class="form-input" min="0" max="100">
                            </div>
                        </div>

                        <h4 class="mt-3 mb-2">Anki</h4>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Baixou?</label>
                                <select id="anki_downloaded" class="form-select">
                                    <option value="true">Sim</option>
                                    <option value="false">Nao</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Usa AnKing?</label>
                                <select id="uses_anking" class="form-select">
                                    <option value="true">Sim</option>
                                    <option value="false">Nao</option>
                                    <option value="unknown">Nao conheco</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="anki_frequency">Frequencia</label>
                                <select id="anki_frequency" class="form-select">
                                    <option value="daily">Todos os dias</option>
                                    <option value="alternate">Dia sim, dia nao</option>
                                    <option value="few_times">Poucas vezes na semana</option>
                                    <option value="rarely">Quase nao uso</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="average_cards">Media cards/dia</label>
                                <input type="number" id="average_cards" class="form-input">
                            </div>
                        </div>

                        <h4 class="mt-3 mb-2">Ingles</h4>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="reading_level">Leitura</label>
                                <select id="reading_level" class="form-select">
                                    <option value="good">Sem problemas</option>
                                    <option value="needs_search">Pesquiso palavras</option>
                                    <option value="translating">Estou traduzindo</option>
                                    <option value="much_difficulty">Muita dificuldade</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="listening_level">Escuta</label>
                                <select id="listening_level" class="form-select">
                                    <option value="good">Sem problemas</option>
                                    <option value="needs_subtitles">Preciso legendas</option>
                                    <option value="difficulty">Dificuldade</option>
                                    <option value="much_difficulty">Muita dificuldade</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">💾 Salvar Alteracoes</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tab Content: Research -->
        <div id="tab-research" class="tab-content">
            <div class="card">
                <div class="card-header">
                    Dados de Pesquisa
                </div>
                <div class="card-body">
                    <form id="research-form">
                        <div class="form-group">
                            <label class="form-label" for="research_experience">Experiencia</label>
                            <select id="research_experience" class="form-select">
                                <option value="none">Nenhuma</option>
                                <option value="ongoing">Projetos em andamento</option>
                                <option value="congress">Apresentados em congresso</option>
                                <option value="not_indexed">Publicacoes nao indexadas</option>
                                <option value="pubmed">Publicacoes no PubMed</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="wants_research">Pretende fazer pesquisa na Ward?</label>
                            <select id="wants_research" class="form-select">
                                <option value="immediately">Sim, imediatamente</option>
                                <option value="after_usmle">Sim, depois do USMLE</option>
                                <option value="no">Nao</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="interest_areas">Areas de Interesse</label>
                            <textarea id="interest_areas" class="form-textarea" rows="3"
                                placeholder="Liste suas areas de interesse..."></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="target_institutions">Instituicoes Alvo</label>
                            <textarea id="target_institutions" class="form-textarea" rows="2"
                                placeholder="Liste instituicoes que deseja fazer networking..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">💾 Salvar Alteracoes</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tab Content: Clinical -->
        <div id="tab-clinical" class="tab-content">
            <div class="card">
                <div class="card-header">
                    Estagios e Observerships
                </div>
                <div class="card-body">
                    <form id="clinical-form">
                        <div class="form-group">
                            <label class="form-label">Fez clerkship nos EUA?</label>
                            <select id="did_clerkship" class="form-select">
                                <option value="true">Sim</option>
                                <option value="false">Nao</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ja fez observerships?</label>
                            <select id="did_observership" class="form-select">
                                <option value="true">Sim</option>
                                <option value="false">Nao</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="current_location">Onde mora?</label>
                            <select id="current_location" class="form-select">
                                <option value="brazil">Brasil</option>
                                <option value="usa">Estados Unidos</option>
                                <option value="other">Outro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="personal_story">Sua Historia</label>
                            <textarea id="personal_story" class="form-textarea" rows="4"
                                placeholder="Conte um pouco sobre sua trajetoria..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">💾 Salvar Alteracoes</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        let userData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Initialize tabs
            initTabs();

            // Load all data
            await loadAllData();
        });

        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                    tab.classList.add('active');
                    document.querySelector(tab.dataset.target).classList.add('active');
                });
            });
        }

        async function loadAllData() {
            WardApp.showLoading();

            // Load all questionnaire data at once
            const { data: allData } = await WardApp.db
                .from('questionnaire_data')
                .select('step, data')
                .eq('user_id', userData.id);

            // Create a map of step -> data
            const stepData = {};
            (allData || []).forEach(item => {
                stepData[item.step] = item.data || {};
            });

            // Step 1: Basic data
            const basicData = stepData[1] || {};
            document.getElementById('full_name').value = basicData.full_name || userData.full_name || '';
            document.getElementById('email').value = userData.email || '';
            document.getElementById('cpf').value = basicData.cpf || '';
            document.getElementById('orcid').value = basicData.orcid || '';
            document.getElementById('address_line1').value = basicData.address_line1 || '';
            document.getElementById('address_line2').value = basicData.address_line2 || '';
            document.getElementById('city').value = basicData.city || '';
            document.getElementById('state').value = basicData.state || '';
            document.getElementById('zip_code').value = basicData.zip_code || '';
            document.getElementById('country').value = basicData.country || '';
            document.getElementById('graduation_date').value = basicData.graduation_date || '';
            document.getElementById('medical_school').value = basicData.medical_school || '';
            document.getElementById('current_institution').value = basicData.current_institution || '';
            document.getElementById('current_specialty').value = basicData.current_specialty || '';
            document.getElementById('intended_specialty_usa').value = basicData.intended_specialty_usa || '';

            // Step 2: USMLE data
            const usmleData = stepData[2] || {};
            document.getElementById('pathway').value = usmleData.pathway || 'traditional';
            document.getElementById('has_visa').value = String(usmleData.has_visa || false);
            document.getElementById('visa_type').value = usmleData.visa_type || '';
            document.getElementById('current_stage').value = usmleData.current_stage || '';
            document.getElementById('next_exam').value = usmleData.next_exam || '';
            document.getElementById('next_exam_date').value = usmleData.next_exam_date || '';
            document.getElementById('first_pass_months').value = usmleData.first_pass_months || 6;
            document.getElementById('second_pass_months').value = usmleData.second_pass_months || 2;
            document.getElementById('dedicated_months').value = usmleData.dedicated_months || 1;

            // Step 3 & 4: UWorld data
            const uworldData = stepData[3] || stepData[4] || {};
            document.getElementById('uworld_purchased').value = String(uworldData.purchased || false);
            document.getElementById('uworld_activated').value = String(uworldData.activated || false);
            document.getElementById('uworld_expiration').value = uworldData.expiration_date || '';
            document.getElementById('questions_done').value = uworldData.questions_done || '';
            document.getElementById('overall_percentage').value = uworldData.overall_percentage || '';

            // Step 5: English
            const englishData = stepData[5] || {};
            document.getElementById('reading_level').value = englishData.reading_level || 'good';
            document.getElementById('listening_level').value = englishData.listening_level || 'good';

            // Step 6: Anki data
            const ankiData = stepData[6] || {};
            document.getElementById('anki_downloaded').value = String(ankiData.downloaded || false);
            document.getElementById('uses_anking').value = ankiData.uses_anking || 'true';
            document.getElementById('anki_frequency').value = ankiData.frequency || 'daily';
            document.getElementById('average_cards').value = ankiData.average_cards_per_day || '';

            // Steps 7-9: Research data
            const researchData = stepData[7] || stepData[8] || stepData[9] || {};
            document.getElementById('research_experience').value = researchData.experience_level || 'none';
            document.getElementById('wants_research').value = researchData.wants_research_ward || 'immediately';
            const interests = researchData.interest_areas;
            document.getElementById('interest_areas').value = Array.isArray(interests) ? interests.join(', ') : (interests || '');
            const institutions = researchData.target_institutions;
            document.getElementById('target_institutions').value = Array.isArray(institutions) ? institutions.join(', ') : (institutions || '');

            // Step 10: Observerships
            const observerData = stepData[10] || {};
            document.getElementById('did_clerkship').value = String(observerData.did_clerkship || false);
            document.getElementById('did_observership').value = String(observerData.did_observership || false);

            // Step 11: Background
            const backgroundData = stepData[11] || {};
            document.getElementById('current_location').value = backgroundData.current_location || 'brazil';
            document.getElementById('personal_story').value = backgroundData.personal_story || '';

            WardApp.hideLoading();
        }

        // Helper function to save questionnaire data
        async function saveQuestionnaireStep(step, data) {
            // Check if record exists
            const { data: existing } = await WardApp.db
                .from('questionnaire_data')
                .select('id')
                .eq('user_id', userData.id)
                .eq('step', step)
                .maybeSingle();

            if (existing) {
                await WardApp.db
                    .from('questionnaire_data')
                    .update({ data: data, updated_at: new Date().toISOString() })
                    .eq('user_id', userData.id)
                    .eq('step', step);
            } else {
                await WardApp.db
                    .from('questionnaire_data')
                    .insert({ user_id: userData.id, step: step, data: data });
            }
        }

        // Form submissions
        document.getElementById('basic-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('full_name').value,
                cpf: document.getElementById('cpf').value,
                orcid: document.getElementById('orcid').value,
                address_line1: document.getElementById('address_line1').value,
                address_line2: document.getElementById('address_line2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip_code: document.getElementById('zip_code').value,
                country: document.getElementById('country').value,
                graduation_date: document.getElementById('graduation_date').value,
                medical_school: document.getElementById('medical_school').value,
                current_institution: document.getElementById('current_institution').value,
                current_specialty: document.getElementById('current_specialty').value,
                intended_specialty_usa: document.getElementById('intended_specialty_usa').value
            };

            await saveQuestionnaireStep(1, data);

            // Also update full_name on users table
            if (data.full_name) {
                await WardApp.db.from('users').update({ full_name: data.full_name }).eq('id', userData.id);
            }

            WardApp.showToast('Dados salvos com sucesso!');
        });

        document.getElementById('usmle-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                pathway: document.getElementById('pathway').value,
                has_visa: document.getElementById('has_visa').value === 'true',
                visa_type: document.getElementById('visa_type').value,
                current_stage: document.getElementById('current_stage').value,
                next_exam: document.getElementById('next_exam').value,
                next_exam_date: document.getElementById('next_exam_date').value,
                first_pass_months: parseInt(document.getElementById('first_pass_months').value),
                second_pass_months: parseInt(document.getElementById('second_pass_months').value),
                dedicated_months: parseInt(document.getElementById('dedicated_months').value)
            };

            await saveQuestionnaireStep(2, data);
            WardApp.showToast('Dados salvos com sucesso!');
        });

        document.getElementById('prep-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // UWorld (step 3)
            await saveQuestionnaireStep(3, {
                purchased: document.getElementById('uworld_purchased').value === 'true',
                activated: document.getElementById('uworld_activated').value === 'true',
                expiration_date: document.getElementById('uworld_expiration').value,
                questions_done: parseInt(document.getElementById('questions_done').value) || null,
                overall_percentage: parseInt(document.getElementById('overall_percentage').value) || null
            });

            // English (step 5)
            await saveQuestionnaireStep(5, {
                reading_level: document.getElementById('reading_level').value,
                listening_level: document.getElementById('listening_level').value
            });

            // Anki (step 6)
            await saveQuestionnaireStep(6, {
                downloaded: document.getElementById('anki_downloaded').value === 'true',
                uses_anking: document.getElementById('uses_anking').value,
                frequency: document.getElementById('anki_frequency').value,
                average_cards_per_day: parseInt(document.getElementById('average_cards').value) || null
            });

            WardApp.showToast('Dados salvos com sucesso!');
        });

        document.getElementById('research-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                experience_level: document.getElementById('research_experience').value,
                wants_research_ward: document.getElementById('wants_research').value,
                interest_areas: document.getElementById('interest_areas').value.split(',').map(s => s.trim()).filter(s => s),
                target_institutions: document.getElementById('target_institutions').value.split(',').map(s => s.trim()).filter(s => s)
            };

            await saveQuestionnaireStep(7, data);
            WardApp.showToast('Dados salvos com sucesso!');
        });

        document.getElementById('clinical-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Observerships (step 10)
            await saveQuestionnaireStep(10, {
                did_clerkship: document.getElementById('did_clerkship').value === 'true',
                did_observership: document.getElementById('did_observership').value === 'true'
            });

            // Background (step 11)
            await saveQuestionnaireStep(11, {
                current_location: document.getElementById('current_location').value,
                personal_story: document.getElementById('personal_story').value
            });

            WardApp.showToast('Dados salvos com sucesso!');
        });
    </script>
</body>
</html>
