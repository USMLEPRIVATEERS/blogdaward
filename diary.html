<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Meu Diário</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Aliases locais (a página usa tokens que não existem no style.css) */
        :root {
            --primary-color: var(--accent-orange, #C45700);
            --white: var(--primary-white, #FFFFFF);
            --radius-md: 10px;
            --radius-full: 999px;
        }
        .diary-tabs {
            display: flex;
            gap: 0.75rem;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 2rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .diary-tab {
            padding: 0.85rem 1.25rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: var(--radius-sm, 8px) var(--radius-sm, 8px) 0 0;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--gray-500);
            white-space: nowrap;
            transition: color var(--transition-fast, 0.15s ease), background-color var(--transition-fast, 0.15s ease), border-color var(--transition-fast, 0.15s ease);
        }
        .diary-tab:hover {
            color: var(--primary-color);
            background: var(--gray-50);
        }
        .diary-tab:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: -2px;
        }
        .diary-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* Cards de estatísticas (harmonizados com diary-study/diary-uworld) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg, 14px);
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(16, 24, 40, 0.06));
            transition: box-shadow var(--transition-fast, 0.15s ease), border-color var(--transition-fast, 0.15s ease);
        }
        .stat-card:hover {
            border-color: var(--gray-300);
            box-shadow: var(--shadow-md, 0 2px 4px rgba(16, 24, 40, 0.05), 0 4px 10px rgba(16, 24, 40, 0.07));
        }
        .stat-icon {
            font-size: 1.35rem;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-50);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius-md);
        }
        .stat-info {
            min-width: 0;
        }
        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            line-height: 1.25;
            color: var(--primary-black, #111827);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--gray-500);
        }

        .diary-entry {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg, 14px);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(16, 24, 40, 0.06));
            transition: box-shadow var(--transition-fast, 0.15s ease), border-color var(--transition-fast, 0.15s ease);
        }
        .diary-entry:hover {
            border-color: var(--gray-300);
            box-shadow: var(--shadow-md, 0 2px 4px rgba(16, 24, 40, 0.05), 0 4px 10px rgba(16, 24, 40, 0.07));
        }
        .diary-entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--gray-100);
        }
        .diary-entry-type {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--gray-800);
        }
        .diary-entry-date {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--gray-500);
        }
        .diary-entry-content {
            color: var(--gray-700);
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .diary-stats {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            /* Neutraliza o visual de grid herdado do .diary-stats global */
            padding: 0;
            margin-bottom: 0;
            background: transparent;
            border-radius: 0;
        }
        .diary-stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.9rem;
            background: var(--gray-100);
            border: 1px solid rgba(17, 24, 39, 0.08);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--gray-700);
        }
        .empty-diary {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray-500);
            background: var(--gray-50);
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius-lg, 14px);
        }
        .empty-diary-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            .diary-tab {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
            .stat-card {
                padding: 1rem;
                gap: 0.75rem;
            }
            .diary-entry {
                padding: 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .diary-tab,
            .stat-card,
            .diary-entry {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/cronograma" class="nav-link">Cronograma</a>
                <a href="/links" class="nav-link">Links</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/pesquisa" class="nav-link">Pesquisa</a>
                <a href="/diary" class="nav-link active">Diário</a>
            </nav>
            <div class="nav-user">
                <a href="/profile" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="d-flex justify-between align-center flex-wrap gap-2 mb-4">
            <h1>📔 Meu Diário</h1>
            <div class="btn-group">
                <a href="/diary-study" class="btn btn-outline">📓 Diário de Estudos Completo</a>
                <a href="/diary-uworld" class="btn btn-outline">📊 Diário UWorld Completo</a>
            </div>
        </div>

        <!-- Tabs -->
        <div class="diary-tabs">
            <button class="diary-tab active" onclick="switchTab('all')" id="tab-all">
                📖 Todas as Entradas
            </button>
            <button class="diary-tab" onclick="switchTab('study')" id="tab-study">
                📓 Estudos
            </button>
            <button class="diary-tab" onclick="switchTab('uworld')" id="tab-uworld">
                📊 UWorld
            </button>
        </div>

        <!-- Stats Overview -->
        <div class="stats-grid mb-4">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-info">
                    <span class="stat-value" id="total-study-entries">0</span>
                    <span class="stat-label">Entradas de Estudo</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <span class="stat-value" id="total-uworld-entries">0</span>
                    <span class="stat-label">Entradas UWorld</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-value" id="total-entries">0</span>
                    <span class="stat-label">Total de Entradas</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-info">
                    <span class="stat-value" id="last-entry-date">-</span>
                    <span class="stat-label">Última Entrada</span>
                </div>
            </div>
        </div>

        <!-- Diary Entries -->
        <div id="diary-entries-container">
            <div class="empty-diary">
                <div class="empty-diary-icon">📔</div>
                <p>Carregando entradas do diário...</p>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let currentTab = 'all';
        let allStudyEntries = [];
        let allUWorldEntries = [];
        let userData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth
            const user = localStorage.getItem('ward_user');
            if (!user) {
                window.location.href = '/';
                return;
            }

            userData = JSON.parse(user);

            // Load all diary entries
            await loadDiaryEntries();
        });

        async function loadDiaryEntries() {
            try {
                // Load study diary entries
                const { data: studyEntries, error: studyError } = await WardApp.db
                    .from('study_diary')
                    .select('*')
                    .eq('user_id', userData.id)
                    .order('created_at', { ascending: false });

                // Load UWorld diary entries
                const { data: uworldEntries, error: uworldError } = await WardApp.db
                    .from('uworld_diary')
                    .select('*')
                    .eq('user_id', userData.id)
                    .order('created_at', { ascending: false });

                if (studyError) console.error('Error loading study entries:', studyError);
                if (uworldError) console.error('Error loading uworld entries:', uworldError);

                allStudyEntries = studyEntries || [];
                allUWorldEntries = uworldEntries || [];

                updateStats();
                renderEntries();
            } catch (error) {
                console.error('Error loading diary:', error);
                WardApp.showToast('Erro ao carregar diário', 'error');
            }
        }

        function updateStats() {
            const totalStudy = allStudyEntries.length;
            const totalUWorld = allUWorldEntries.length;
            const total = totalStudy + totalUWorld;

            document.getElementById('total-study-entries').textContent = totalStudy;
            document.getElementById('total-uworld-entries').textContent = totalUWorld;
            document.getElementById('total-entries').textContent = total;

            // Find last entry date
            const allDates = [
                ...allStudyEntries.map(e => e.created_at),
                ...allUWorldEntries.map(e => e.created_at)
            ].sort((a, b) => new Date(b) - new Date(a));

            if (allDates.length > 0) {
                document.getElementById('last-entry-date').textContent = WardApp.formatDate(allDates[0]);
            } else {
                document.getElementById('last-entry-date').textContent = '-';
            }
        }

        function switchTab(tab) {
            currentTab = tab;

            // Update active tab UI
            document.querySelectorAll('.diary-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            renderEntries();
        }

        function renderEntries() {
            const container = document.getElementById('diary-entries-container');
            let entriesToShow = [];

            if (currentTab === 'all') {
                // Combine both types and sort by date
                entriesToShow = [
                    ...allStudyEntries.map(e => ({ ...e, type: 'study' })),
                    ...allUWorldEntries.map(e => ({ ...e, type: 'uworld' }))
                ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (currentTab === 'study') {
                entriesToShow = allStudyEntries.map(e => ({ ...e, type: 'study' }));
            } else if (currentTab === 'uworld') {
                entriesToShow = allUWorldEntries.map(e => ({ ...e, type: 'uworld' }));
            }

            if (entriesToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-diary">
                        <div class="empty-diary-icon">📔</div>
                        <p>Nenhuma entrada encontrada</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                            ${currentTab === 'all' ? 'Comece criando uma entrada nos diários específicos' : ''}
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = entriesToShow.map(entry => {
                if (entry.type === 'study') {
                    return `
                        <div class="diary-entry">
                            <div class="diary-entry-header">
                                <div class="diary-entry-type">
                                    <span>📓</span>
                                    <span>Diário de Estudos</span>
                                </div>
                                <div class="diary-entry-date">${WardApp.formatDate(entry.created_at)}</div>
                            </div>
                            <div class="diary-entry-content">${entry.entry_text || entry.content || 'Sem conteúdo'}</div>
                            ${entry.hours_studied ? `
                                <div class="diary-stats">
                                    <div class="diary-stat-badge">
                                        ⏱️ ${entry.hours_studied}h estudadas
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    const percentage = entry.questions_correct && entry.questions_total
                        ? Math.round((entry.questions_correct / entry.questions_total) * 100)
                        : 0;
                    return `
                        <div class="diary-entry">
                            <div class="diary-entry-header">
                                <div class="diary-entry-type">
                                    <span>📊</span>
                                    <span>Diário UWorld</span>
                                </div>
                                <div class="diary-entry-date">${WardApp.formatDate(entry.created_at)}</div>
                            </div>
                            ${entry.system_name ? `<div style="font-weight: 600; color: var(--primary-color); margin-bottom: 0.5rem;">System: ${entry.system_name}</div>` : ''}
                            ${entry.difficulties ? `<div class="diary-entry-content">${entry.difficulties}</div>` : ''}
                            <div class="diary-stats">
                                ${entry.questions_total ? `
                                    <div class="diary-stat-badge">
                                        📝 ${entry.questions_total} questões
                                    </div>
                                ` : ''}
                                ${entry.questions_correct ? `
                                    <div class="diary-stat-badge" style="background: ${percentage >= 70 ? '#d1fae5' : percentage >= 50 ? '#fef3c7' : '#fee2e2'}; color: ${percentage >= 70 ? '#047857' : percentage >= 50 ? '#92400e' : '#991b1b'};">
                                        ✓ ${entry.questions_correct} acertos (${percentage}%)
                                    </div>
                                ` : ''}
                                ${entry.time_spent_minutes ? `
                                    <div class="diary-stat-badge">
                                        ⏱️ ${entry.time_spent_minutes} min
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }
    </script>
</body>
</html>
