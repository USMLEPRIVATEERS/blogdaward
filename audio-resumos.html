<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Audio Resumos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Clean theme for audio page */
        .audio-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: calc(100vh - 60px);
            padding: 2rem 1rem;
        }

        /* Breadcrumb navigation */
        .audio-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .breadcrumb-item:hover {
            color: #fff;
        }

        .breadcrumb-item.active {
            color: #e94560;
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: rgba(255,255,255,0.3);
        }

        /* Page title */
        .page-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .page-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Search bar */
        .search-container {
            margin-bottom: 1.5rem;
            max-width: 600px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            color: rgba(255,255,255,0.5);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
            background: rgba(255,255,255,0.08);
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* Category cards grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .category-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        .category-card-image {
            height: 140px;
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .category-card-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.08)"/><circle cx="40" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
        }

        .category-icon {
            font-size: 3.5rem;
            z-index: 1;
        }

        .category-card-content {
            padding: 1.25rem;
        }

        .category-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .category-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        .category-count {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            color: #e94560;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* Audio Player Section */
        .audio-section {
            display: none;
        }

        .audio-section.active {
            display: block;
        }

        .audio-player-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        /* Audio Visualizer - Real Frequency Bars */
        .visualizer-container {
            height: 150px;
            background: linear-gradient(180deg, rgba(233, 69, 96, 0.15) 0%, rgba(15, 52, 96, 0.1) 100%);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            padding: 1rem 1rem 0.5rem;
            border-radius: 12px 12px 0 0;
        }

        .visualizer-bar {
            flex: 1;
            max-width: 8px;
            min-width: 3px;
            background: linear-gradient(180deg, #e94560 0%, #ff6b8a 50%, #0f3460 100%);
            border-radius: 4px 4px 0 0;
            min-height: 3px;
            transition: height 0.05s ease-out;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .visualizer-bar.active {
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        /* Hidden audio element for Web Audio API */
        #audio-element {
            display: none;
        }

        /* Custom Audio Controls */
        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin: 1rem;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e94560 0%, #ff6b8a 100%);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .time-display {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-family: monospace;
            min-width: 50px;
            text-align: center;
        }

        .progress-container {
            flex: 1;
            max-width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-container:hover .progress-bar {
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .volume-icon {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: none;
        }

        /* Google Drive Player Container */
        .gdrive-player-container {
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin: 1rem;
        }

        .gdrive-player-container iframe {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 8px;
        }

        /* Audio Info */
        .audio-info {
            padding: 1.5rem;
            text-align: center;
        }

        .audio-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .audio-path {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Playlist */
        .playlist-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .playlist-header {
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .playlist-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .playlist-count {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }

        .playlist-items {
            max-height: 400px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .playlist-item.active {
            background: rgba(233, 69, 96, 0.1);
            border-left: 3px solid #e94560;
        }

        .playlist-item-number {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            min-width: 24px;
        }

        .playlist-item.active .playlist-item-number {
            color: #e94560;
            font-weight: 600;
        }

        .playlist-item-info {
            flex: 1;
        }

        .playlist-item-title {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            line-height: 1.3;
        }

        .playlist-item-duration {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
        }

        .playlist-item-icon {
            color: rgba(255,255,255,0.4);
            font-size: 1.25rem;
        }

        .playlist-item.active .playlist-item-icon {
            color: #e94560;
        }

        /* Back button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Empty state */
        .empty-category {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.5);
        }

        .empty-category-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-category h3 {
            color: #fff;
            margin-bottom: 0.5rem;
        }

        /* Audio player layout */
        .audio-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .audio-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar styling */
        .playlist-items::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-items::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .playlist-items::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .playlist-items::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        /* Loading state */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.6);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Description */
        .audio-description {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        /* Playing indicator */
        .playing-indicator {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            margin-left: 0.5rem;
        }

        .playing-indicator span {
            width: 3px;
            background: #e94560;
            border-radius: 2px;
            animation: equalizer 0.5s ease-in-out infinite alternate;
        }

        .playing-indicator span:nth-child(1) { animation-delay: 0s; }
        .playing-indicator span:nth-child(2) { animation-delay: 0.1s; }
        .playing-indicator span:nth-child(3) { animation-delay: 0.2s; }
        .playing-indicator span:nth-child(4) { animation-delay: 0.3s; }

        @keyframes equalizer {
            from { height: 4px; }
            to { height: 16px; }
        }

        /* Instructions */
        .player-instructions {
            text-align: center;
            padding: 0.75rem;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            margin: 0 1rem 1rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        .player-instructions strong {
            color: #e94560;
        }

        /* Share button */
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .share-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        /* Comments section */
        .comments-section {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .comments-header {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .comment-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .comment-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
        }

        .comment-input:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(255,255,255,0.08);
        }

        .comment-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .comment-submit {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .comment-submit:hover {
            background: #d03550;
        }

        .comment-item {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .comment-content {
            flex: 1;
        }

        .comment-author {
            color: #e94560;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .comment-text {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .comment-time {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .no-comments {
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* Description formatting */
        .audio-description a {
            color: #e94560;
            text-decoration: underline;
        }

        .audio-description strong, .audio-description b {
            color: #fff;
            font-weight: 600;
        }

        .audio-description ul, .audio-description ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .audio-description li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="cronograma.html" class="nav-link">Cronograma</a>
                <a href="landmarks.html" class="nav-link">Chamadas</a>
                <a href="curso.html" class="nav-link">Curso</a>
                <a href="links.html" class="nav-link">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="pesquisa.html" class="nav-link">Pesquisa</a>
            </nav>
            <div class="nav-user">
                <a href="profile.html" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <div class="audio-container">
        <div class="container">
            <!-- Back to Course button -->
            <div class="back-button" onclick="window.location.href='curso.html'">
                ← Voltar para Cursos
            </div>

            <!-- Page Title -->
            <h1 class="page-title">🎧 Audio Resumos</h1>
            <p class="page-subtitle">Resumos em audio para estudar em qualquer lugar</p>

            <!-- Breadcrumb -->
            <div class="audio-breadcrumb" id="breadcrumb">
                <!-- Filled by JS -->
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        placeholder="Buscar audio resumos..."
                        oninput="filterAudios()"
                    >
                </div>
            </div>

            <!-- Categories View -->
            <div id="categories-view">
                <div class="categories-grid" id="categories-grid">
                    <!-- Filled by JS -->
                </div>
            </div>

            <!-- Audio Player View -->
            <div class="audio-section" id="audio-section">
                <div class="audio-layout">
                    <div class="audio-main">
                        <div class="audio-player-container">
                            <!-- Real Audio Visualizer -->
                            <div class="visualizer-container" id="visualizer">
                                <!-- Bars generated by JS -->
                            </div>

                            <!-- Hidden audio element for Web Audio API -->
                            <audio id="audio-element" crossorigin="anonymous"></audio>

                            <!-- Custom Audio Controls -->
                            <div class="audio-controls">
                                <span class="time-display" id="current-time">0:00</span>
                                <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                                <div class="progress-container" id="progress-container">
                                    <div class="progress-bar" id="progress-bar"></div>
                                </div>
                                <span class="time-display" id="duration">0:00</span>
                                <div class="volume-container">
                                    <span class="volume-icon" onclick="toggleMute()">🔊</span>
                                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                                </div>
                            </div>

                            <!-- Audio Info -->
                            <div class="audio-info">
                                <h2 class="audio-title" id="audio-title">Selecione um audio</h2>
                                <p class="audio-path" id="audio-path"></p>
                                <button class="share-btn" onclick="copyAudioLink()">
                                    🔗 Copiar Link
                                </button>
                            </div>

                            <!-- Navigation buttons -->
                            <div class="nav-buttons">
                                <button class="nav-btn" id="prev-btn" onclick="previousTrack()">
                                    ⏮️ Anterior
                                </button>
                                <button class="nav-btn" id="next-btn" onclick="nextTrack()">
                                    Proximo ⏭️
                                </button>
                            </div>

                            <!-- Description -->
                            <div class="audio-description" id="audio-description" style="display: none;">
                            </div>

                            <!-- Comments -->
                            <div class="comments-section">
                                <h3 class="comments-header">Comentarios</h3>
                                <div class="comment-form">
                                    <input type="text" class="comment-input" id="comment-input" placeholder="Adicione um comentario...">
                                    <button class="comment-submit" onclick="addComment()">Enviar</button>
                                </div>
                                <div id="comments-list">
                                    <!-- Comments loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Playlist Sidebar -->
                    <div class="playlist-container">
                        <div class="playlist-header">
                            <div class="playlist-title" id="playlist-title">Audios</div>
                            <div class="playlist-count" id="playlist-count"></div>
                        </div>
                        <div class="playlist-items" id="playlist-items">
                            <!-- Playlist items filled by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        let userData = null;
        let allAudios = [];
        let currentPath = [];
        let currentAudio = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationId = null;

        // Category icons mapping
        const categoryIcons = {
            'USMLE': '🩺',
            'STEP_1': '1️⃣',
            'STEP_2': '2️⃣',
            'STEP_3': '3️⃣',
            'PESQUISA': '🔬',
            'META_ANALISE': '📊',
            'WARD_ACADEMY': '🎓',
            'INTRODUCAO': '📖',
            'RECURSOS': '📚',
            'MATCH': '🏥',
            'OET': '🗣️',
            'VISA': '🛂',
            'DEFAULT': '🎧'
        };

        // Natural sort function
        function naturalSort(a, b) {
            const aParts = a.match(/(\d+|\D+)/g) || [];
            const bParts = b.match(/(\d+|\D+)/g) || [];
            const minLen = Math.min(aParts.length, bParts.length);

            for (let i = 0; i < minLen; i++) {
                const aPart = aParts[i];
                const bPart = bParts[i];
                const aIsNum = /^\d+$/.test(aPart);
                const bIsNum = /^\d+$/.test(bPart);

                if (aIsNum && bIsNum) {
                    const diff = parseInt(aPart, 10) - parseInt(bPart, 10);
                    if (diff !== 0) return diff;
                } else if (aIsNum !== bIsNum) {
                    return aIsNum ? -1 : 1;
                } else {
                    const cmp = aPart.localeCompare(bPart, 'pt-BR', { sensitivity: 'base' });
                    if (cmp !== 0) return cmp;
                }
            }
            return aParts.length - bParts.length;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Block assessoria users
            if (userData.role === 'assessoria') {
                alert('Esta pagina esta disponivel apenas para membros completos da Ward Academy.');
                window.location.href = 'dashboard-assessoria-avulsa.html';
                return;
            }

            // Initialize visualizer bars
            initVisualizer();

            // Initialize audio controls
            initAudioControls();

            // Load audios
            await loadAudios();

            // Check URL params
            const urlParams = new URLSearchParams(window.location.search);
            const audioIdParam = urlParams.get('audio');
            if (audioIdParam && allAudios.length > 0) {
                const audio = allAudios.find(a => a.id == audioIdParam);
                if (audio) {
                    showAudioFromSearch(audioIdParam);
                } else {
                    renderCategories();
                }
            } else {
                renderCategories();
            }
        });

        // Web Audio API Visualizer - Real Frequency Analysis
        let audioContext = null;
        let analyser = null;
        let source = null;
        let dataArray = null;
        let visualizerBars = [];
        const BAR_COUNT = 64;

        function initVisualizer() {
            const container = document.getElementById('visualizer');
            container.innerHTML = '';
            visualizerBars = [];

            for (let i = 0; i < BAR_COUNT; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '3px';
                container.appendChild(bar);
                visualizerBars.push(bar);
            }
        }

        function setupAudioContext() {
            const audio = document.getElementById('audio-element');

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;

                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function startVisualizer() {
            isPlaying = true;
            animateVisualizer();
        }

        function animateVisualizer() {
            if (!isPlaying || !analyser) {
                return;
            }

            analyser.getByteFrequencyData(dataArray);

            const barCount = visualizerBars.length;
            const step = Math.floor(dataArray.length / barCount);

            for (let i = 0; i < barCount; i++) {
                // Get average of frequency range for this bar
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    sum += dataArray[i * step + j];
                }
                const average = sum / step;

                // Scale to height (3px min, 140px max)
                const height = Math.max(3, (average / 255) * 140);
                visualizerBars[i].style.height = `${height}px`;

                // Add glow effect for high values
                if (average > 200) {
                    visualizerBars[i].classList.add('active');
                } else {
                    visualizerBars[i].classList.remove('active');
                }
            }

            animationId = requestAnimationFrame(animateVisualizer);
        }

        function stopVisualizer() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            // Fade out bars
            visualizerBars.forEach(bar => {
                bar.style.height = '3px';
                bar.classList.remove('active');
            });
        }

        // Audio Player Controls
        function togglePlay() {
            const audio = document.getElementById('audio-element');
            const playBtn = document.getElementById('play-btn');

            if (!audio.src) return;

            setupAudioContext();

            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                startVisualizer();
            } else {
                audio.pause();
                playBtn.textContent = '▶';
                stopVisualizer();
            }
        }

        function toggleMute() {
            const audio = document.getElementById('audio-element');
            const volumeIcon = document.querySelector('.volume-icon');
            const volumeSlider = document.getElementById('volume-slider');

            audio.muted = !audio.muted;
            volumeIcon.textContent = audio.muted ? '🔇' : '🔊';
            if (audio.muted) {
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = audio.volume;
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function initAudioControls() {
            const audio = document.getElementById('audio-element');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const volumeSlider = document.getElementById('volume-slider');
            const playBtn = document.getElementById('play-btn');

            // Time update
            audio.addEventListener('timeupdate', () => {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            });

            // Duration loaded
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            // Click on progress bar
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pos * audio.duration;
            });

            // Volume slider
            volumeSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
                audio.muted = false;
                document.querySelector('.volume-icon').textContent = audio.volume === 0 ? '🔇' : '🔊';
            });

            // Audio ended
            audio.addEventListener('ended', () => {
                playBtn.textContent = '▶';
                stopVisualizer();
                // Auto play next
                nextTrack();
            });

            // Audio error
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                alert('Erro ao carregar o audio. Verifique se o link esta correto.');
            });
        }

        // Get direct audio URL from Internet Archive
        function getInternetArchiveAudioUrl(url) {
            // URL format: https://archive.org/details/{identifier}
            // Direct audio: https://archive.org/download/{identifier}/{identifier}.mp3
            // Or check for specific file in the metadata

            const match = url.match(/archive\.org\/details\/([^\/\?]+)/);
            if (match) {
                const identifier = match[1];
                // Try common audio formats
                return `https://archive.org/download/${identifier}/${identifier}.mp3`;
            }
            return url;
        }

        // Get direct audio URL (supports multiple sources)
        function getDirectAudioUrl(url) {
            if (!url) return null;

            // Internet Archive
            if (url.includes('archive.org/details/')) {
                return getInternetArchiveAudioUrl(url);
            }

            // Internet Archive direct download link
            if (url.includes('archive.org/download/')) {
                return url;
            }

            // Supabase Storage (already direct)
            if (url.includes('supabase')) {
                return url;
            }

            // Google Drive - can't use directly (CORS), return null
            if (url.includes('drive.google.com')) {
                return null;
            }

            // Direct URL
            return url;
        }

        async function loadAudios() {
            const { data, error } = await WardApp.db
                .from('course_audios')
                .select('*')
                .eq('is_published', true)
                .order('order_position');

            if (error) {
                console.error('Error loading audios:', error);
                return;
            }

            allAudios = (data || []).filter(audio => !audio.is_hidden && audio.audio_url);
        }

        function getUniqueCategories(audios, depth = 0) {
            const categories = new Map();

            audios.forEach(audio => {
                const parts = audio.tags.split('::');
                if (parts.length > depth) {
                    const key = parts[depth];
                    const fullPath = parts.slice(0, depth + 1).join('::');

                    if (!categories.has(key)) {
                        categories.set(key, {
                            name: key.replace(/_/g, ' '),
                            path: fullPath,
                            count: 0,
                            hasChildren: false
                        });
                    }

                    categories.get(key).count++;

                    if (parts.length > depth + 1) {
                        categories.get(key).hasChildren = true;
                    }
                }
            });

            return Array.from(categories.values()).sort((a, b) => naturalSort(a.name, b.name));
        }

        function getAudiosForPath(path) {
            return allAudios.filter(a => a.tags.startsWith(path));
        }

        function getAudiosExactlyAtPath(path) {
            return allAudios.filter(a => a.tags === path);
        }

        function filterAudios() {
            const input = document.getElementById('search-input');
            const query = input.value.toLowerCase().trim();

            if (query) {
                const filtered = allAudios.filter(a => {
                    return a.title.toLowerCase().includes(query) ||
                           (a.description && a.description.toLowerCase().includes(query)) ||
                           a.tags.toLowerCase().includes(query);
                });

                if (filtered.length > 0) {
                    showSearchResults(filtered);
                } else {
                    showNoResults();
                }
            } else {
                renderCategories();
            }
        }

        function showSearchResults(audios) {
            document.getElementById('breadcrumb').innerHTML = '';

            const grid = document.getElementById('categories-grid');
            audios.sort((a, b) => (a.order_position || 0) - (b.order_position || 0));

            let html = audios.map(audio => `
                <div class="category-card" onclick="showAudioFromSearch('${audio.id}')">
                    <div class="category-card-image">
                        <span class="category-icon">🎧</span>
                    </div>
                    <div class="category-card-content">
                        <h3 class="category-title">${audio.title}</h3>
                        <p class="category-subtitle">${audio.tags.split('::').join(' > ')}</p>
                        ${audio.duration_minutes ? `<p class="category-subtitle">${audio.duration_minutes} min</p>` : ''}
                    </div>
                </div>
            `).join('');

            grid.innerHTML = html;
            document.getElementById('categories-view').style.display = 'block';
            document.getElementById('audio-section').classList.remove('active');
        }

        function showNoResults() {
            document.getElementById('breadcrumb').innerHTML = '';

            const grid = document.getElementById('categories-grid');
            grid.innerHTML = `
                <div class="empty-category" style="grid-column: 1 / -1;">
                    <div class="empty-category-icon">🔍</div>
                    <h3>Nenhum audio encontrado</h3>
                    <p>Tente buscar por outros termos</p>
                </div>
            `;
        }

        function showAudioFromSearch(audioId) {
            const audio = allAudios.find(a => a.id == audioId);
            if (audio) {
                const audioPath = audio.tags.split('::').slice(0, -1).join('::') || audio.tags;
                let audiosInPath = getAudiosForPath(audioPath);
                audiosInPath = [...audiosInPath].sort((a, b) => naturalSort(a.title, b.title));

                const audioIndex = audiosInPath.findIndex(a => a.id == audioId);
                showAudioSection(audiosInPath, audioIndex >= 0 ? audioIndex : 0);
            }
        }

        function renderCategories() {
            const currentPathStr = currentPath.join('::');
            const audiosInScope = currentPathStr
                ? getAudiosForPath(currentPathStr)
                : allAudios;

            const depth = currentPath.length;
            const categories = getUniqueCategories(audiosInScope, depth);

            const leafAudios = currentPathStr
                ? getAudiosExactlyAtPath(currentPathStr)
                : [];

            renderBreadcrumb();

            const grid = document.getElementById('categories-grid');

            if (leafAudios.length > 0 && categories.length === 0) {
                const sortedLeafAudios = [...leafAudios].sort((a, b) => naturalSort(a.title, b.title));
                showAudioSection(sortedLeafAudios, 0);
                return;
            }

            let html = '';

            if (categories.length === 0 && leafAudios.length === 0) {
                html = `
                    <div class="empty-category" style="grid-column: 1 / -1;">
                        <div class="empty-category-icon">🎧</div>
                        <h3>Nenhum audio encontrado</h3>
                        <p>Estamos trabalhando para adicionar mais conteudo em breve!</p>
                    </div>
                `;
            } else {
                categories.forEach(cat => {
                    const icon = categoryIcons[cat.name.replace(/ /g, '_').toUpperCase()] || categoryIcons.DEFAULT;

                    html += `
                        <div class="category-card" onclick="navigateToCategory('${cat.path}')">
                            <div class="category-card-image">
                                <span class="category-icon">${icon}</span>
                            </div>
                            <span class="category-count">${cat.count} ${cat.count === 1 ? 'audio' : 'audios'}</span>
                            <div class="category-card-content">
                                <h3 class="category-title">${cat.name}</h3>
                                <p class="category-subtitle">${cat.hasChildren ? 'Clique para explorar' : 'Ouvir audios'}</p>
                            </div>
                        </div>
                    `;
                });

                if (leafAudios.length > 0) {
                    leafAudios.sort((a, b) => naturalSort(a.title, b.title));

                    leafAudios.forEach(audio => {
                        html += `
                            <div class="category-card" onclick="showAudioFromCategory('${audio.id}')">
                                <div class="category-card-image">
                                    <span class="category-icon">🎧</span>
                                </div>
                                <div class="category-card-content">
                                    <h3 class="category-title">${audio.title}</h3>
                                    <p class="category-subtitle">${audio.duration_minutes ? audio.duration_minutes + ' min' : 'Ouvir'}</p>
                                </div>
                            </div>
                        `;
                    });
                }
            }

            grid.innerHTML = html;

            document.getElementById('categories-view').style.display = 'block';
            document.getElementById('audio-section').classList.remove('active');
            stopVisualizer();
        }

        function navigateToCategory(path) {
            currentPath = path.split('::');
            renderCategories();
        }

        function navigateToRoot() {
            currentPath = [];
            renderCategories();
        }

        function navigateToBreadcrumb(index) {
            currentPath = currentPath.slice(0, index + 1);
            renderCategories();
        }

        function renderBreadcrumb() {
            if (currentPath.length === 0) {
                document.getElementById('breadcrumb').innerHTML = '';
                return;
            }

            let html = `<span class="breadcrumb-item" onclick="navigateToRoot()">Audio Resumos</span>`;

            currentPath.forEach((part, index) => {
                const isLast = index === currentPath.length - 1;
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-item ${isLast ? 'active' : ''}" onclick="navigateToBreadcrumb(${index})">
                        ${part.replace(/_/g, ' ')}
                    </span>
                `;
            });

            document.getElementById('breadcrumb').innerHTML = html;
        }

        function showAudioFromCategory(audioId) {
            const currentPathStr = currentPath.join('::');
            let audiosInPath = currentPathStr
                ? getAudiosForPath(currentPathStr)
                : allAudios;

            audiosInPath = [...audiosInPath].sort((a, b) => naturalSort(a.title, b.title));

            const audioIndex = audiosInPath.findIndex(a => a.id == audioId);
            showAudioSection(audiosInPath, audioIndex >= 0 ? audioIndex : 0);
        }

        function showAudioSection(audios, index) {
            currentPlaylist = audios;
            currentIndex = index;
            currentAudio = audios[index];

            document.getElementById('categories-view').style.display = 'none';
            document.getElementById('audio-section').classList.add('active');

            renderPlaylist(audios, index);
            loadAudio(currentAudio);
            startVisualizer();
        }

        function renderPlaylist(audios, currentIndex) {
            const container = document.getElementById('playlist-items');
            const titleEl = document.getElementById('playlist-title');
            const countEl = document.getElementById('playlist-count');

            const categoryName = currentPath.length > 0
                ? currentPath[currentPath.length - 1].replace(/_/g, ' ')
                : 'Todos os Audios';

            titleEl.textContent = categoryName;
            countEl.textContent = `${audios.length} ${audios.length === 1 ? 'audio' : 'audios'}`;

            container.innerHTML = audios.map((audio, idx) => `
                <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="playAudioAtIndex(${idx})">
                    <span class="playlist-item-number">${idx + 1}</span>
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${audio.title}</div>
                        <div class="playlist-item-duration">
                            ${audio.duration_minutes ? audio.duration_minutes + ' min' : ''}
                        </div>
                    </div>
                    <span class="playlist-item-icon">${idx === currentIndex ? '🎧' : '▶'}</span>
                </div>
            `).join('');
        }

        function playAudioAtIndex(index) {
            if (currentPlaylist && currentPlaylist[index]) {
                currentIndex = index;
                currentAudio = currentPlaylist[index];
                loadAudio(currentAudio);
                renderPlaylist(currentPlaylist, index);
            }
        }

        function loadAudio(audio) {
            document.getElementById('audio-title').textContent = audio.title;
            document.getElementById('audio-path').textContent = audio.tags.split('::').join(' > ');

            // Description with formatting
            const descEl = document.getElementById('audio-description');
            if (audio.description) {
                descEl.innerHTML = formatDescription(audio.description);
                descEl.style.display = 'block';
            } else {
                descEl.style.display = 'none';
            }

            // Get direct audio URL
            const directUrl = getDirectAudioUrl(audio.audio_url);
            const audioElement = document.getElementById('audio-element');
            const playBtn = document.getElementById('play-btn');

            if (directUrl) {
                // Stop current playback
                audioElement.pause();
                stopVisualizer();
                playBtn.textContent = '▶';

                // Load new audio
                audioElement.src = directUrl;
                audioElement.load();

                // Reset progress
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('current-time').textContent = '0:00';
                document.getElementById('duration').textContent = '0:00';

                // Start visualization
                startVisualizer();
            } else {
                WardApp.showToast('Este audio nao suporta visualizador. Use Internet Archive ou Supabase Storage.', 'warning');
            }

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex >= currentPlaylist.length - 1;

            // Update URL with audio ID for sharing
            const newUrl = `${window.location.pathname}?audio=${audio.id}`;
            window.history.replaceState({}, '', newUrl);

            // Load comments
            loadComments(audio.id);
        }

        function previousTrack() {
            if (currentIndex > 0) {
                playAudioAtIndex(currentIndex - 1);
            }
        }

        function nextTrack() {
            if (currentIndex < currentPlaylist.length - 1) {
                playAudioAtIndex(currentIndex + 1);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('audio-section').classList.contains('active')) {
                switch(e.key) {
                    case 'ArrowLeft':
                        previousTrack();
                        break;
                    case 'ArrowRight':
                        nextTrack();
                        break;
                    case 'Escape':
                        stopVisualizer();
                        renderCategories();
                        break;
                }
            }
        });

        // Copy audio link
        function copyAudioLink() {
            if (!currentAudio) return;

            const url = `${window.location.origin}${window.location.pathname}?audio=${currentAudio.id}`;

            navigator.clipboard.writeText(url).then(() => {
                WardApp.showToast('Link copiado!');
            }).catch(() => {
                // Fallback for older browsers
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                WardApp.showToast('Link copiado!');
            });
        }

        // Comments functions
        async function loadComments(audioId) {
            const { data: comments } = await WardApp.db
                .from('course_audio_comments')
                .select(`
                    *,
                    users:user_id (full_name)
                `)
                .eq('audio_id', audioId)
                .order('created_at', { ascending: false });

            renderComments(comments || []);
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-list');

            if (comments.length === 0) {
                container.innerHTML = '<div class="no-comments">Seja o primeiro a comentar!</div>';
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-avatar">👤</div>
                    <div class="comment-content">
                        <div class="comment-author">${c.users?.full_name || 'Usuario'}</div>
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                        <div class="comment-time">${WardApp.formatDate(c.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        async function addComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();

            if (!content) {
                WardApp.showToast('Digite um comentario', 'warning');
                return;
            }

            if (!currentAudio) return;

            const { error } = await WardApp.db
                .from('course_audio_comments')
                .insert({
                    audio_id: currentAudio.id,
                    user_id: userData.id,
                    content: content
                });

            if (error) {
                console.error('Error adding comment:', error);
                WardApp.showToast('Erro ao adicionar comentario', 'error');
                return;
            }

            input.value = '';
            WardApp.showToast('Comentario adicionado!');
            await loadComments(currentAudio.id);
        }

        // Text formatting functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDescription(text) {
            if (!text) return '';

            // First escape HTML for security
            let formatted = escapeHtml(text);

            // Headers: ## text or ### text
            formatted = formatted.replace(/^###\s+(.+)$/gm, '<h4 style="margin: 0.5rem 0; color: #e94560;">$1</h4>');
            formatted = formatted.replace(/^##\s+(.+)$/gm, '<h3 style="margin: 0.75rem 0; color: #e94560;">$1</h3>');
            formatted = formatted.replace(/^#\s+(.+)$/gm, '<h2 style="margin: 1rem 0; color: #e94560;">$1</h2>');

            // Code blocks: ```code``` or `code`
            formatted = formatted.replace(/```([^`]+)```/g, '<pre style="background: rgba(0,0,0,0.3); padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.85rem;">$1</pre>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code style="background: rgba(0,0,0,0.3); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem;">$1</code>');

            // Markdown links: [text](url)
            formatted = formatted.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: #e94560;">$1</a>');

            // Convert plain URLs to clickable links (opens in new tab)
            const urlRegex = /(?<!\]|\()(https?:\/\/[^\s<\)]+)/g;
            formatted = formatted.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color: #e94560;">$1</a>');

            // Convert Markdown-style formatting
            // Bold: **text** or __text__
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/__([^_]+)__/g, '<strong>$1</strong>');

            // Italic: *text* or _text_
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/_([^_]+)_/g, '<em>$1</em>');

            // Numbered lists: 1. item
            formatted = formatted.replace(/^\d+\.\s+(.+)$/gm, '<li style="margin-left: 1.5rem;">$1</li>');

            // Convert bullet points: lines starting with - or *
            formatted = formatted.replace(/^[-*]\s+(.+)$/gm, '<li style="margin-left: 1.5rem;">$1</li>');

            // Convert line breaks (but not inside pre tags)
            formatted = formatted.replace(/\n/g, '<br>');

            // Clean up extra breaks around block elements
            formatted = formatted.replace(/<br>(<h[234])/g, '$1');
            formatted = formatted.replace(/(<\/h[234]>)<br>/g, '$1');
            formatted = formatted.replace(/<br>(<pre)/g, '$1');
            formatted = formatted.replace(/(<\/pre>)<br>/g, '$1');

            return formatted;
        }

        // Allow Enter key to submit comment
        document.getElementById('comment-input')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addComment();
            }
        });
    </script>
</body>
</html>
