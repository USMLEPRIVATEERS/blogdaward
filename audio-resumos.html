<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Audio Resumos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Clean theme for audio page */
        .audio-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: calc(100vh - 60px);
            padding: 2rem 1rem;
        }

        /* Breadcrumb navigation */
        .audio-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .breadcrumb-item:hover {
            color: #fff;
        }

        .breadcrumb-item.active {
            color: #e94560;
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: rgba(255,255,255,0.3);
        }

        /* Page title */
        .page-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .page-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Search bar */
        .search-container {
            margin-bottom: 1.5rem;
            max-width: 600px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            color: rgba(255,255,255,0.5);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
            background: rgba(255,255,255,0.08);
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* Category cards grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .category-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        .category-card-image {
            height: 140px;
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .category-card-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.08)"/><circle cx="40" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
        }

        .category-icon {
            font-size: 3.5rem;
            z-index: 1;
        }

        .category-card-content {
            padding: 1.25rem;
        }

        .category-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .category-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        .category-count {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            color: #e94560;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* Audio Player Section */
        .audio-section {
            display: none;
        }

        .audio-section.active {
            display: block;
        }

        .audio-player-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        /* Visualizer */
        .visualizer-container {
            height: 120px;
            background: linear-gradient(180deg, rgba(233, 69, 96, 0.1) 0%, transparent 100%);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            padding: 1rem;
        }

        .visualizer-bar {
            width: 4px;
            background: linear-gradient(180deg, #e94560 0%, #0f3460 100%);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            will-change: height;
            transform: translateZ(0);
        }

        /* Google Drive Player Container */
        .gdrive-player-container {
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin: 1rem;
        }

        .gdrive-player-container iframe {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 8px;
        }

        /* Audio Info */
        .audio-info {
            padding: 1.5rem;
            text-align: center;
        }

        .audio-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .audio-path {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Playlist */
        .playlist-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .playlist-header {
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .playlist-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .playlist-count {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }

        .playlist-items {
            max-height: 400px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .playlist-item.active {
            background: rgba(233, 69, 96, 0.1);
            border-left: 3px solid #e94560;
        }

        .playlist-item-number {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            min-width: 24px;
        }

        .playlist-item.active .playlist-item-number {
            color: #e94560;
            font-weight: 600;
        }

        .playlist-item-info {
            flex: 1;
        }

        .playlist-item-title {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            line-height: 1.3;
        }

        .playlist-item-duration {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
        }

        .playlist-item-icon {
            color: rgba(255,255,255,0.4);
            font-size: 1.25rem;
        }

        .playlist-item.active .playlist-item-icon {
            color: #e94560;
        }

        /* Back button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Empty state */
        .empty-category {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.5);
        }

        .empty-category-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-category h3 {
            color: #fff;
            margin-bottom: 0.5rem;
        }

        /* Audio player layout */
        .audio-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .audio-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar styling */
        .playlist-items::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-items::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .playlist-items::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .playlist-items::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        /* Loading state */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.6);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Description */
        .audio-description {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        /* Playing indicator */
        .playing-indicator {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            margin-left: 0.5rem;
        }

        .playing-indicator span {
            width: 3px;
            background: #e94560;
            border-radius: 2px;
            animation: equalizer 0.5s ease-in-out infinite alternate;
        }

        .playing-indicator span:nth-child(1) { animation-delay: 0s; }
        .playing-indicator span:nth-child(2) { animation-delay: 0.1s; }
        .playing-indicator span:nth-child(3) { animation-delay: 0.2s; }
        .playing-indicator span:nth-child(4) { animation-delay: 0.3s; }

        @keyframes equalizer {
            from { height: 4px; }
            to { height: 16px; }
        }

        /* Instructions */
        .player-instructions {
            text-align: center;
            padding: 0.75rem;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            margin: 0 1rem 1rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        .player-instructions strong {
            color: #e94560;
        }

        /* Share button */
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .share-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        /* Comments section */
        .comments-section {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .comments-header {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .comment-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .comment-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
        }

        .comment-input:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(255,255,255,0.08);
        }

        .comment-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .comment-submit {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .comment-submit:hover {
            background: #d03550;
        }

        .comment-item {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .comment-content {
            flex: 1;
        }

        .comment-author {
            color: #e94560;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .comment-text {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .comment-time {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .no-comments {
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* Description formatting */
        .audio-description a {
            color: #e94560;
            text-decoration: underline;
        }

        .audio-description strong, .audio-description b {
            color: #fff;
            font-weight: 600;
        }

        .audio-description ul, .audio-description ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .audio-description li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>

    <script>
        let userData = null;
        let allAudios = [];
        let currentPath = [];
        let currentAudio = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationId = null;

        // Category icons mapping
        const categoryIcons = {
            'USMLE': '🩺',
            'STEP_1': '1️⃣',
            'STEP_2': '2️⃣',
            'STEP_3': '3️⃣',
            'PESQUISA': '🔬',
            'META_ANALISE': '📊',
            'WARD_ACADEMY': '🎓',
            'INTRODUCAO': '📖',
            'RECURSOS': '📚',
            'MATCH': '🏥',
            'OET': '🗣️',
            'VISA': '🛂',
            'DEFAULT': '🎧'
        };

        // Natural sort function
        function naturalSort(a, b) {
            const aParts = a.match(/(\d+|\D+)/g) || [];
            const bParts = b.match(/(\d+|\D+)/g) || [];
            const minLen = Math.min(aParts.length, bParts.length);

            for (let i = 0; i < minLen; i++) {
                const aPart = aParts[i];
                const bPart = bParts[i];
                const aIsNum = /^\d+$/.test(aPart);
                const bIsNum = /^\d+$/.test(bPart);

                if (aIsNum && bIsNum) {
                    const diff = parseInt(aPart, 10) - parseInt(bPart, 10);
                    if (diff !== 0) return diff;
                } else if (aIsNum !== bIsNum) {
                    return aIsNum ? -1 : 1;
                } else {
                    const cmp = aPart.localeCompare(bPart, 'pt-BR', { sensitivity: 'base' });
                    if (cmp !== 0) return cmp;
                }
            }
            return aParts.length - bParts.length;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Block assessoria users
            if (userData.role === 'assessoria') {
                alert('Esta pagina esta disponivel apenas para membros completos da Ward Academy.');
                window.location.href = 'dashboard-assessoria-avulsa.html';
                return;
            }

            // Initialize visualizer bars
            initVisualizer();

            // Load audios
            await loadAudios();

            // Check URL params
            const urlParams = new URLSearchParams(window.location.search);
            const audioIdParam = urlParams.get('audio');
            if (audioIdParam && allAudios.length > 0) {
                const audio = allAudios.find(a => a.id == audioIdParam);
                if (audio) {
                    showAudioFromSearch(audioIdParam);
                } else {
                    renderCategories();
                }
            } else {
                renderCategories();
            }
        });

        // Visualizer state
        let visualizerBars = [];
        let currentHeights = [];
        let targetHeights = [];
        let beatPhase = 0;
        let lastBeatTime = 0;
        const BPM = 120; // Beats per minute simulation
        const BEAT_INTERVAL = 60000 / BPM;

        function initVisualizer() {
            const container = document.getElementById('visualizer');
            const barCount = 40;
            container.innerHTML = '';
            visualizerBars = [];
            currentHeights = [];
            targetHeights = [];

            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '4px';
                container.appendChild(bar);
                visualizerBars.push(bar);
                currentHeights.push(4);
                targetHeights.push(4);
            }
        }

        function startVisualizer() {
            isPlaying = true;
            lastBeatTime = performance.now();
            animateVisualizer();
        }

        // Simplex-like noise for organic movement
        function noise(x, seed) {
            const n = Math.sin(x * 12.9898 + seed * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function animateVisualizer() {
            if (!isPlaying) return;

            const now = performance.now();
            const barCount = visualizerBars.length;

            // Check for beat
            if (now - lastBeatTime >= BEAT_INTERVAL) {
                lastBeatTime = now;
                beatPhase = (beatPhase + 1) % 4;

                // Generate new target heights on beat
                for (let i = 0; i < barCount; i++) {
                    const normalizedPos = i / barCount; // 0 to 1

                    // Bass frequencies (left side) - stronger, more stable
                    // Mid frequencies (center) - moderate
                    // Treble frequencies (right side) - more variable

                    let baseHeight, variance;

                    if (normalizedPos < 0.3) {
                        // Bass region - strong on beats
                        baseHeight = beatPhase === 0 ? 70 : 40;
                        variance = 15;
                    } else if (normalizedPos < 0.6) {
                        // Mid region - melodic, moderate variation
                        baseHeight = 45 + Math.sin(beatPhase * Math.PI / 2) * 20;
                        variance = 25;
                    } else {
                        // Treble region - high variation, sparkly
                        baseHeight = 30;
                        variance = 40;
                    }

                    // Add organic noise variation
                    const noiseVal = noise(i * 0.1, now * 0.001);
                    targetHeights[i] = Math.max(8, baseHeight + (noiseVal - 0.5) * variance * 2);
                }
            }

            // Add continuous subtle variation between beats
            const timeSinceBeat = now - lastBeatTime;
            const beatProgress = timeSinceBeat / BEAT_INTERVAL;

            for (let i = 0; i < barCount; i++) {
                // Micro-variations for liveliness
                const microNoise = noise(i * 0.3 + now * 0.005, i);
                const microVariation = (microNoise - 0.5) * 8;

                // Smooth interpolation towards target
                const smoothing = 0.15;
                const adjustedTarget = targetHeights[i] + microVariation;
                currentHeights[i] += (adjustedTarget - currentHeights[i]) * smoothing;

                // Decay effect after beat peak
                if (beatProgress > 0.3) {
                    const decay = 1 - (beatProgress - 0.3) * 0.4;
                    currentHeights[i] *= Math.max(0.7, decay);
                }

                // Apply height
                const finalHeight = Math.max(4, Math.min(90, currentHeights[i]));
                visualizerBars[i].style.height = `${finalHeight}px`;
            }

            animationId = requestAnimationFrame(animateVisualizer);
        }

        function stopVisualizer() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            // Smooth fade out
            const fadeOut = () => {
                let stillAnimating = false;
                visualizerBars.forEach((bar, i) => {
                    currentHeights[i] *= 0.85;
                    if (currentHeights[i] > 5) {
                        stillAnimating = true;
                        bar.style.height = `${currentHeights[i]}px`;
                    } else {
                        currentHeights[i] = 4;
                        bar.style.height = '4px';
                    }
                });
                if (stillAnimating && !isPlaying) {
                    requestAnimationFrame(fadeOut);
                }
            };
            fadeOut();
        }

        async function loadAudios() {
            const { data, error } = await WardApp.db
                .from('course_audios')
                .select('*')
                .eq('is_published', true)
                .order('order_position');

            if (error) {
                console.error('Error loading audios:', error);
                return;
            }

            allAudios = (data || []).filter(audio => !audio.is_hidden && audio.audio_url);
        }

        function getUniqueCategories(audios, depth = 0) {
            const categories = new Map();

            audios.forEach(audio => {
                const parts = audio.tags.split('::');
                if (parts.length > depth) {
                    const key = parts[depth];
                    const fullPath = parts.slice(0, depth + 1).join('::');

                    if (!categories.has(key)) {
                        categories.set(key, {
                            name: key.replace(/_/g, ' '),
                            path: fullPath,
                            count: 0,
                            hasChildren: false
                        });
                    }

                    categories.get(key).count++;

                    if (parts.length > depth + 1) {
                        categories.get(key).hasChildren = true;
                    }
                }
            });

            return Array.from(categories.values()).sort((a, b) => naturalSort(a.name, b.name));
        }

        function getAudiosForPath(path) {
            return allAudios.filter(a => a.tags.startsWith(path));
        }

        function getAudiosExactlyAtPath(path) {
            return allAudios.filter(a => a.tags === path);
        }

        function filterAudios() {
            const input = document.getElementById('search-input');
            const query = input.value.toLowerCase().trim();

            if (query) {
                const filtered = allAudios.filter(a => {
                    return a.title.toLowerCase().includes(query) ||
                           (a.description && a.description.toLowerCase().includes(query)) ||
                           a.tags.toLowerCase().includes(query);
                });

                if (filtered.length > 0) {
                    showSearchResults(filtered);
                } else {
                    showNoResults();
                }
            } else {
                renderCategories();
            }
        }

        function showSearchResults(audios) {
            document.getElementById('breadcrumb').innerHTML = '';

            const grid = document.getElementById('categories-grid');
            audios.sort((a, b) => (a.order_position || 0) - (b.order_position || 0));

            let html = audios.map(audio => `
                <div class="category-card" onclick="showAudioFromSearch('${audio.id}')">
                    <div class="category-card-image">
                        <span class="category-icon">🎧</span>
                    </div>
                    <div class="category-card-content">
                        <h3 class="category-title">${audio.title}</h3>
                        <p class="category-subtitle">${audio.tags.split('::').join(' > ')}</p>
                        ${audio.duration_minutes ? `<p class="category-subtitle">${audio.duration_minutes} min</p>` : ''}
                    </div>
                </div>
            `).join('');

            grid.innerHTML = html;
            document.getElementById('categories-view').style.display = 'block';
            document.getElementById('audio-section').classList.remove('active');
        }

        function showNoResults() {
            document.getElementById('breadcrumb').innerHTML = '';

            const grid = document.getElementById('categories-grid');
            grid.innerHTML = `
                <div class="empty-category" style="grid-column: 1 / -1;">
                    <div class="empty-category-icon">🔍</div>
                    <h3>Nenhum audio encontrado</h3>
                    <p>Tente buscar por outros termos</p>
                </div>
            `;
        }

        function showAudioFromSearch(audioId) {
            const audio = allAudios.find(a => a.id == audioId);
            if (audio) {
                const audioPath = audio.tags.split('::').slice(0, -1).join('::') || audio.tags;
                let audiosInPath = getAudiosForPath(audioPath);
                audiosInPath = [...audiosInPath].sort((a, b) => naturalSort(a.title, b.title));

                const audioIndex = audiosInPath.findIndex(a => a.id == audioId);
                showAudioSection(audiosInPath, audioIndex >= 0 ? audioIndex : 0);
            }
        }

        function renderCategories() {
            const currentPathStr = currentPath.join('::');
            const audiosInScope = currentPathStr
                ? getAudiosForPath(currentPathStr)
                : allAudios;

            const depth = currentPath.length;
            const categories = getUniqueCategories(audiosInScope, depth);

            const leafAudios = currentPathStr
                ? getAudiosExactlyAtPath(currentPathStr)
                : [];

            renderBreadcrumb();

            const grid = document.getElementById('categories-grid');

            if (leafAudios.length > 0 && categories.length === 0) {
                const sortedLeafAudios = [...leafAudios].sort((a, b) => naturalSort(a.title, b.title));
                showAudioSection(sortedLeafAudios, 0);
                return;
            }

            let html = '';

            if (categories.length === 0 && leafAudios.length === 0) {
                html = `
                    <div class="empty-category" style="grid-column: 1 / -1;">
                        <div class="empty-category-icon">🎧</div>
                        <h3>Nenhum audio encontrado</h3>
                        <p>Estamos trabalhando para adicionar mais conteudo em breve!</p>
                    </div>
                `;
            } else {
                categories.forEach(cat => {
                    const icon = categoryIcons[cat.name.replace(/ /g, '_').toUpperCase()] || categoryIcons.DEFAULT;

                    html += `
                        <div class="category-card" onclick="navigateToCategory('${cat.path}')">
                            <div class="category-card-image">
                                <span class="category-icon">${icon}</span>
                            </div>
                            <span class="category-count">${cat.count} ${cat.count === 1 ? 'audio' : 'audios'}</span>
                            <div class="category-card-content">
                                <h3 class="category-title">${cat.name}</h3>
                                <p class="category-subtitle">${cat.hasChildren ? 'Clique para explorar' : 'Ouvir audios'}</p>
                            </div>
                        </div>
                    `;
                });

                if (leafAudios.length > 0) {
                    leafAudios.sort((a, b) => naturalSort(a.title, b.title));

                    leafAudios.forEach(audio => {
                        html += `
                            <div class="category-card" onclick="showAudioFromCategory('${audio.id}')">
                                <div class="category-card-image">
                                    <span class="category-icon">🎧</span>
                                </div>
                                <div class="category-card-content">
                                    <h3 class="category-title">${audio.title}</h3>
                                    <p class="category-subtitle">${audio.duration_minutes ? audio.duration_minutes + ' min' : 'Ouvir'}</p>
                                </div>
                            </div>
                        `;
                    });
                }
            }

            grid.innerHTML = html;

            document.getElementById('categories-view').style.display = 'block';
            document.getElementById('audio-section').classList.remove('active');
            stopVisualizer();
        }

        function navigateToCategory(path) {
            currentPath = path.split('::');
            renderCategories();
        }

        function navigateToRoot() {
            currentPath = [];
            renderCategories();
        }

        function navigateToBreadcrumb(index) {
            currentPath = currentPath.slice(0, index + 1);
            renderCategories();
        }

        function renderBreadcrumb() {
            if (currentPath.length === 0) {
                document.getElementById('breadcrumb').innerHTML = '';
                return;
            }

            let html = `<span class="breadcrumb-item" onclick="navigateToRoot()">Audio Resumos</span>`;

            currentPath.forEach((part, index) => {
                const isLast = index === currentPath.length - 1;
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-item ${isLast ? 'active' : ''}" onclick="navigateToBreadcrumb(${index})">
                        ${part.replace(/_/g, ' ')}
                    </span>
                `;
            });

            document.getElementById('breadcrumb').innerHTML = html;
        }

        function showAudioFromCategory(audioId) {
            const currentPathStr = currentPath.join('::');
            let audiosInPath = currentPathStr
                ? getAudiosForPath(currentPathStr)
                : allAudios;

            audiosInPath = [...audiosInPath].sort((a, b) => naturalSort(a.title, b.title));

            const audioIndex = audiosInPath.findIndex(a => a.id == audioId);
            showAudioSection(audiosInPath, audioIndex >= 0 ? audioIndex : 0);
        }

        function showAudioSection(audios, index) {
            currentPlaylist = audios;
            currentIndex = index;
            currentAudio = audios[index];

            document.getElementById('categories-view').style.display = 'none';
            document.getElementById('audio-section').classList.add('active');

            renderPlaylist(audios, index);
            loadAudio(currentAudio);
            startVisualizer();
        }

        function renderPlaylist(audios, currentIndex) {
            const container = document.getElementById('playlist-items');
            const titleEl = document.getElementById('playlist-title');
            const countEl = document.getElementById('playlist-count');

            const categoryName = currentPath.length > 0
                ? currentPath[currentPath.length - 1].replace(/_/g, ' ')
                : 'Todos os Audios';

            titleEl.textContent = categoryName;
            countEl.textContent = `${audios.length} ${audios.length === 1 ? 'audio' : 'audios'}`;

            container.innerHTML = audios.map((audio, idx) => `
                <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="playAudioAtIndex(${idx})">
                    <span class="playlist-item-number">${idx + 1}</span>
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${audio.title}</div>
                        <div class="playlist-item-duration">
                            ${audio.duration_minutes ? audio.duration_minutes + ' min' : ''}
                        </div>
                    </div>
                    <span class="playlist-item-icon">${idx === currentIndex ? '🎧' : '▶'}</span>
                </div>
            `).join('');
        }

        function playAudioAtIndex(index) {
            if (currentPlaylist && currentPlaylist[index]) {
                currentIndex = index;
                currentAudio = currentPlaylist[index];
                loadAudio(currentAudio);
                renderPlaylist(currentPlaylist, index);
            }
        }

        function loadAudio(audio) {
            document.getElementById('audio-title').textContent = audio.title;
            document.getElementById('audio-path').textContent = audio.tags.split('::').join(' > ');

            // Description with formatting
            const descEl = document.getElementById('audio-description');
            if (audio.description) {
                descEl.innerHTML = formatDescription(audio.description);
                descEl.style.display = 'block';
            } else {
                descEl.style.display = 'none';
            }

            // Extract Google Drive ID and create embed URL
            const fileId = getGoogleDriveFileId(audio.audio_url);

            if (fileId) {
                // Use Google Drive preview embed
                const embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                document.getElementById('gdrive-player').src = embedUrl;
            } else {
                WardApp.showToast('Erro ao carregar audio', 'error');
            }

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex >= currentPlaylist.length - 1;

            // Update URL with audio ID for sharing
            const newUrl = `${window.location.pathname}?audio=${audio.id}`;
            window.history.replaceState({}, '', newUrl);

            // Load comments
            loadComments(audio.id);
        }

        function getGoogleDriveFileId(url) {
            if (!url) return null;

            // Extract file ID from Google Drive URL
            // Formats:
            // https://drive.google.com/file/d/FILE_ID/view?usp=drive_link
            // https://drive.google.com/file/d/FILE_ID/view
            // https://drive.google.com/open?id=FILE_ID

            const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileMatch) {
                return fileMatch[1];
            }

            const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (idMatch) {
                return idMatch[1];
            }

            return null;
        }

        function previousTrack() {
            if (currentIndex > 0) {
                playAudioAtIndex(currentIndex - 1);
            }
        }

        function nextTrack() {
            if (currentIndex < currentPlaylist.length - 1) {
                playAudioAtIndex(currentIndex + 1);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('audio-section').classList.contains('active')) {
                switch(e.key) {
                    case 'ArrowLeft':
                        previousTrack();
                        break;
                    case 'ArrowRight':
                        nextTrack();
                        break;
                    case 'Escape':
                        stopVisualizer();
                        renderCategories();
                        break;
                }
            }
        });

        // Copy audio link
        function copyAudioLink() {
            if (!currentAudio) return;

            const url = `${window.location.origin}${window.location.pathname}?audio=${currentAudio.id}`;

            navigator.clipboard.writeText(url).then(() => {
                WardApp.showToast('Link copiado!');
            }).catch(() => {
                // Fallback for older browsers
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                WardApp.showToast('Link copiado!');
            });
        }

        // Comments functions
        async function loadComments(audioId) {
            const { data: comments } = await WardApp.db
                .from('course_audio_comments')
                .select(`
                    *,
                    users:user_id (full_name)
                `)
                .eq('audio_id', audioId)
                .order('created_at', { ascending: false });

            renderComments(comments || []);
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-list');

            if (comments.length === 0) {
                container.innerHTML = '<div class="no-comments">Seja o primeiro a comentar!</div>';
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-avatar">👤</div>
                    <div class="comment-content">
                        <div class="comment-author">${c.users?.full_name || 'Usuario'}</div>
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                        <div class="comment-time">${WardApp.formatDate(c.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        async function addComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();

            if (!content) {
                WardApp.showToast('Digite um comentario', 'warning');
                return;
            }

            if (!currentAudio) return;

            const { error } = await WardApp.db
                .from('course_audio_comments')
                .insert({
                    audio_id: currentAudio.id,
                    user_id: userData.id,
                    content: content
                });

            if (error) {
                console.error('Error adding comment:', error);
                WardApp.showToast('Erro ao adicionar comentario', 'error');
                return;
            }

            input.value = '';
            WardApp.showToast('Comentario adicionado!');
            await loadComments(currentAudio.id);
        }

        // Text formatting functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDescription(text) {
            if (!text) return '';

            // First escape HTML for security
            let formatted = escapeHtml(text);

            // Convert URLs to clickable links (opens in new tab)
            const urlRegex = /(https?:\/\/[^\s<]+)/g;
            formatted = formatted.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

            // Convert Markdown-style formatting
            // Bold: **text** or __text__
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/__([^_]+)__/g, '<strong>$1</strong>');

            // Italic: *text* or _text_
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/_([^_]+)_/g, '<em>$1</em>');

            // Convert line breaks
            formatted = formatted.replace(/\n/g, '<br>');

            // Convert bullet points: lines starting with - or *
            formatted = formatted.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
            // Wrap consecutive <li> items in <ul>
            formatted = formatted.replace(/(<li>.*<\/li>(\s*<br>)?)+/g, (match) => {
                return '<ul>' + match.replace(/<br>/g, '') + '</ul>';
            });

            return formatted;
        }

        // Allow Enter key to submit comment
        document.getElementById('comment-input')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addComment();
            }
        });
    </script>
