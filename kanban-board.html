<!-- Kanban Board Component -->
<!-- This file can be included in dashboards -->

<style>
/* Kanban Board Styles */
.kanban-container {
    /* Tokens locais: garantem valores mesmo quando o CSS do host nao os define */
    --primary: #C45700;
    --primary-dark: #a34900;
    --danger: #dc2626;
    --text-dark: #111827;
    --radius-md: 10px;
    margin-top: 3rem;
    padding: 2rem 0;
    border-top: 2px solid var(--gray-200, #e5e7eb);
}

.kanban-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

.kanban-title {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--text-dark);
}

.kanban-user-selector {
    display: none; /* Only show for Marcos and Iria */
}

.kanban-user-selector select {
    padding: 0.5rem 1rem;
    border: 1px solid var(--gray-300, #d1d5db);
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-family: inherit;
    background: white;
    color: var(--text-dark);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.kanban-user-selector select:hover {
    border-color: var(--gray-400, #9ca3af);
}

.kanban-user-selector select:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(196, 87, 0, 0.16);
}

.kanban-board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.kanban-column {
    background: var(--gray-50, #f9fafb);
    border: 1px solid var(--gray-200, #e5e7eb);
    border-radius: var(--radius-lg, 14px);
    padding: 1rem;
    min-height: 500px;
}

.kanban-column.archived {
    grid-column: 1 / -1;
    min-height: 200px;
}

.kanban-column.archived.collapsed {
    min-height: auto;
}

.kanban-column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--gray-200, #e5e7eb);
}

.kanban-column-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.kanban-column-count {
    background: var(--gray-200, #e5e7eb);
    color: var(--gray-700, #374151);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    min-width: 26px;
    text-align: center;
}

.kanban-add-btn {
    background: linear-gradient(180deg, #d46312, #C45700);
    color: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
}

.kanban-add-btn:hover {
    background: linear-gradient(180deg, #c95d0e, var(--primary-dark));
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(196, 87, 0, 0.32);
}

.kanban-add-btn:active {
    transform: translateY(1px);
    box-shadow: none;
}

.kanban-add-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.kanban-collapse-btn {
    background: transparent;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--gray-600, #4b5563);
    padding: 0.25rem;
    border-radius: 8px;
    transition: transform 0.2s ease, color 0.15s ease, background 0.15s ease;
}

.kanban-collapse-btn:hover {
    color: var(--text-dark);
    background: var(--gray-200, #e5e7eb);
}

.kanban-collapse-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.kanban-column.collapsed .kanban-collapse-btn {
    transform: rotate(180deg);
}

.kanban-cards {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    min-height: 100px;
}

.kanban-column.collapsed .kanban-cards {
    display: none;
}

.kanban-card {
    background: white;
    border: 1px solid var(--gray-200, #e5e7eb);
    border-radius: 12px;
    padding: 1rem;
    cursor: grab;
    transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
}

.kanban-card:active {
    cursor: grabbing;
}

.kanban-card:hover {
    box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 4px 10px rgba(16, 24, 40, 0.07);
    transform: translateY(-2px);
    border-color: var(--gray-300, #d1d5db);
}

.kanban-card:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.kanban-card.dragging {
    opacity: 0.5;
    transform: rotate(3deg) scale(1.02);
    box-shadow: 0 4px 8px rgba(16, 24, 40, 0.05), 0 14px 32px -8px rgba(16, 24, 40, 0.18);
}

.kanban-card-title {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-dark);
    margin-bottom: 0.5rem;
    line-height: 1.4;
}

.kanban-card-meta {
    display: flex;
    gap: 1rem;
    font-size: 0.85rem;
    color: var(--gray-500, #6b7280);
    margin-top: 0.75rem;
    flex-wrap: wrap;
}

.kanban-card-deadline {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.kanban-card-deadline.overdue {
    color: var(--danger);
    font-weight: 600;
}

.kanban-card-tasks {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.kanban-empty {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--gray-400, #9ca3af);
    font-size: 0.9rem;
    border: 1px dashed var(--gray-300, #d1d5db);
    border-radius: 10px;
}

/* Responsive */
@media (max-width: 768px) {
    .kanban-board {
        grid-template-columns: 1fr;
    }

    .kanban-column.archived {
        grid-column: 1;
    }
}

@media (max-width: 480px) {
    .kanban-container {
        margin-top: 2rem;
        padding: 1.5rem 0;
    }

    .kanban-title {
        font-size: 1.4rem;
    }

    .kanban-column {
        min-height: 320px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .kanban-card,
    .kanban-add-btn,
    .kanban-collapse-btn,
    .kanban-user-selector select {
        transition: none !important;
    }

    .kanban-card:hover,
    .kanban-add-btn:hover {
        transform: none;
    }
}
</style>

<div class="kanban-container">
    <div class="kanban-header">
        <h2 class="kanban-title">📋 Meu Kanban</h2>
        <div class="kanban-user-selector" id="kanban-user-selector">
            <select id="kanban-user-select">
                <option value="">Meu Kanban</option>
            </select>
        </div>
    </div>

    <div class="kanban-board">
        <!-- TODO Column -->
        <div class="kanban-column" data-status="todo">
            <div class="kanban-column-header">
                <div class="kanban-column-title">
                    📝 FAZER
                    <span class="kanban-column-count" data-count="todo">0</span>
                </div>
                <button class="kanban-add-btn" onclick="openProjectModal('todo')">+</button>
            </div>
            <div class="kanban-cards" data-status="todo">
                <div class="kanban-empty">Nenhum projeto ainda</div>
            </div>
        </div>

        <!-- DOING Column -->
        <div class="kanban-column" data-status="doing">
            <div class="kanban-column-header">
                <div class="kanban-column-title">
                    🚀 FAZENDO
                    <span class="kanban-column-count" data-count="doing">0</span>
                </div>
                <button class="kanban-add-btn" onclick="openProjectModal('doing')">+</button>
            </div>
            <div class="kanban-cards" data-status="doing">
                <div class="kanban-empty">Nenhum projeto ainda</div>
            </div>
        </div>

        <!-- DONE Column -->
        <div class="kanban-column" data-status="done">
            <div class="kanban-column-header">
                <div class="kanban-column-title">
                    ✅ FEITO
                    <span class="kanban-column-count" data-count="done">0</span>
                </div>
                <button class="kanban-add-btn" onclick="openProjectModal('done')">+</button>
            </div>
            <div class="kanban-cards" data-status="done">
                <div class="kanban-empty">Nenhum projeto ainda</div>
            </div>
        </div>

        <!-- ARCHIVED Column -->
        <div class="kanban-column archived collapsed" data-status="archived">
            <div class="kanban-column-header">
                <div class="kanban-column-title">
                    📦 ARQUIVADO
                    <span class="kanban-column-count" data-count="archived">0</span>
                </div>
                <button class="kanban-collapse-btn" onclick="toggleArchivedColumn()">▼</button>
            </div>
            <div class="kanban-cards" data-status="archived">
                <div class="kanban-empty">Nenhum projeto arquivado</div>
            </div>
        </div>
    </div>
</div>
