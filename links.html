<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Links</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </div>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="cronograma.html" class="nav-link">Cronograma</a>
                <a href="landmarks.html" class="nav-link">Chamadas</a>
                <a href="curso.html" class="nav-link">Curso</a>
                <a href="links.html" class="nav-link active">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="pesquisa.html" class="nav-link">Pesquisa</a>
            </nav>
            <div class="nav-user">
                <a href="profile.html" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="d-flex justify-between align-center flex-wrap gap-2 mb-4">
            <h1>🔗 Repositorio de Links</h1>
            <div id="mentor-actions" class="btn-group" style="display: none;">
                <button class="btn btn-primary" onclick="openModal('add-link-modal')">+ Adicionar Link</button>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="input-group">
                    <div class="form-group" style="flex: 2;">
                        <input type="text" id="search-links" class="form-input" placeholder="Buscar links..." oninput="filterLinks()">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <select id="filter-step" class="form-input" onchange="filterLinks()">
                            <option value="">Todos os Steps</option>
                            <option value="step1">Step 1</option>
                            <option value="step2">Step 2 CK</option>
                            <option value="step3">Step 3</option>
                            <option value="pesquisa">Pesquisa</option>
                            <option value="match">Match</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <select id="filter-category" class="form-input" onchange="filterLinks()">
                            <option value="">Todas categorias</option>
                            <option value="uworld">UWorld</option>
                            <option value="anki">Anki</option>
                            <option value="amboss">Amboss</option>
                            <option value="boards_beyond">Boards & Beyond</option>
                            <option value="pathoma">Pathoma</option>
                            <option value="sketchy">Sketchy</option>
                            <option value="first_aid">First Aid</option>
                            <option value="nbme">NBME</option>
                            <option value="research">Pesquisa</option>
                            <option value="visa">Visa/Imigracao</option>
                            <option value="ecfmg">ECFMG</option>
                            <option value="residency">Residencia</option>
                            <option value="observership">Observership</option>
                            <option value="tools">Ferramentas</option>
                            <option value="other">Outros</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Links Grid -->
        <div id="links-container" class="links-grid">
            <!-- Filled by JS -->
        </div>

        <!-- Empty State -->
        <div id="no-links" class="card" style="display: none;">
            <div class="card-body text-center p-4">
                <div class="empty-state">
                    <div class="empty-state-icon">🔗</div>
                    <h3 class="empty-state-title">Nenhum link encontrado</h3>
                    <p class="text-muted">Ajuste os filtros ou aguarde novos links serem adicionados.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Link Modal (Mentors only) -->
    <div id="add-link-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">➕ Adicionar Link</h3>
                <button class="modal-close" onclick="closeModal('add-link-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="link-title">Titulo *</label>
                    <input type="text" id="link-title" class="form-input" placeholder="Nome do recurso">
                </div>
                <div class="form-group">
                    <label class="form-label" for="link-url">URL *</label>
                    <input type="url" id="link-url" class="form-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label" for="link-description">Descricao</label>
                    <textarea id="link-description" class="form-textarea" rows="3" placeholder="Breve descricao do recurso..."></textarea>
                </div>
                <div class="input-group">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="link-step">Step/Exame *</label>
                        <select id="link-step" class="form-input">
                            <option value="">Selecione...</option>
                            <option value="step1">Step 1</option>
                            <option value="step2">Step 2 CK</option>
                            <option value="step3">Step 3</option>
                            <option value="pesquisa">Pesquisa</option>
                            <option value="match">Match</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="link-category">Categoria *</label>
                        <select id="link-category" class="form-input">
                            <option value="">Selecione...</option>
                            <option value="uworld">UWorld</option>
                            <option value="anki">Anki</option>
                            <option value="amboss">Amboss</option>
                            <option value="boards_beyond">Boards & Beyond</option>
                            <option value="pathoma">Pathoma</option>
                            <option value="sketchy">Sketchy</option>
                            <option value="first_aid">First Aid</option>
                            <option value="nbme">NBME</option>
                            <option value="research">Pesquisa</option>
                            <option value="visa">Visa/Imigracao</option>
                            <option value="ecfmg">ECFMG</option>
                            <option value="residency">Residencia</option>
                            <option value="observership">Observership</option>
                            <option value="tools">Ferramentas</option>
                            <option value="other">Outros</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" id="link-pinned">
                        <span class="form-check-label">📌 Fixar no topo</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-link-modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveLink()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Edit Link Modal -->
    <div id="edit-link-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Editar Link</h3>
                <button class="modal-close" onclick="closeModal('edit-link-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-link-id">
                <div class="form-group">
                    <label class="form-label" for="edit-link-title">Titulo *</label>
                    <input type="text" id="edit-link-title" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-link-url">URL *</label>
                    <input type="url" id="edit-link-url" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-link-description">Descricao</label>
                    <textarea id="edit-link-description" class="form-textarea" rows="3"></textarea>
                </div>
                <div class="input-group">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="edit-link-step">Step/Exame *</label>
                        <select id="edit-link-step" class="form-input">
                            <option value="">Selecione...</option>
                            <option value="step1">Step 1</option>
                            <option value="step2">Step 2 CK</option>
                            <option value="step3">Step 3</option>
                            <option value="pesquisa">Pesquisa</option>
                            <option value="match">Match</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="edit-link-category">Categoria *</label>
                        <select id="edit-link-category" class="form-input">
                            <option value="uworld">UWorld</option>
                            <option value="anki">Anki</option>
                            <option value="amboss">Amboss</option>
                            <option value="boards_beyond">Boards & Beyond</option>
                            <option value="pathoma">Pathoma</option>
                            <option value="sketchy">Sketchy</option>
                            <option value="first_aid">First Aid</option>
                            <option value="nbme">NBME</option>
                            <option value="research">Pesquisa</option>
                            <option value="visa">Visa/Imigracao</option>
                            <option value="ecfmg">ECFMG</option>
                            <option value="residency">Residencia</option>
                            <option value="observership">Observership</option>
                            <option value="tools">Ferramentas</option>
                            <option value="other">Outros</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" id="edit-link-pinned">
                        <span class="form-check-label">📌 Fixar no topo</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteLink()">Excluir</button>
                <button class="btn btn-secondary" onclick="closeModal('edit-link-modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="updateLink()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Viewing As Banner -->
    <div id="viewing-as-banner" class="viewing-as-banner" style="display: none;">
        <span>👁️ Visualizando como: <strong id="viewing-student-name"></strong></span>
        <button class="btn btn-sm btn-secondary" onclick="exitViewAs()">Voltar para minha conta</button>
    </div>

    <style>
        /* Viewing As Banner */
        .viewing-as-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            position: sticky;
            top: 60px;
            z-index: 99;
            flex-wrap: wrap;
        }

        .viewing-as-banner .btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
        }

        .viewing-as-banner .btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        let userData = null;
        let allLinks = [];
        let isMentor = false;
        let viewingAsStudentId = null;

        const categoryLabels = {
            uworld: '📚 UWorld',
            anki: '🃏 Anki',
            amboss: '🔬 Amboss',
            boards_beyond: '🎥 Boards & Beyond',
            pathoma: '🔬 Pathoma',
            sketchy: '🎨 Sketchy',
            first_aid: '📕 First Aid',
            nbme: '📋 NBME',
            research: '🔬 Pesquisa',
            visa: '🛂 Visa/Imigracao',
            ecfmg: '📋 ECFMG',
            residency: '🏥 Residencia',
            observership: '👁️ Observership',
            tools: '🛠️ Ferramentas',
            other: '📎 Outros'
        };

        const stepLabels = {
            step1: 'Step 1',
            step2: 'Step 2 CK',
            step3: 'Step 3',
            pesquisa: 'Pesquisa',
            match: 'Match',
            outros: 'Outros'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Check if viewing as another student
            const urlParams = new URLSearchParams(window.location.search);
            viewingAsStudentId = urlParams.get('view_as');

            if (viewingAsStudentId) {
                const isMentor = userData.role && userData.role.startsWith('mentor');
                if (isMentor) {
                    await setupViewingAsStudent(viewingAsStudentId);
                }
            }

            isMentor = userData.role && userData.role.startsWith('mentor_');

            // Only show mentor actions if not viewing as student
            if (isMentor && !viewingAsStudentId) {
                document.getElementById('mentor-actions').style.display = 'flex';
            }

            await loadLinks();
        });

        async function setupViewingAsStudent(studentId) {
            // Get student info
            const { data: student } = await WardApp.db
                .from('users')
                .select('full_name')
                .eq('id', studentId)
                .single();

            if (student) {
                // Show viewing banner
                document.getElementById('viewing-as-banner').style.display = 'flex';
                document.getElementById('viewing-student-name').textContent = student.full_name;

                // Update navbar links to maintain view_as context
                updateNavbarForViewAs(studentId);
            }
        }

        function updateNavbarForViewAs(studentId) {
            const navLinks = document.querySelectorAll('.nav-menu a.nav-link, .nav-user a');
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
                    const url = new URL(href, window.location.origin);
                    url.searchParams.set('view_as', studentId);
                    link.setAttribute('href', url.pathname + url.search);
                }
            });
        }

        function exitViewAs() {
            localStorage.removeItem('view_as_student');
            // Redirect back to mentor dashboard
            window.location.href = userData.role === 'mentor_marcos'
                ? 'mentor-dashboard-marcos.html'
                : 'mentor-dashboard-iria.html';
        }

        async function loadLinks() {
            const { data: links, error } = await WardApp.db
                .from('links_repository')
                .select('*')
                .eq('is_active', true)
                .order('is_featured', { ascending: false })
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading links:', error);
                return;
            }

            allLinks = links || [];
            renderLinks(allLinks);
        }

        function filterLinks() {
            const search = document.getElementById('search-links').value.toLowerCase();
            const category = document.getElementById('filter-category').value;
            const step = document.getElementById('filter-step').value;

            let filtered = allLinks;

            if (search) {
                filtered = filtered.filter(link =>
                    link.title.toLowerCase().includes(search) ||
                    (link.description && link.description.toLowerCase().includes(search))
                );
            }

            if (step) {
                filtered = filtered.filter(link => link.step === step);
            }

            if (category) {
                filtered = filtered.filter(link => link.category === category);
            }

            renderLinks(filtered);
        }

        function renderLinks(links) {
            const container = document.getElementById('links-container');
            const noLinks = document.getElementById('no-links');

            if (!links || links.length === 0) {
                container.innerHTML = '';
                noLinks.style.display = 'block';
                return;
            }

            noLinks.style.display = 'none';

            container.innerHTML = links.map(link => `
                <div class="link-card ${link.is_featured ? 'pinned' : ''}">
                    ${link.is_featured ? '<span class="link-pin">📌</span>' : ''}
                    <div class="link-badges">
                        ${link.step ? `<span class="link-step">${stepLabels[link.step] || link.step}</span>` : ''}
                        <span class="link-category">${categoryLabels[link.category] || link.category}</span>
                    </div>
                    <h3 class="link-title">${link.title}</h3>
                    ${link.description ? `<p class="link-description">${link.description}</p>` : ''}
                    <div class="link-actions">
                        <a href="${link.url}" target="_blank" class="btn btn-primary btn-sm">Acessar ↗</a>
                        ${isMentor ? `<button class="btn btn-outline btn-sm" onclick="editLink(${link.id})">✏️</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function saveLink() {
            const title = document.getElementById('link-title').value.trim();
            const url = document.getElementById('link-url').value.trim();
            const description = document.getElementById('link-description').value.trim();
            const step = document.getElementById('link-step').value;
            const category = document.getElementById('link-category').value;
            const pinned = document.getElementById('link-pinned').checked;

            if (!title || !url || !step || !category) {
                WardApp.showToast('Preencha todos os campos obrigatorios', 'warning');
                return;
            }

            const { error } = await WardApp.db.from('links_repository').insert({
                title,
                url,
                description,
                step,
                category,
                is_featured: pinned,
                added_by: userData.id
            });

            if (error) {
                WardApp.showToast('Erro ao salvar link: ' + error.message, 'error');
                return;
            }

            closeModal('add-link-modal');
            document.getElementById('link-title').value = '';
            document.getElementById('link-url').value = '';
            document.getElementById('link-description').value = '';
            document.getElementById('link-step').value = '';
            document.getElementById('link-category').value = '';
            document.getElementById('link-pinned').checked = false;

            WardApp.showToast('Link adicionado com sucesso!');
            await loadLinks();
        }

        function editLink(id) {
            const link = allLinks.find(l => l.id === id);
            if (!link) return;

            document.getElementById('edit-link-id').value = id;
            document.getElementById('edit-link-title').value = link.title;
            document.getElementById('edit-link-url').value = link.url;
            document.getElementById('edit-link-description').value = link.description || '';
            document.getElementById('edit-link-step').value = link.step || '';
            document.getElementById('edit-link-category').value = link.category;
            document.getElementById('edit-link-pinned').checked = link.is_featured;

            openModal('edit-link-modal');
        }

        async function updateLink() {
            const id = document.getElementById('edit-link-id').value;
            const title = document.getElementById('edit-link-title').value.trim();
            const url = document.getElementById('edit-link-url').value.trim();
            const description = document.getElementById('edit-link-description').value.trim();
            const step = document.getElementById('edit-link-step').value;
            const category = document.getElementById('edit-link-category').value;
            const pinned = document.getElementById('edit-link-pinned').checked;

            if (!title || !url || !step || !category) {
                WardApp.showToast('Preencha todos os campos obrigatorios', 'warning');
                return;
            }

            const { error } = await WardApp.db
                .from('links_repository')
                .update({ title, url, description, step, category, is_featured: pinned })
                .eq('id', id);

            if (error) {
                WardApp.showToast('Erro ao atualizar link: ' + error.message, 'error');
                return;
            }

            closeModal('edit-link-modal');
            WardApp.showToast('Link atualizado com sucesso!');
            await loadLinks();
        }

        async function deleteLink() {
            if (!confirm('Tem certeza que deseja excluir este link?')) return;

            const id = document.getElementById('edit-link-id').value;

            const { error } = await WardApp.db
                .from('links_repository')
                .update({ is_active: false })
                .eq('id', id);

            if (error) {
                WardApp.showToast('Erro ao excluir link', 'error');
                return;
            }

            closeModal('edit-link-modal');
            WardApp.showToast('Link excluido!');
            await loadLinks();
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>

    <style>
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .link-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            position: relative;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .link-card.pinned {
            border-color: var(--primary-color);
            background: linear-gradient(135deg, #fff 0%, #fff5f0 100%);
        }

        .link-pin {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
        }

        .link-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .link-step {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--white);
            background: var(--primary-color);
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .link-category {
            font-size: 0.7rem;
            color: var(--gray-600);
            background: var(--gray-100);
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .link-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .link-description {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .link-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }
    </style>
</body>
</html>
