<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migração de Dados - Ward Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #e94560; margin-bottom: 1rem; font-size: 1.5rem; }
        .warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .warning h3 { color: #ffc107; margin-bottom: 0.5rem; }
        .warning ul { margin-left: 1.5rem; color: rgba(255,255,255,0.8); }
        .warning li { margin: 0.25rem 0; }
        .btn {
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            border: none;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .log {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .log-entry { margin: 0.25rem 0; padding: 0.25rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
        .log-entry.info { color: #60a5fa; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .stat {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: 700; color: #e94560; }
        .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .back-link {
            display: block;
            text-align: center;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            margin-top: 1rem;
        }
        .back-link:hover { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Migração de Criptografia</h1>

        <div class="warning">
            <h3>⚠️ Atenção</h3>
            <ul>
                <li>Execute esta migração <strong>apenas UMA VEZ</strong></li>
                <li>Faça backup do banco antes de executar</li>
                <li>Apenas mentores podem executar</li>
                <li>Campos: <code>full_name</code>, <code>email</code>, <code>cpf</code></li>
            </ul>
        </div>

        <button class="btn" id="btn-migrate" onclick="startMigration()">
            🚀 Iniciar Migração
        </button>

        <div class="stats" style="display: none;" id="stats">
            <div class="stat">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-migrated">0</div>
                <div class="stat-label">Migrados</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-skipped">0</div>
                <div class="stat-label">Já OK</div>
            </div>
        </div>

        <div class="log" id="log" style="display: none;"></div>

        <a href="index.html" class="back-link">← Voltar para Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        let migrated = 0;
        let skipped = 0;
        let total = 0;

        function log(message, type = '') {
            const logEl = document.getElementById('log');
            logEl.style.display = 'block';
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-migrated').textContent = migrated;
            document.getElementById('stat-skipped').textContent = skipped;
        }

        // Check if string looks like it's already encrypted (base64)
        function isEncrypted(str) {
            if (!str || typeof str !== 'string') return false;
            // If it contains @ or common patterns, it's not encrypted
            if (str.includes('@') || str.includes(' ') || /^\d{2,3}\.?\d{3}/.test(str)) return false;
            // Check if it looks like base64
            return /^[A-Za-z0-9+/]+=*$/.test(str) && str.length > 20;
        }

        async function startMigration() {
            const btn = document.getElementById('btn-migrate');
            btn.disabled = true;
            btn.textContent = '⏳ Migrando...';

            document.getElementById('stats').style.display = 'grid';

            try {
                // Check auth
                const user = await WardApp.checkAuth();
                if (!user) {
                    log('Erro: Faça login primeiro', 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 Iniciar Migração';
                    return;
                }

                if (!user.role?.startsWith('mentor_')) {
                    log('Erro: Apenas mentores podem executar a migração', 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 Iniciar Migração';
                    return;
                }

                log(`Logado como: ${user.full_name || user.cpf}`, 'info');
                log('Carregando usuários...', 'info');

                // Load all users
                const { data: users, error } = await WardApp.db
                    .from('users')
                    .select('id, full_name, email, cpf');

                if (error) {
                    log(`Erro ao carregar usuários: ${error.message}`, 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 Iniciar Migração';
                    return;
                }

                total = users.length;
                updateStats();
                log(`Encontrados ${total} usuários`, 'info');

                // Store original CPF for logging before encryption
                const cpfMap = {};
                users.forEach(u => { cpfMap[u.id] = u.cpf; });

                // Process each user
                for (const u of users) {
                    const updates = {};
                    let needsUpdate = false;
                    const originalCpf = cpfMap[u.id];

                    // Check full_name
                    if (u.full_name && !isEncrypted(u.full_name)) {
                        updates.full_name = WardApp._fmt(u.full_name);
                        needsUpdate = true;
                    }

                    // Check email
                    if (u.email && !isEncrypted(u.email)) {
                        updates.email = WardApp._fmt(u.email);
                        needsUpdate = true;
                    }

                    // Check cpf
                    if (u.cpf && !isEncrypted(u.cpf)) {
                        updates.cpf = WardApp._fmt(u.cpf);
                        needsUpdate = true;
                    }

                    if (needsUpdate) {
                        const { error: updateError } = await WardApp.db
                            .from('users')
                            .update(updates)
                            .eq('id', u.id);

                        if (updateError) {
                            log(`Erro ao migrar ID ${u.id}: ${updateError.message}`, 'error');
                        } else {
                            migrated++;
                            log(`✓ Migrado: ID ${u.id}`, 'success');
                        }
                    } else {
                        skipped++;
                        log(`- Já OK: ID ${u.id}`);
                    }

                    updateStats();
                }

                log('', '');
                log('═══════════════════════════════════════', 'info');
                log(`✅ MIGRAÇÃO COMPLETA!`, 'success');
                log(`   Total: ${total} | Migrados: ${migrated} | Já OK: ${skipped}`, 'info');
                log('═══════════════════════════════════════', 'info');

                btn.textContent = '✅ Migração Completa';
                btn.className = 'btn success';

            } catch (err) {
                log(`Erro inesperado: ${err.message}`, 'error');
                console.error(err);
                btn.disabled = false;
                btn.textContent = '🚀 Tentar Novamente';
            }
        }
    </script>
</body>
</html>
