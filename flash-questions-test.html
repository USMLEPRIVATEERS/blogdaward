<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Test - Ward Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f9fafb;
        }

        .test-layout {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .test-header {
            background: white;
            border-bottom: 2px solid #f0f0f0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-info {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .timer {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #d97706;
        }

        .test-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: white;
            border-right: 2px solid #f0f0f0;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .sidebar h3 {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .question-nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .question-nav-btn {
            aspect-ratio: 1;
            border: 2px solid #f0f0f0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .question-nav-btn:hover {
            border-color: #d97706;
        }

        .question-nav-btn.current {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            border-color: #d97706;
        }

        .question-nav-btn.answered {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .main-test {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .question-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            padding: 2rem;
        }

        .question-tags {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: #f9fafb;
            border-radius: 6px;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #1a1a1a;
            margin-bottom: 2rem;
        }

        .choices-list {
            margin-bottom: 2rem;
        }

        .choice-item {
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .choice-item:hover {
            border-color: #d97706;
            background: #fff7ed;
        }

        .choice-item.selected {
            border-color: #d97706;
            background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%);
        }

        .choice-item.correct {
            border-color: #22c55e;
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
        }

        .choice-item.incorrect {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
        }

        .choice-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .choice-item.selected .choice-letter {
            background: #d97706;
            border-color: #d97706;
            color: white;
        }

        .choice-item.correct .choice-letter {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .choice-item.incorrect .choice-letter {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .choice-text {
            flex: 1;
        }

        .choice-percentage {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            margin-left: 1rem;
        }

        .answer-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            display: none;
        }

        .answer-section.visible {
            display: block;
        }

        .explanation {
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
            border-left: 4px solid #3b82f6;
            padding: 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .explanation h4 {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }

        .explanation p {
            line-height: 1.7;
            color: #374151;
        }

        .comments-section {
            margin-top: 2rem;
        }

        .comments-section h4 {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .comment-item {
            background: #f9fafb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .comment-text {
            color: #1a1a1a;
        }

        .comment-form {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .comment-input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-comment {
            background: #d97706;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .test-actions {
            background: white;
            border-top: 2px solid #f0f0f0;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-test {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-secondary {
            background: #f9fafb;
            border: 2px solid #f0f0f0;
            color: #1a1a1a;
        }

        .btn-secondary:hover {
            border-color: #d97706;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-show-answer {
            background: #3b82f6;
            color: white;
            margin-top: 1.5rem;
        }

        .btn-show-answer:hover {
            background: #2563eb;
        }

        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .results-overlay.visible {
            display: flex;
        }

        .results-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .results-card h2 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 2rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .result-stat {
            text-align: center;
        }

        .result-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #d97706;
            margin-bottom: 0.5rem;
        }

        .result-label {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="test-layout">
        <!-- Test Header -->
        <div class="test-header">
            <div class="test-info">
                <div class="info-item">
                    <span class="info-label">Questão</span>
                    <span class="info-value">
                        <span id="current-question">1</span> / <span id="total-questions">10</span>
                    </span>
                </div>
                <div class="info-item">
                    <span class="info-label">Tempo</span>
                    <span class="info-value timer" id="timer">00:00</span>
                </div>
            </div>
            <div>
                <button class="btn-test btn-secondary" onclick="pauseTest()">⏸ Pausar</button>
                <button class="btn-test btn-primary" onclick="finishTest()">✓ Finalizar</button>
            </div>
        </div>

        <!-- Test Content -->
        <div class="test-content">
            <!-- Sidebar Navigation -->
            <div class="sidebar">
                <h3>Navegação</h3>
                <div class="question-nav-grid" id="question-nav">
                    <!-- Filled by JavaScript -->
                </div>
            </div>

            <!-- Main Test Area -->
            <div class="main-test">
                <div class="question-container">
                    <!-- Question Tags -->
                    <div class="question-tags" id="question-tags">
                        Loading...
                    </div>

                    <!-- Question Text -->
                    <div class="question-text" id="question-text">
                        Loading question...
                    </div>

                    <!-- Choices -->
                    <div class="choices-list" id="choices-list">
                        <!-- Filled by JavaScript -->
                    </div>

                    <!-- Show Answer Button -->
                    <button class="btn-test btn-show-answer" id="btn-show-answer" onclick="showAnswer()" style="display: none;">
                        Ver Resposta
                    </button>

                    <!-- Answer Section (Hidden initially) -->
                    <div class="answer-section" id="answer-section">
                        <div class="explanation">
                            <h4>💡 Explicação</h4>
                            <p id="explanation-text"></p>
                        </div>

                        <!-- Comments Section -->
                        <div class="comments-section">
                            <h4>💬 Comentários</h4>
                            <div id="comments-list">
                                <!-- Filled by JavaScript -->
                            </div>
                            <div class="comment-form">
                                <input
                                    type="text"
                                    class="comment-input"
                                    id="comment-input"
                                    placeholder="Adicione um comentário..."
                                >
                                <button class="btn-comment" onclick="addComment()">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Test Actions -->
        <div class="test-actions">
            <button class="btn-test btn-secondary" onclick="previousQuestion()" id="btn-previous">
                ← Anterior
            </button>
            <button class="btn-test btn-primary" onclick="nextQuestion()" id="btn-next">
                Próxima →
            </button>
        </div>
    </div>

    <!-- Results Overlay -->
    <div class="results-overlay" id="results-overlay">
        <div class="results-card">
            <h2>🎉 Teste Concluído!</h2>
            <div class="results-grid">
                <div class="result-stat">
                    <div class="result-number" id="result-correct">0</div>
                    <div class="result-label">Corretas</div>
                </div>
                <div class="result-stat">
                    <div class="result-number" id="result-incorrect">0</div>
                    <div class="result-label">Incorretas</div>
                </div>
                <div class="result-stat">
                    <div class="result-number" id="result-percentage">0%</div>
                    <div class="result-label">Acertos</div>
                </div>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn-test btn-secondary" onclick="reviewTest()">
                    Revisar Questões
                </button>
                <button class="btn-test btn-primary" onclick="window.location.href='flash-questions-dashboard.html'">
                    Voltar ao Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/flash-questions-test.js"></script>
</body>
</html>
