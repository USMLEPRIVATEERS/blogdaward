<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Respostas dos Questionários</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .questionnaire-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .students-sidebar {
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            padding: 1rem;
            max-height: 80vh;
            overflow-y: auto;
        }

        .student-item {
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .student-item:hover {
            background: #f9fafb;
            border-color: #e5e7eb;
        }

        .student-item.active {
            background: #eff6ff;
            border-color: #C45700;
        }

        .student-item-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .student-item-progress {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .responses-container {
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            padding: 2rem;
        }

        .step-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .step-section:last-child {
            border-bottom: none;
        }

        .step-header {
            background: linear-gradient(135deg, #C45700, #ff8c42);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .response-item {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #f9fafb;
            border-radius: 6px;
        }

        .response-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .response-value {
            color: #1f2937;
            font-size: 0.95rem;
        }

        .empty-state-responses {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .export-btn {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </div>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="#" class="nav-link" id="mentor-dashboard-link">Dashboard</a>
            </nav>
            <div class="nav-user">
                <a href="profile.html" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="welcome-banner">
            <h1 class="welcome-title">📋 Respostas dos Questionários</h1>
            <p class="welcome-subtitle">Visualize as respostas completas de cada aluno</p>
        </div>

        <div class="questionnaire-grid">
            <!-- Sidebar com lista de alunos -->
            <div class="students-sidebar">
                <h3 style="margin-bottom: 1rem; font-size: 1rem;">Selecione um Aluno</h3>
                <div id="students-list">
                    <p class="text-muted">Carregando alunos...</p>
                </div>
            </div>

            <!-- Container de respostas -->
            <div class="responses-container">
                <div id="no-student-selected" class="empty-state-responses">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">👈</div>
                    <h3>Selecione um aluno</h3>
                    <p>Escolha um aluno da lista ao lado para ver suas respostas</p>
                </div>

                <div id="responses-content" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2 id="student-name" style="margin: 0;"></h2>
                        <button class="btn btn-outline export-btn" onclick="exportResponses()">📥 Exportar Respostas</button>
                    </div>
                    <div id="responses-sections"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        let userData = null;
        let allStudents = [];
        let currentStudent = null;
        let currentResponses = [];

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            // Check if user is mentor
            const isMentor = userData.role && userData.role.startsWith('mentor');
            if (!isMentor) {
                WardApp.showToast('Acesso restrito a mentores', 'error');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
                return;
            }

            // Set dashboard link based on mentor role
            const mentorName = userData.role.replace('mentor_', '');
            document.getElementById('mentor-dashboard-link').href = `mentor-dashboard-${mentorName}.html`;

            // Update user name
            const displayName = userData.full_name || userData.email.split('@')[0];
            document.querySelector('.user-name').textContent = displayName || 'Perfil';

            // Load students
            await loadStudents();
        });

        async function loadStudents() {
            const { data: students, error } = await WardApp.db
                .from('users')
                .select('id, full_name, email, questionnaire_step, first_login_completed')
                .eq('role', 'aluno')
                .order('full_name', { ascending: true });

            if (error) {
                console.error('Error loading students:', error);
                document.getElementById('students-list').innerHTML = '<p class="text-muted">Erro ao carregar alunos</p>';
                return;
            }

            if (!students || students.length === 0) {
                document.getElementById('students-list').innerHTML = '<p class="text-muted">Nenhum aluno encontrado</p>';
                return;
            }

            allStudents = students;
            renderStudentsList();
        }

        function renderStudentsList() {
            const container = document.getElementById('students-list');

            container.innerHTML = allStudents.map(student => {
                const step = student.questionnaire_step || 0;
                const completed = student.first_login_completed && step >= 11;
                const progress = Math.round((step / 11) * 100);

                return `
                    <div class="student-item" onclick="selectStudent(${student.id})">
                        <div class="student-item-name">${student.full_name || student.email}</div>
                        <div class="student-item-progress">
                            ${completed ? '✅ Completo' : `📊 ${progress}% (${step}/11 etapas)`}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectStudent(studentId) {
            // Update active state
            document.querySelectorAll('.student-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Load student data
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return;

            // Load questionnaire responses
            const { data: responses, error } = await WardApp.db
                .from('questionnaire_data')
                .select('*')
                .eq('user_id', studentId)
                .order('step', { ascending: true });

            if (error) {
                console.error('Error loading responses:', error);
                WardApp.showToast('Erro ao carregar respostas', 'error');
                return;
            }

            currentStudent = student;
            currentResponses = responses || [];
            renderStudentResponses();
        }

        function renderStudentResponses() {
            document.getElementById('no-student-selected').style.display = 'none';
            document.getElementById('responses-content').style.display = 'block';
            document.getElementById('student-name').textContent = currentStudent.full_name || currentStudent.email;

            const sections = document.getElementById('responses-sections');
            sections.innerHTML = '';

            // Render all 11 steps
            for (let step = 1; step <= 11; step++) {
                const stepData = currentResponses.find(r => r.step === step);
                const data = stepData ? stepData.data : {};

                sections.innerHTML += renderStep(`Step ${step}`, data);
            }
        }

        function renderStep(title, data) {
            if (!data || Object.keys(data).length === 0) {
                return `
                    <div class="step-section">
                        <div class="step-header">${title}</div>
                        <div class="response-item">
                            <div class="response-value" style="color: #9ca3af; font-style: italic;">Nenhuma resposta registrada</div>
                        </div>
                    </div>
                `;
            }

            const items = Object.entries(data).map(([key, value]) => {
                // Format key to be more readable
                const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                // Format value
                let displayValue = value;
                if (typeof value === 'boolean') {
                    displayValue = value ? 'Sim' : 'Não';
                } else if (value === null || value === undefined || value === '') {
                    displayValue = '-';
                } else if (typeof value === 'object') {
                    displayValue = JSON.stringify(value, null, 2);
                }

                return `
                    <div class="response-item">
                        <div class="response-label">${label}</div>
                        <div class="response-value">${displayValue}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="step-section">
                    <div class="step-header">${title}</div>
                    ${items}
                </div>
            `;
        }

        function exportResponses() {
            if (!currentStudent) return;

            // Create text content
            let content = `RESPOSTAS DO QUESTIONÁRIO\n`;
            content += `Aluno: ${currentStudent.full_name || currentStudent.email}\n`;
            content += `Email: ${currentStudent.email}\n`;
            content += `Data de Exportação: ${new Date().toLocaleString('pt-BR')}\n`;
            content += `\n${'='.repeat(80)}\n\n`;

            // Add all steps
            for (let step = 1; step <= 11; step++) {
                const stepData = currentResponses.find(r => r.step === step);
                const data = stepData ? stepData.data : {};

                content += `STEP ${step}\n${'-'.repeat(80)}\n`;

                if (!data || Object.keys(data).length === 0) {
                    content += 'Nenhuma resposta registrada\n';
                } else {
                    Object.entries(data).forEach(([key, value]) => {
                        const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        let displayValue = value;
                        if (typeof value === 'boolean') {
                            displayValue = value ? 'Sim' : 'Não';
                        } else if (value === null || value === undefined || value === '') {
                            displayValue = '-';
                        } else if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        content += `${label}: ${displayValue}\n`;
                    });
                }
                content += `\n`;
            }

            // Download as text file
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `questionario_${currentStudent.full_name || currentStudent.email}_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            WardApp.showToast('Respostas exportadas com sucesso!');
        }
    </script>
</body>
</html>
