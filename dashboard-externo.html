<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ward Academy Self Assessments</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f9fafb;
            font-family: 'Inter', sans-serif;
        }

        .dashboard-header {
            background: white;
            border-bottom: 2px solid #f0f0f0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-logo {
            font-size: 1.75rem;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .header-subtitle {
            font-size: 0.8rem;
            color: #666;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-name {
            font-weight: 600;
            color: #1a1a1a;
        }

        .btn-logout {
            padding: 0.5rem 1rem;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .welcome-section {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            border-radius: 16px;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }

        .welcome-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
        }

        .welcome-text {
            font-size: 1rem;
            opacity: 0.9;
            margin: 0;
        }

        .partnership-info {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0 0 1.5rem 0;
        }

        .assessments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .assessment-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        .assessment-card:hover {
            border-color: #d97706;
            box-shadow: 0 4px 16px rgba(217, 119, 6, 0.1);
        }

        .assessment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .assessment-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
        }

        .assessment-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-available {
            background: #dcfce7;
            color: #166534;
        }

        .badge-enrolled {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-completed {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .badge-results-ready {
            background: #d97706;
            color: white;
        }

        .assessment-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .assessment-stats {
            display: flex;
            gap: 1.5rem;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d97706;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .assessment-progress {
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #666;
        }

        .assessment-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-action {
            flex: 1;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            color: #1a1a1a;
        }

        .btn-secondary:hover {
            border-color: #d97706;
            color: #d97706;
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-disabled {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .dashboard-header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .dashboard-content {
                padding: 1rem;
            }

            .welcome-section {
                padding: 1.5rem;
            }

            .welcome-title {
                font-size: 1.5rem;
            }

            .assessments-grid {
                grid-template-columns: 1fr;
            }

            .assessment-stats {
                flex-wrap: wrap;
                justify-content: center;
            }

            .assessment-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-brand">
            <span class="header-logo">🎓</span>
            <div>
                <div class="header-title">WARD ACADEMY</div>
                <div class="header-subtitle">Self Assessments</div>
            </div>
        </div>
        <div class="header-user">
            <span class="user-name" id="user-name">Carregando...</span>
            <button class="btn-logout" onclick="WardApp.logout()">Sair</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-content">
        <!-- Welcome Section -->
        <section class="welcome-section">
            <h1 class="welcome-title">Bem-vindo(a), <span id="welcome-name">Usuario</span>!</h1>
            <p class="welcome-text">Realize nossos Self Assessments gratuitos e avalie seu nivel de preparacao para o USMLE.</p>
            <div class="partnership-info">
                🤝 Parceria Ward Academy + USMLE Privateers
            </div>
        </section>

        <!-- Self Assessments Section -->
        <section>
            <h2 class="section-title">Self Assessments Disponiveis</h2>
            <div class="assessments-grid" id="assessments-grid">
                <!-- Cards will be loaded by JavaScript -->
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <p>Carregando Self Assessments...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard-externo.js"></script>
</body>
</html>
