<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ward Academy Self Assessments</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
        }

        .register-box {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 2px solid #f0f0f0;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .register-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
        }

        .register-subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .partnership-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #92400e;
            font-weight: 600;
            margin-top: 1rem;
            border: 1px solid #fcd34d;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        .form-input.error {
            border-color: #ef4444;
        }

        .form-hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.35rem;
        }

        .form-error {
            font-size: 0.8rem;
            color: #ef4444;
            margin-top: 0.35rem;
            display: none;
        }

        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }

        .password-strength-bar.weak { width: 33%; background: #ef4444; }
        .password-strength-bar.medium { width: 66%; background: #f59e0b; }
        .password-strength-bar.strong { width: 100%; background: #22c55e; }

        .btn-register {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(217, 119, 6, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }

        .login-link a {
            color: #d97706;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Phone input styles */
        .phone-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .country-code-input {
            width: 80px;
            flex-shrink: 0;
        }

        .phone-number-input {
            flex: 1;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 1.5rem;
            }

            .register-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <div class="register-logo">🎓</div>
                <h1 class="register-title">WARD ACADEMY</h1>
                <p class="register-subtitle">Self Assessments Gratuitos</p>
                <div class="partnership-badge">
                    🤝 Parceria com USMLE Privateers
                </div>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name">Nome Completo *</label>
                    <input
                        type="text"
                        id="name"
                        class="form-input"
                        placeholder="Seu nome completo"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="cpf">CPF *</label>
                    <input
                        type="text"
                        id="cpf"
                        class="form-input"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                    <p class="form-error" id="cpf-error">CPF invalido</p>
                </div>

                <div class="form-group">
                    <label class="form-label">WhatsApp *</label>
                    <div class="phone-input-group">
                        <input
                            type="text"
                            id="country-code"
                            class="form-input country-code-input"
                            placeholder="+55"
                            maxlength="4"
                            required
                        >
                        <input
                            type="text"
                            id="phone-number"
                            class="form-input phone-number-input"
                            placeholder="11 99999-9999"
                            required
                        >
                    </div>
                    <p class="form-hint">Inclua o codigo do pais e DDD. Ex: +55 11 99999-9999</p>
                    <p class="form-error" id="phone-error">Numero de telefone invalido</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="seu@email.com"
                        required
                    >
                    <p class="form-error" id="email-error">Email invalido</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha *</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Minimo 6 caracteres"
                        minlength="6"
                        required
                        autocomplete="new-password"
                        data-lpignore="true"
                        data-form-type="other"
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <p class="form-hint">Minimo 6 caracteres</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirmar Senha *</label>
                    <input
                        type="password"
                        id="confirm-password"
                        class="form-input"
                        placeholder="Digite a senha novamente"
                        required
                        autocomplete="new-password"
                        data-lpignore="true"
                        data-form-type="other"
                    >
                    <p class="form-error" id="password-match-error">As senhas nao coincidem</p>
                </div>

                <button type="submit" class="btn-register" id="btn-register">
                    CRIAR CONTA
                </button>
            </form>

            <div class="login-link">
                <p>Ja tem uma conta? <a href="index.html">Fazer login</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
