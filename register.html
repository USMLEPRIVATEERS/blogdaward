<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ward Academy — cadastro gratuito para os Self Assessments do USMLE.">
    <title>Cadastro - Ward Academy Self Assessments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        /* Mesmo vocabulário visual da tela de login (login-container/login-box) */
        body {
            background:
                radial-gradient(ellipse 60% 45% at 12% -5%, rgba(196, 87, 0, 0.07), transparent),
                radial-gradient(ellipse 55% 40% at 95% 105%, rgba(196, 87, 0, 0.06), transparent),
                linear-gradient(135deg, var(--gray-100) 0%, var(--primary-white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
        }

        .register-box {
            background: var(--primary-white);
            border-radius: var(--radius-xl);
            padding: 2.75rem 2.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-200);
            animation: registerBoxIn 0.45s ease both;
        }

        @keyframes registerBoxIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-logo {
            font-size: 2.25rem;
            line-height: 1;
            margin: 0 auto 1.25rem;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(196, 87, 0, 0.12), rgba(196, 87, 0, 0.05));
            border: 1px solid rgba(196, 87, 0, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 6px rgba(196, 87, 0, 0.08);
        }

        .register-title {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: var(--primary-black);
            margin: 0;
        }

        .register-subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-top: 0.35rem;
            margin-bottom: 0;
        }

        .partnership-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #92400e;
            font-weight: 600;
            margin-top: 1rem;
            border: 1px solid #fde68a;
            box-shadow: 0 1px 2px rgba(146, 64, 14, 0.06);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-300);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            box-sizing: border-box;
        }

        .form-input:hover:not(:focus) {
            border-color: var(--gray-400);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 4px var(--accent-orange-ring);
        }

        .form-input.error {
            border-color: var(--danger-red);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.14);
        }

        .form-hint {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.35rem;
        }

        .form-error {
            font-size: 0.8rem;
            color: var(--danger-red);
            font-weight: 500;
            margin-top: 0.35rem;
            display: none;
        }

        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--gray-200);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .password-strength-bar.weak { width: 33%; background: #ef4444; }
        .password-strength-bar.medium { width: 66%; background: #f59e0b; }
        .password-strength-bar.strong { width: 100%; background: #22c55e; }

        .btn-register {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(180deg, #d46312 0%, var(--accent-orange) 100%);
            color: var(--primary-white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 0.5rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 1px 2px rgba(163, 73, 0, 0.25);
        }

        .btn-register:hover:not(:disabled) {
            background: linear-gradient(180deg, var(--accent-orange-light) 0%, #cf5c00 100%);
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 12px rgba(196, 87, 0, 0.32);
        }

        .btn-register:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-register:focus-visible {
            outline: 2px solid var(--accent-orange);
            outline-offset: 2px;
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }

        .login-link p {
            margin: 0;
            color: var(--gray-600);
            font-size: 0.95rem;
        }

        .login-link a {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: var(--accent-orange-light);
            text-decoration: underline;
        }

        /* Phone input styles */
        .phone-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .country-code-input {
            width: 84px;
            flex-shrink: 0;
        }

        .phone-number-input {
            flex: 1;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 2rem 1.5rem;
            }

            .register-title {
                font-size: 1.4rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .register-box {
                animation: none;
            }

            .password-strength-bar {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <div class="register-logo">🎓</div>
                <h1 class="register-title">WARD ACADEMY</h1>
                <p class="register-subtitle">Self Assessments Gratuitos</p>
                <div class="partnership-badge">
                    🤝 Parceria com USMLE Privateers
                </div>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name">Nome Completo *</label>
                    <input
                        type="text"
                        id="name"
                        class="form-input"
                        placeholder="Seu nome completo"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="cpf">CPF *</label>
                    <input
                        type="text"
                        id="cpf"
                        class="form-input"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                    <p class="form-error" id="cpf-error">CPF inválido</p>
                </div>

                <div class="form-group">
                    <label class="form-label">WhatsApp *</label>
                    <div class="phone-input-group">
                        <input
                            type="text"
                            id="country-code"
                            class="form-input country-code-input"
                            placeholder="+55"
                            maxlength="4"
                            required
                        >
                        <input
                            type="text"
                            id="phone-number"
                            class="form-input phone-number-input"
                            placeholder="11 99999-9999"
                            required
                        >
                    </div>
                    <p class="form-hint">Inclua o código do país e DDD. Ex: +55 11 99999-9999</p>
                    <p class="form-error" id="phone-error">Número de telefone inválido</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="seu@email.com"
                        required
                    >
                    <p class="form-error" id="email-error">Email inválido</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha *</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Mínimo 6 caracteres"
                        minlength="6"
                        required
                        autocomplete="new-password"
                        data-lpignore="true"
                        data-form-type="other"
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <p class="form-hint">Mínimo 6 caracteres</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirmar Senha *</label>
                    <input
                        type="password"
                        id="confirm-password"
                        class="form-input"
                        placeholder="Digite a senha novamente"
                        required
                        autocomplete="new-password"
                        data-lpignore="true"
                        data-form-type="other"
                    >
                    <p class="form-error" id="password-match-error">As senhas não coincidem</p>
                </div>

                <button type="submit" class="btn-register" id="btn-register">
                    CRIAR CONTA
                </button>
            </form>

            <div class="login-link">
                <p>Já tem uma conta? <a href="/">Fazer login</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/security.js"></script>
    <script src="js/secure-auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
