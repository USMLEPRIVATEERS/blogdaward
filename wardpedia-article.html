<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Wardpedia</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .wpa-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Breadcrumb */
        .wpa-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .wpa-breadcrumb a {
            color: #7c3aed;
            text-decoration: none;
        }

        .wpa-breadcrumb a:hover {
            text-decoration: underline;
        }

        .wpa-breadcrumb-sep {
            color: #d1d5db;
        }

        .wpa-breadcrumb-current {
            color: #6b7280;
        }

        /* Article header */
        .wpa-header {
            margin-bottom: 2rem;
        }

        .wpa-title {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .wpa-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .wpa-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .wpa-tag {
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .wpa-tag-step {
            background: #fee2e2;
            color: #dc2626;
        }

        .wpa-tag-subject {
            background: #ede9fe;
            color: #6d28d9;
        }

        .wpa-tag-system {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .wpa-tag-category {
            background: #d1fae5;
            color: #047857;
        }

        /* Actions bar */
        .wpa-actions {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e9ecef;
        }

        .wpa-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #e9ecef;
            background: #fff;
            color: #374151;
        }

        .wpa-action-btn:hover {
            border-color: #7c3aed;
            color: #7c3aed;
        }

        .wpa-action-btn.favorited {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #d97706;
        }

        /* Article content */
        .wpa-content {
            background: #fff;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 2rem;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1rem;
            color: #374151;
        }

        .wpa-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .wpa-content h1, .wpa-content h2, .wpa-content h3 {
            color: #111827;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .wpa-content ul, .wpa-content ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }

        .wpa-content blockquote {
            border-left: 4px solid #7c3aed;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #6b7280;
            font-style: italic;
        }

        .wpa-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .wpa-content table th, .wpa-content table td {
            border: 1px solid #e9ecef;
            padding: 0.5rem 0.75rem;
            text-align: left;
        }

        .wpa-content table th {
            background: #f9fafb;
            font-weight: 600;
        }

        /* Comments section */
        .wpa-comments {
            background: #fff;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 1.5rem;
        }

        .wpa-comments-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 1rem;
        }

        .wpa-comment-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .wpa-comment-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.9rem;
            resize: none;
        }

        .wpa-comment-input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .wpa-comment-submit {
            padding: 0.75rem 1.25rem;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            align-self: flex-end;
        }

        .wpa-comment-submit:hover {
            background: #6d28d9;
        }

        .wpa-comment-item {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .wpa-comment-item:last-child {
            border-bottom: none;
        }

        .wpa-comment-avatar {
            width: 36px;
            height: 36px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .wpa-comment-body {
            flex: 1;
        }

        .wpa-comment-author {
            font-weight: 500;
            font-size: 0.9rem;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .wpa-comment-author .mentor-badge {
            background: #7c3aed;
            color: #fff;
            font-size: 0.65rem;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            margin-left: 0.4rem;
            font-weight: 600;
        }

        .wpa-comment-text {
            font-size: 0.9rem;
            color: #374151;
            line-height: 1.5;
        }

        .wpa-comment-footer {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .wpa-comment-action {
            cursor: pointer;
            border: none;
            background: none;
            color: #9ca3af;
            font-size: 0.8rem;
            padding: 0;
        }

        .wpa-comment-action:hover {
            color: #7c3aed;
        }

        .wpa-comment-action.delete:hover {
            color: #dc2626;
        }

        .wpa-no-comments {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
        }

        /* Edit comment inline */
        .wpa-edit-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 2px solid #7c3aed;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .wpa-edit-actions {
            display: flex;
            gap: 0.5rem;
        }

        .wpa-edit-actions button {
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
        }

        .wpa-edit-save {
            background: #7c3aed;
            color: #fff;
        }

        .wpa-edit-cancel {
            background: #e5e7eb;
            color: #374151;
        }

        /* Loading */
        .wpa-loading {
            text-align: center;
            padding: 4rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/cronograma" class="nav-link">Cronograma</a>
                <a href="/landmarks" class="nav-link">Chamadas</a>
                <a href="/curso" class="nav-link">Curso</a>
                <a href="/wardpedia" class="nav-link active">Wardpedia</a>
                <a href="/links" class="nav-link">Links</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/pesquisa" class="nav-link">Pesquisa</a>
                <a href="/diary-uworld" class="nav-link" id="nav-diary" style="display: none;">Diario</a>
            </nav>
            <div class="nav-user">
                <a href="/profile" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="wpa-container">
            <!-- Loading -->
            <div id="wpa-loading" class="wpa-loading">
                <div class="loading-spinner"></div>
                <p class="text-muted">Carregando artigo...</p>
            </div>

            <!-- Article Content (filled by JS) -->
            <div id="article-wrapper" style="display: none;">
                <!-- Breadcrumb -->
                <div class="wpa-breadcrumb">
                    <a href="/wardpedia">Wardpedia</a>
                    <span class="wpa-breadcrumb-sep">›</span>
                    <span class="wpa-breadcrumb-current" id="breadcrumb-title"></span>
                </div>

                <!-- Header -->
                <div class="wpa-header">
                    <h1 class="wpa-title" id="article-title"></h1>
                    <div class="wpa-meta">
                        <span id="article-author"></span>
                        <span id="article-date"></span>
                        <span id="article-views"></span>
                    </div>
                    <div class="wpa-tags" id="article-tags"></div>
                </div>

                <!-- Actions -->
                <div class="wpa-actions">
                    <button class="wpa-action-btn" id="favorite-btn" onclick="toggleFavorite()">
                        <span id="fav-icon">☆</span>
                        <span id="fav-text">Favoritar</span>
                        <span id="fav-count">(0)</span>
                    </button>
                    <button class="wpa-action-btn" onclick="copyArticleLink()">
                        🔗 Copiar Link
                    </button>
                    <button class="wpa-action-btn" onclick="window.location.href='/wardpedia'">
                        ← Voltar
                    </button>
                </div>

                <!-- Content -->
                <div class="wpa-content" id="article-content">
                    <!-- Filled by JS -->
                </div>

                <!-- Comments -->
                <div class="wpa-comments">
                    <div class="wpa-comments-header" id="comments-header">💬 Comentarios</div>

                    <!-- Comment form -->
                    <div class="wpa-comment-form">
                        <textarea class="wpa-comment-input" id="comment-input" rows="2" placeholder="Escreva um comentario..." maxlength="500"></textarea>
                        <button class="wpa-comment-submit" onclick="addComment()">Enviar</button>
                    </div>

                    <!-- Comments list -->
                    <div id="comments-list">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        let userData = null;
        let isMentor = false;
        let article = null;
        let articleId = null;
        let comments = [];
        let usersMap = {};
        let isFavorited = false;

        // Helper to decrypt user data if encrypted
        function _dn(val) {
            if (!val) return val;
            return WardApp._prs ? WardApp._prs(val) : val;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) return;

            if (userData.role === 'assessoria') {
                alert('Esta pagina esta disponivel apenas para membros completos da Ward Academy.');
                window.location.href = '/dashboard-assessoria-avulsa';
                return;
            }

            isMentor = userData.role && userData.role.startsWith('mentor_');

            const diariesEnabled = localStorage.getItem('study_diary_enabled') === 'true';
            const diaryLink = document.getElementById('nav-diary');
            if (diaryLink && diariesEnabled) diaryLink.style.display = 'block';

            // Get article ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            articleId = urlParams.get('id');

            if (!articleId) {
                window.location.href = '/wardpedia';
                return;
            }

            await loadArticle();
        });

        async function loadArticle() {
            const { data, error } = await WardApp.db
                .from('wardpedia_articles')
                .select('*')
                .eq('id', articleId)
                .maybeSingle();

            if (error || !data) {
                WardApp.showToast('Artigo nao encontrado', 'error');
                setTimeout(() => window.location.href = '/wardpedia', 1500);
                return;
            }

            article = data;
            document.title = `Ward Academy - ${article.title}`;

            // Load everything in parallel
            await Promise.all([
                loadAuthor(),
                loadComments(),
                checkFavorite(),
                trackView()
            ]);

            renderArticle();
            renderComments();

            document.getElementById('wpa-loading').style.display = 'none';
            document.getElementById('article-wrapper').style.display = 'block';
        }

        async function loadAuthor() {
            if (!article.author_id) return;
            const { data } = await WardApp.db
                .from('users')
                .select('id, name, full_name, role')
                .eq('id', article.author_id)
                .maybeSingle();
            if (data) usersMap[data.id] = data;
        }

        async function loadComments() {
            const { data } = await WardApp.db
                .from('wardpedia_comments')
                .select('*')
                .eq('article_id', articleId)
                .eq('is_deleted', false)
                .order('created_at', { ascending: true });

            comments = data || [];

            // Load comment authors
            const userIds = [...new Set(comments.map(c => c.user_id).filter(id => id && !usersMap[id]))];
            if (userIds.length > 0) {
                const { data: users } = await WardApp.db
                    .from('users')
                    .select('id, name, full_name, role')
                    .in('id', userIds);
                if (users) {
                    users.forEach(u => { usersMap[u.id] = u; });
                }
            }
        }

        async function checkFavorite() {
            const { data } = await WardApp.db
                .from('wardpedia_favorites')
                .select('id')
                .eq('article_id', articleId)
                .eq('user_id', userData.id)
                .maybeSingle();
            isFavorited = !!data;
        }

        async function trackView() {
            // Upsert view (one per user per article)
            // DB trigger auto-updates view_count on wardpedia_articles
            await WardApp.db
                .from('wardpedia_views')
                .upsert({
                    article_id: articleId,
                    user_id: userData.id,
                    viewed_at: new Date().toISOString()
                }, { onConflict: 'article_id,user_id' });

            // Update local count for display
            article.view_count = (article.view_count || 0) + 1;
        }

        // =============================================
        // RENDERING
        // =============================================

        function renderArticle() {
            const author = usersMap[article.author_id];
            const authorName = author ? (_dn(author.name) || _dn(author.full_name) || 'Mentor') : 'Ward Academy';
            const date = new Date(article.created_at).toLocaleDateString('pt-BR', {
                day: '2-digit', month: 'long', year: 'numeric'
            });

            document.getElementById('breadcrumb-title').textContent = article.title;
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-author').textContent = `Por ${authorName}`;
            document.getElementById('article-date').textContent = date;
            document.getElementById('article-views').textContent = `${article.view_count || 0} visualizacoes`;

            // Tags
            let tagsHtml = '';
            if (article.steps) {
                tagsHtml += article.steps.map(s =>
                    `<span class="wpa-tag wpa-tag-step">${escapeHtml(s)}</span>`
                ).join('');
            }
            if (article.subjects) {
                tagsHtml += article.subjects.map(s =>
                    `<span class="wpa-tag wpa-tag-subject">${escapeHtml(s)}</span>`
                ).join('');
            }
            if (article.systems) {
                tagsHtml += article.systems.map(s =>
                    `<span class="wpa-tag wpa-tag-system">${escapeHtml(s)}</span>`
                ).join('');
            }
            if (article.categories) {
                tagsHtml += article.categories.map(c => {
                    const parts = c.split('::');
                    const catName = parts.length > 1 ? parts[1] : c;
                    return `<span class="wpa-tag wpa-tag-category">${escapeHtml(catName)}</span>`;
                }).join('');
            }
            document.getElementById('article-tags').innerHTML = tagsHtml;

            // Content (HTML from rich text editor)
            document.getElementById('article-content').innerHTML = article.content;

            // Favorite button
            updateFavoriteButton();
        }

        function updateFavoriteButton() {
            const btn = document.getElementById('favorite-btn');
            const icon = document.getElementById('fav-icon');
            const text = document.getElementById('fav-text');
            const count = document.getElementById('fav-count');

            if (isFavorited) {
                btn.classList.add('favorited');
                icon.textContent = '★';
                text.textContent = 'Favoritado';
            } else {
                btn.classList.remove('favorited');
                icon.textContent = '☆';
                text.textContent = 'Favoritar';
            }
            count.textContent = `(${article.favorite_count || 0})`;
        }

        async function toggleFavorite() {
            // DB triggers auto-update favorite_count on wardpedia_articles
            if (isFavorited) {
                // Remove favorite
                await WardApp.db
                    .from('wardpedia_favorites')
                    .delete()
                    .eq('article_id', articleId)
                    .eq('user_id', userData.id);

                article.favorite_count = Math.max(0, (article.favorite_count || 0) - 1);
                isFavorited = false;
                WardApp.showToast('Removido dos favoritos', 'info');
            } else {
                // Add favorite
                await WardApp.db
                    .from('wardpedia_favorites')
                    .insert({
                        article_id: articleId,
                        user_id: userData.id
                    });

                article.favorite_count = (article.favorite_count || 0) + 1;
                isFavorited = true;
                WardApp.showToast('Adicionado aos favoritos!', 'success');
            }

            updateFavoriteButton();
        }

        // =============================================
        // COMMENTS
        // =============================================

        function renderComments() {
            const container = document.getElementById('comments-list');
            const header = document.getElementById('comments-header');
            header.textContent = `💬 Comentarios (${comments.length})`;

            if (comments.length === 0) {
                container.innerHTML = '<div class="wpa-no-comments">Nenhum comentario ainda. Seja o primeiro!</div>';
                return;
            }

            container.innerHTML = comments.map(c => {
                const author = usersMap[c.user_id];
                const authorName = author ? (_dn(author.name) || _dn(author.full_name) || 'Usuario') : 'Usuario';
                const authorRole = author?.role || 'aluno';
                const isAuthorMentor = authorRole.startsWith('mentor_');
                const date = new Date(c.created_at).toLocaleDateString('pt-BR');
                const canEdit = String(c.user_id) === String(userData.id) || isMentor;
                const canDelete = String(c.user_id) === String(userData.id) || isMentor;

                return `
                    <div class="wpa-comment-item" id="comment-${c.id}">
                        <div class="wpa-comment-avatar">👤</div>
                        <div class="wpa-comment-body">
                            <div class="wpa-comment-author">
                                ${escapeHtml(authorName)}
                                ${isAuthorMentor ? '<span class="mentor-badge">Mentor</span>' : ''}
                            </div>
                            <div class="wpa-comment-text" id="comment-text-${c.id}">${escapeHtml(c.content)}</div>
                            <div class="wpa-comment-footer">
                                <span>${date}</span>
                                ${canEdit ? `<button class="wpa-comment-action" onclick="editComment('${c.id}')">Editar</button>` : ''}
                                ${canDelete ? `<button class="wpa-comment-action delete" onclick="deleteComment('${c.id}')">Remover</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function addComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            if (!content) return;

            const { data, error } = await WardApp.db
                .from('wardpedia_comments')
                .insert({
                    article_id: articleId,
                    user_id: userData.id,
                    content: content
                })
                .select();

            if (error) {
                WardApp.showToast('Erro ao adicionar comentario', 'error');
                return;
            }

            input.value = '';

            // Add to local array and re-render
            if (data && data[0]) {
                comments.push(data[0]);
                if (!usersMap[userData.id]) {
                    usersMap[userData.id] = { id: userData.id, name: userData.name, full_name: userData.full_name, role: userData.role };
                }
                renderComments();
            }

            WardApp.showToast('Comentario adicionado!', 'success');
        }

        function editComment(commentId) {
            const comment = comments.find(c => String(c.id) === String(commentId));
            if (!comment) return;

            const textEl = document.getElementById(`comment-text-${commentId}`);
            const currentText = comment.content;

            textEl.innerHTML = `
                <textarea class="wpa-edit-input" id="edit-input-${commentId}" rows="2">${escapeHtml(currentText)}</textarea>
                <div class="wpa-edit-actions">
                    <button class="wpa-edit-save" onclick="saveEditComment('${commentId}')">Salvar</button>
                    <button class="wpa-edit-cancel" onclick="cancelEditComment('${commentId}', '${escapeAttr(currentText)}')">Cancelar</button>
                </div>
            `;
        }

        async function saveEditComment(commentId) {
            const input = document.getElementById(`edit-input-${commentId}`);
            const newContent = input.value.trim();
            if (!newContent) return;

            const { error } = await WardApp.db
                .from('wardpedia_comments')
                .update({ content: newContent, updated_at: new Date().toISOString() })
                .eq('id', commentId);

            if (error) {
                WardApp.showToast('Erro ao editar comentario', 'error');
                return;
            }

            // Update local data
            const comment = comments.find(c => String(c.id) === String(commentId));
            if (comment) comment.content = newContent;
            renderComments();
            WardApp.showToast('Comentario atualizado!', 'success');
        }

        function cancelEditComment(commentId, originalText) {
            const comment = comments.find(c => String(c.id) === String(commentId));
            if (comment) {
                document.getElementById(`comment-text-${commentId}`).textContent = comment.content;
            }
        }

        async function deleteComment(commentId) {
            if (!confirm('Tem certeza que deseja remover este comentario?')) return;

            const { error } = await WardApp.db
                .from('wardpedia_comments')
                .update({ is_deleted: true })
                .eq('id', commentId);

            if (error) {
                WardApp.showToast('Erro ao remover comentario', 'error');
                return;
            }

            comments = comments.filter(c => String(c.id) !== String(commentId));
            renderComments();
            WardApp.showToast('Comentario removido', 'info');
        }

        // =============================================
        // UTILITIES
        // =============================================

        function copyArticleLink() {
            const url = window.location.origin + '/wardpedia-article?id=' + articleId;
            navigator.clipboard.writeText(url).then(() => {
                WardApp.showToast('Link copiado!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                WardApp.showToast('Link copiado!', 'success');
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
