<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - To-Do List Guilherme</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .todo-loading {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 3rem 1rem; gap: 1rem;
        }
        .todo-loading .spinner {
            width: 40px; height: 40px; border: 4px solid #e5e7eb;
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .todo-loading .loading-text { color: #64748b; font-size: 0.9rem; }
        .todo-loading .loading-steps { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem; }
        .todo-loading .step {
            padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
            background: #f1f5f9; color: #94a3b8; transition: all 0.3s;
        }
        .todo-loading .step.done { background: #dcfce7; color: #16a34a; }
        .todo-loading .step.active { background: #dbeafe; color: #2563eb; }
        .todo-error {
            background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px;
            padding: 1.5rem; text-align: center; color: #dc2626;
        }
        .todo-error code { display: block; margin-top: 0.5rem; font-size: 0.8rem; color: #64748b; word-break: break-all; }

        /* Header & title mobile */
        .todo-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; }
        .todo-header h1 { margin: 0; font-size: 1.4rem; }

        /* Filter bar */
        .todo-filters {
            display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
            padding: 0.75rem 1rem; background: #f9fafb; border-radius: 12px; margin-bottom: 1.25rem;
            border: 1px solid #e5e7eb;
        }
        .todo-filters input, .todo-filters select {
            padding: 0.5rem 0.75rem; border: 2px solid #e5e7eb; border-radius: 8px;
            font-size: 0.9rem; font-family: inherit;
        }
        .todo-filters input { flex: 1; min-width: 180px; }
        .todo-filters select { font-weight: 600; }
        .todo-filters input:focus, .todo-filters select:focus { outline: none; border-color: #3b82f6; }

        /* Student card */
        .student-card { border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; margin-bottom: 0.75rem; background: white; }
        .student-card.paused { opacity: 0.65; }
        .student-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            gap: 0.5rem; padding: 0.85rem 1rem; cursor: pointer; transition: background 0.2s;
        }
        .student-header:hover { background: #f8fafc; }
        .student-name { font-size: 1rem; font-weight: 600; }
        .student-meta { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .anki-badge { font-size: 0.78rem; color: #64748b; white-space: nowrap; }
        .progress-bar { width: 70px; height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .progress-label { font-size: 0.72rem; font-weight: 700; }
        .expand-arrow { transition: transform 0.2s; font-size: 0.75rem; color: #94a3b8; }
        .expand-arrow.open { transform: rotate(180deg); }

        .student-body { padding: 0.75rem 1rem; border-top: 1px solid #f1f5f9; display: none; }
        .student-body.open { display: block; }

        /* Task table — mobile cards */
        .task-table { width: 100%; border-collapse: collapse; }
        .task-table th { padding: 0.4rem 0.5rem; font-size: 0.78rem; color: #94a3b8; font-weight: 600; text-align: center; background: #f8fafc; }
        .task-table th:first-child { text-align: left; }
        .task-table td { padding: 0.5rem; font-size: 0.85rem; text-align: center; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .task-table td:first-child { text-align: left; }
        .task-table input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #22c55e; }
        .task-table input[type="date"] {
            padding: 0.25rem 0.4rem; border: 1px solid #e5e7eb; border-radius: 6px;
            font-size: 0.82rem; font-family: inherit; max-width: 140px;
        }
        .msg-btn {
            background: #3b82f6; color: white; border: none; border-radius: 6px;
            padding: 0.2rem 0.45rem; cursor: pointer; font-size: 0.78rem;
        }
        .msg-btn:active { transform: scale(0.95); }

        /* Pause section */
        .pause-banner { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; }
        .pause-form-area { border: 1px dashed #e5e7eb; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; }

        /* Alerts */
        .alert-card { border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; margin-bottom: 0.75rem; }
        .alert-header { padding: 0.6rem 1rem; font-weight: 700; font-size: 0.9rem; }
        .alert-body { padding: 0; }
        .alert-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 1rem; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
        }
        .alert-item:last-child { border-bottom: none; }

        /* Modal */
        .msg-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; padding: 1rem; overflow-y: auto;
        }
        .msg-modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .msg-modal {
            background: white; border-radius: 12px; max-width: 520px; width: 100%;
            max-height: 85vh; overflow-y: auto; padding: 1.25rem;
        }
        .msg-template {
            background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 0.75rem; margin-bottom: 0.6rem;
        }
        .msg-template-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
        .copy-btn {
            background: #22c55e; color: white; border: none; border-radius: 6px;
            padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.78rem; font-weight: 600;
        }
        .copy-btn:active { transform: scale(0.95); }

        /* Mobile responsive */
        @media (max-width: 640px) {
            .todo-header h1 { font-size: 1.15rem; }
            .todo-filters { gap: 0.5rem; }
            .todo-filters input { min-width: 100%; }
            .student-meta { gap: 0.5rem; }
            .anki-badge { display: none; }
            .task-table th, .task-table td { padding: 0.35rem 0.3rem; font-size: 0.78rem; }
            .task-table input[type="date"] { font-size: 0.75rem; max-width: 115px; padding: 0.2rem 0.3rem; }
            .alert-item { font-size: 0.8rem; padding: 0.4rem 0.75rem; }
            .msg-modal { padding: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>
            <button class="mobile-menu-toggle">☰</button>
            <nav class="nav-menu">
                <a href="/mentor-dashboard-guilherme" class="nav-link">Dashboard</a>
                <a href="/mentor-todolist-guilherme" class="nav-link active">To-Do List</a>
                <a href="/mentor-cronograma" class="nav-link">Cronograma</a>
                <a href="/mentor-chamadas" class="nav-link">Chamadas</a>
                <a href="/links" class="nav-link">Links</a>
                <a href="/blog" class="nav-link">Blog</a>
            </nav>
            <div class="nav-user">
                <span class="user-name">Guilherme</span>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="todo-header">
            <h1>📋 To-Do List - Guilherme</h1>
            <a href="/mentor-dashboard-guilherme" class="btn btn-outline" style="font-size: 0.85rem;">← Dashboard</a>
        </div>

        <!-- Read-only banner for non-Guilherme users -->
        <div id="readonly-banner" style="display: none; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; color: #92400e;">
            <strong>👁️ Modo visualização</strong> - Você está vendo as tarefas do Guilherme. Apenas ele pode fazer alterações.
        </div>

        <!-- Alerts -->
        <div id="alerts-section"></div>

        <!-- Filters -->
        <div class="todo-filters">
            <input type="text" id="search-input" placeholder="🔍 Buscar aluno..." oninput="renderAll()">
            <select id="status-filter" onchange="renderAll()">
                <option value="all">Todos status</option>
                <option value="pending">Pendentes</option>
                <option value="completed">Concluídos</option>
            </select>
        </div>

        <!-- Students -->
        <div id="students-container">
            <div class="todo-loading" id="loading-indicator">
                <div class="spinner"></div>
                <div class="loading-text">Carregando dados...</div>
                <div class="loading-steps">
                    <span class="step active" id="step-students">Alunos</span>
                    <span class="step" id="step-tasks">Tarefas</span>
                    <span class="step" id="step-anki">Anki</span>
                    <span class="step" id="step-calls">Calls</span>
                </div>
            </div>
        </div>

        <!-- Message Modal -->
        <div id="msg-modal" class="msg-modal-overlay" onclick="if(event.target===this)closeMsgModal()">
            <div class="msg-modal">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="margin: 0; font-size: 1.05rem;" id="msg-modal-title">Mensagem</h3>
                    <button onclick="closeMsgModal()" style="background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #64748b;">✕</button>
                </div>
                <div id="msg-modal-body"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let userData = null;
        let guilhermeData = null; // Guilherme's user data (the owner of this to-do list)
        let canEdit = false; // Only Guilherme can edit
        let allStudents = [];
        let tasksMap = {};
        let ankiDataMap = {};


        const TASK_TYPES = [
            { key: 'entry_date', label: '📅 Data de entrada na Ward', recurring: false },
            { key: 'first_call', label: '📞 Data primeira call com Guilherme', recurring: false },
            { key: 'fsrs_optimization', label: '🔧 Otimizar FSRS (1x ao mês)', recurring: true, intervalDays: 30 },
            { key: 'heatmap_photo', label: '📸 Foto heatmap (15 em 15 dias)', recurring: true, intervalDays: 15 },
            { key: 'second_call', label: '📞 Segunda call otimizações (30 dias)', recurring: true, intervalDays: 30 }
        ];

        const MSG_TEMPLATES = {
            entry_date: [
                { title: 'Boas-vindas', msg: 'Oi, {nome}! Bem-vindo(a) a Ward Academy! Sou o Guilherme e vou te acompanhar na sua jornada. Vamos agendar nossa primeira call para alinhar tudo?' },
                { title: 'Lembrete de acesso', msg: 'Oi, {nome}! Só passando para lembrar de acessar a plataforma da Ward Academy e preencher o questionario inicial. Qualquer duvida estou a disposicao!' }
            ],
            first_call: [
                { title: 'Agendar call', msg: 'Oi, {nome}! Vamos agendar nossa primeira call? Me manda alguns horarios disponiveis que funcione para voce essa semana.' },
                { title: 'Lembrete da call', msg: 'Oi, {nome}! Lembrando que temos nossa call agendada. Te espero la!' },
                { title: 'Reagendar', msg: 'Oi, {nome}! Precisamos reagendar nossa call. Pode me mandar novos horarios disponiveis?' }
            ],
            fsrs_optimization: [
                { title: 'Hora de otimizar FSRS', msg: 'Oi, {nome}! Ja faz um mes desde a ultima otimizacao do FSRS. Vamos agendar uma call rapida para otimizar? Me manda um print das suas estatisticas do Anki.' },
                { title: 'Lembrete FSRS', msg: 'Oi, {nome}! Lembrete: esta na hora de otimizar o FSRS do seu Anki. Isso ajuda a melhorar a eficiencia das revisoes. Me manda suas stats!' },
                { title: 'Cobrar FSRS atrasado', msg: 'Oi, {nome}! A otimizacao do seu FSRS esta atrasada. E importante manter isso em dia para o Anki funcionar da melhor forma. Vamos resolver isso?' }
            ],
            heatmap_photo: [
                { title: 'Pedir foto heatmap', msg: 'Oi, {nome}! Pode me mandar uma foto do seu heatmap do Anki? Quero acompanhar sua consistencia e te dar um feedback!' },
                { title: 'Lembrete heatmap', msg: 'Oi, {nome}! Hora do check-in quinzenal! Me manda a foto do heatmap do Anki para eu acompanhar seu progresso.' },
                { title: 'Cobrar heatmap atrasado', msg: 'Oi, {nome}! Faz tempo que nao recebo a foto do seu heatmap. Como esta indo o Anki? Me atualiza por favor!' }
            ],
            second_call: [
                { title: 'Agendar segunda call', msg: 'Oi, {nome}! Ja faz 30 dias desde nossa ultima conversa sobre otimizacoes. Vamos agendar uma call para revisar como esta indo? Me manda seus horarios.' },
                { title: 'Lembrete segunda call', msg: 'Oi, {nome}! Lembrando que temos a call de acompanhamento agendada. Ja separa suas duvidas e stats do Anki!' },
                { title: 'Cobrar segunda call', msg: 'Oi, {nome}! Estamos atrasados na call de acompanhamento. E importante para ajustar suas otimizacoes. Vamos marcar?' }
            ]
        };

        // ===== Recurring task helpers =====
        function getBaseTaskKey(taskKey) {
            return taskKey.replace(/_\d+$/, '');
        }

        function getTaskDef(taskKey) {
            return TASK_TYPES.find(t => t.key === getBaseTaskKey(taskKey));
        }

        function getTaskRowsForStudent(studentId) {
            const st = tasksMap[studentId] || {};
            const rows = [];

            TASK_TYPES.forEach(tt => {
                rows.push({ ...tt, taskKey: tt.key, isBase: true });

                if (tt.recurring) {
                    const re = new RegExp('^' + tt.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_(\\d+)$');
                    const extras = Object.keys(st)
                        .filter(k => re.test(k))
                        .sort((a, b) => {
                            const numA = parseInt(a.match(/_(\d+)$/)[1]);
                            const numB = parseInt(b.match(/_(\d+)$/)[1]);
                            return numA - numB;
                        });
                    extras.forEach(extraKey => {
                        rows.push({ ...tt, taskKey: extraKey, isBase: false });
                    });
                }
            });

            return rows;
        }

        async function suggestDatesFromFirstCall(studentId, firstCallDate) {
            if (!firstCallDate) return;
            const baseDate = new Date(firstCallDate + 'T12:00:00');
            if (isNaN(baseDate.getTime())) return;

            const recurringTypes = TASK_TYPES.filter(t => t.recurring);
            let suggested = 0;

            for (const tt of recurringTypes) {
                const existing = tasksMap[studentId]?.[tt.key];
                if (existing?.task_date) continue; // don't overwrite

                const suggestedDate = new Date(baseDate);
                suggestedDate.setDate(suggestedDate.getDate() + tt.intervalDays);
                const dateStr = suggestedDate.toISOString().split('T')[0];

                if (existing) {
                    await WardApp.db.from('mentor_student_tasks')
                        .update({ task_date: dateStr, dismissed: false, updated_at: new Date().toISOString() })
                        .eq('id', existing.id);
                    existing.task_date = dateStr;
                    existing.dismissed = false;
                } else {
                    const newTask = {
                        mentor_id: String(guilhermeData.id), student_id: String(studentId),
                        task_type: tt.key, completed: false, task_date: dateStr, dismissed: false
                    };
                    const { data } = await WardApp.db.from('mentor_student_tasks').insert(newTask).select().single();
                    if (data) {
                        if (!tasksMap[studentId]) tasksMap[studentId] = {};
                        tasksMap[studentId][tt.key] = data;
                    }
                }
                suggested++;
            }

            if (suggested > 0) {
                WardApp.showToast(`📅 ${suggested} data(s) sugerida(s) automaticamente a partir da primeira call`, 'success');
            }
        }

        async function createNextOccurrence(studentId, completedTaskKey) {
            const taskDef = getTaskDef(completedTaskKey);
            if (!taskDef || !taskDef.recurring) return;

            const completedTask = tasksMap[studentId]?.[completedTaskKey];
            if (!completedTask?.task_date) return;

            const baseKey = getBaseTaskKey(completedTaskKey);
            const st = tasksMap[studentId] || {};
            const re = new RegExp('^' + baseKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_(\\d+)$');

            // Find highest numbered occurrence
            let maxNum = 1;
            Object.keys(st).forEach(k => {
                const m = k.match(re);
                if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
            });
            const nextKey = `${baseKey}_${maxNum + 1}`;

            // Don't create if already exists
            if (st[nextKey]) return;

            const nextDate = new Date(completedTask.task_date + 'T12:00:00');
            nextDate.setDate(nextDate.getDate() + taskDef.intervalDays);
            const dateStr = nextDate.toISOString().split('T')[0];

            const newTask = {
                mentor_id: String(guilhermeData.id), student_id: String(studentId),
                task_type: nextKey, completed: false, task_date: dateStr, dismissed: false
            };
            const { data } = await WardApp.db.from('mentor_student_tasks').insert(newTask).select().single();
            if (data) {
                if (!tasksMap[studentId]) tasksMap[studentId] = {};
                tasksMap[studentId][nextKey] = data;
            }
        }
        // ===== End recurring task helpers =====

        // Backfill: for students that already have first_call date but missing recurring dates,
        // calculate and save the suggested dates. Runs once on page load.
        async function backfillRecurringDates() {
            const recurringTypes = TASK_TYPES.filter(t => t.recurring);
            let totalBackfilled = 0;

            for (const student of allStudents) {
                const sid = String(student.id);
                const st = tasksMap[sid] || tasksMap[student.id] || {};
                // Ensure tasksMap has an entry for this student (use string key)
                if (!tasksMap[sid] && !tasksMap[student.id]) tasksMap[sid] = {};

                // First call date can come from mentor_student_tasks OR scheduled_calls
                const firstCallDate = st['first_call']?.task_date
                    || window._firstCalls?.[sid]
                    || window._firstCalls?.[student.id]
                    || null;
                if (!firstCallDate) continue;

                const baseDate = new Date(firstCallDate + 'T12:00:00');
                if (isNaN(baseDate.getTime())) continue;

                for (const tt of recurringTypes) {
                    const existing = st[tt.key];
                    if (existing?.task_date) continue; // already has a date

                    const suggestedDate = new Date(baseDate);
                    suggestedDate.setDate(suggestedDate.getDate() + tt.intervalDays);
                    const dateStr = suggestedDate.toISOString().split('T')[0];

                    if (canEdit) {
                        // Guilherme: write to DB
                        if (existing) {
                            await WardApp.db.from('mentor_student_tasks')
                                .update({ task_date: dateStr, dismissed: false, updated_at: new Date().toISOString() })
                                .eq('id', existing.id);
                            existing.task_date = dateStr;
                            existing.dismissed = false;
                        } else {
                            const newTask = {
                                mentor_id: String(guilhermeData.id), student_id: sid,
                                task_type: tt.key, completed: false, task_date: dateStr, dismissed: false
                            };
                            const { data } = await WardApp.db.from('mentor_student_tasks').insert(newTask).select().single();
                            if (data) {
                                if (!tasksMap[sid]) tasksMap[sid] = {};
                                tasksMap[sid][tt.key] = data;
                            }
                        }
                    } else {
                        // Other mentors: calculate locally for display only (no DB write)
                        const mapRef = tasksMap[sid] || tasksMap[student.id];
                        if (mapRef) {
                            if (existing) {
                                existing.task_date = dateStr;
                            } else {
                                mapRef[tt.key] = {
                                    task_type: tt.key, completed: false, task_date: dateStr,
                                    dismissed: false, _local: true
                                };
                            }
                        } else {
                            tasksMap[sid] = {};
                            tasksMap[sid][tt.key] = {
                                task_type: tt.key, completed: false, task_date: dateStr,
                                dismissed: false, _local: true
                            };
                        }
                    }
                    totalBackfilled++;
                }
            }

            if (totalBackfilled > 0) {
                console.log(`Backfilled ${totalBackfilled} recurring date(s)`);
            }
        }

        const _dn = (v) => WardApp._prs ? WardApp._prs(v) : v;

        function sortUsersByName(users) {
            return users.sort((a, b) => {
                const na = (_dn(a.full_name) || a.email || '').toLowerCase();
                const nb = (_dn(b.full_name) || b.email || '').toLowerCase();
                return na.localeCompare(nb, 'pt-BR', { sensitivity: 'base' });
            });
        }

        function markStep(id, status) {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'step ' + status;
        }

        function showError(msg, detail) {
            document.getElementById('students-container').innerHTML = `
                <div class="todo-error">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚠️</div>
                    <p style="margin: 0; font-weight: 600;">${msg}</p>
                    ${detail ? `<code>${detail}</code>` : ''}
                    <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">🔄 Tentar novamente</button>
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            userData = await WardApp.checkAuth();
            if (!userData) { window.location.href = '/'; return; }

            // Fetch Guilherme's user data (owner of this to-do list)
            const guilhermeRes = await WardApp.db
                .from('users')
                .select('id, full_name, email, role')
                .eq('role', 'mentor_guilherme')
                .limit(1)
                .maybeSingle();

            if (guilhermeRes.error || !guilhermeRes.data) {
                showError('Erro ao carregar dados do mentor Guilherme', guilhermeRes.error?.message || 'Mentor não encontrado');
                return;
            }
            guilhermeData = guilhermeRes.data;

            // Only Guilherme can edit, others can only view
            canEdit = userData.role === 'mentor_guilherme';

            // Show read-only banner for non-Guilherme users
            if (!canEdit) {
                document.getElementById('readonly-banner').style.display = 'block';
            }

            await loadData();
        });

        async function loadData() {
            try {
                // 1. Load students
                markStep('step-students', 'active');
                const studentsRes = await WardApp.db
                    .from('users')
                    .select('id, full_name, email, role, created_at')
                    .eq('role', 'aluno');

                if (studentsRes.error) {
                    showError('Erro ao carregar alunos', studentsRes.error.message);
                    return;
                }
                allStudents = sortUsersByName(studentsRes.data || []);
                markStep('step-students', 'done');

                // 2. Load tasks (may fail if table doesn't exist yet)
                // Always load Guilherme's tasks, regardless of who is logged in
                markStep('step-tasks', 'active');
                const tasksRes = await WardApp.db
                    .from('mentor_student_tasks')
                    .select('*')
                    .eq('mentor_id', String(guilhermeData.id));

                tasksMap = {};
                if (!tasksRes.error && tasksRes.data) {
                    tasksRes.data.forEach(t => {
                        if (!tasksMap[t.student_id]) tasksMap[t.student_id] = {};
                        tasksMap[t.student_id][t.task_type] = t;
                    });
                } else {
                    console.warn('Tasks table may not exist yet:', tasksRes.error?.message);
                }
                markStep('step-tasks', 'done');

                // 3. Load Anki data (latest per student only)
                markStep('step-anki', 'active');
                const checkinsRes = await WardApp.db
                    .from('daily_checkins')
                    .select('user_id, anki_cards_today, anki_avg_cards, anki_current_streak, date')
                    .order('date', { ascending: false })
                    .limit(1000);

                ankiDataMap = {};
                if (!checkinsRes.error && checkinsRes.data) {
                    checkinsRes.data.forEach(c => {
                        if (!ankiDataMap[c.user_id] && (c.anki_cards_today > 0 || c.anki_avg_cards > 0)) {
                            ankiDataMap[c.user_id] = c;
                        }
                    });
                }
                markStep('step-anki', 'done');

                // 4. Load first calls - Guilherme's scheduled calls
                markStep('step-calls', 'active');
                const callsRes = await WardApp.db
                    .from('scheduled_calls')
                    .select('student_id, scheduled_date, scheduled_time')
                    .eq('mentor_id', String(guilhermeData.id))
                    .order('scheduled_date', { ascending: true });

                window._firstCalls = {};
                if (!callsRes.error && callsRes.data) {
                    callsRes.data.forEach(c => {
                        if (!window._firstCalls[c.student_id]) {
                            window._firstCalls[c.student_id] = c.scheduled_date;
                        }
                    });
                }
                markStep('step-calls', 'done');

                // 5. Backfill recurring dates for students with first_call but missing dates
                await backfillRecurringDates();

                // Debug: log state before rendering
                console.log('[TodoList] Data loaded. Students:', allStudents.length);
                console.log('[TodoList] TasksMap sample:', Object.keys(tasksMap).slice(0, 5).map(k => ({ key: k, tasks: Object.keys(tasksMap[k]) })));
                console.log('[TodoList] FirstCalls:', Object.keys(window._firstCalls || {}).length, 'entries');
                console.log('[TodoList] canEdit:', canEdit, 'guilhermeData.id:', guilhermeData?.id);

                renderAll();
            } catch (err) {
                console.error('loadData error:', err);
                showError('Erro inesperado ao carregar dados', err.message);
            }
        }

        function getFilteredStudents() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const status = document.getElementById('status-filter').value;
            return allStudents.filter(s => {
                const name = (_dn(s.full_name) || s.email || '').toLowerCase();
                if (search && !name.includes(search) && !(s.email || '').toLowerCase().includes(search)) return false;
                if (status !== 'all') {
                    const st = tasksMap[s.id] || {};
                    const allDone = TASK_TYPES.every(t => st[t.key]?.completed);
                    if (status === 'completed' && !allDone) return false;
                    if (status === 'pending' && allDone) return false;
                }
                return true;
            });
        }

        function renderAll() {
            renderAlerts();
            renderStudents();
        }

        function renderAlerts() {
            const now = new Date();
            const oneWeek = new Date(now.getTime() + 7 * 86400000);
            const overdue = [], upcoming = [], noFirstCall = [];

            console.log('[Alerts] Starting renderAlerts, students:', allStudents.length, 'tasksMap keys:', Object.keys(tasksMap));

            allStudents.forEach(student => {
                const sid = String(student.id);
                const st = tasksMap[sid] || tasksMap[student.id] || {};
                const name = _dn(student.full_name) || student.email || 'Sem nome';

                // Check if student has first_call date (from tasks or scheduled_calls)
                const hasFirstCall = st['first_call']?.task_date
                    || window._firstCalls?.[sid]
                    || window._firstCalls?.[student.id];

                if (!hasFirstCall) {
                    // Student without first call scheduled = needs attention
                    const hasEntryDate = st['entry_date']?.task_date || student.created_at;
                    if (hasEntryDate) noFirstCall.push({ student, name });
                    return;
                }

                TASK_TYPES.forEach(tt => {
                    if (!tt.recurring) return;

                    // Find all occurrences (base + numbered) for this task type
                    const re = new RegExp('^' + tt.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_(\\d+)$');
                    const allKeys = [tt.key, ...Object.keys(st).filter(k => re.test(k))];

                    // Find the latest uncompleted occurrence with a date
                    let latestUncompleted = null;
                    let latestKey = null;
                    for (const k of allKeys) {
                        const task = st[k];
                        if (task && !task.completed && !task.dismissed && task.task_date) {
                            if (!latestUncompleted || task.task_date > latestUncompleted.task_date) {
                                latestUncompleted = task;
                                latestKey = k;
                            }
                        }
                    }

                    if (!latestUncompleted) return;
                    const dueDate = new Date(latestUncompleted.task_date + 'T12:00:00');
                    if (dueDate < now) overdue.push({ student, name, task: tt, nextDue: dueDate, alertTaskKey: latestKey });
                    else if (dueDate <= oneWeek) upcoming.push({ student, name, task: tt, nextDue: dueDate, alertTaskKey: latestKey });
                });
            });

            console.log('[Alerts] Results — overdue:', overdue.length, 'upcoming:', upcoming.length, 'noFirstCall:', noFirstCall.length);

            const section = document.getElementById('alerts-section');

            // Always show the section with a summary, even if no alerts
            if (overdue.length === 0 && upcoming.length === 0 && noFirstCall.length === 0) {
                section.innerHTML = `<div style="background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; text-align: center;">
                    <span style="font-size: 1.1rem; font-weight: 700; color: #16a34a;">✅ Tudo em dia!</span>
                    <span style="color: #64748b; font-size: 0.85rem; margin-left: 0.5rem;">Nenhuma tarefa atrasada ou pendente esta semana.</span>
                </div>`;
                return;
            }

            let html = '';

            // Summary bar
            const totalUrgent = overdue.length + upcoming.length;
            html += `<div style="background: ${overdue.length > 0 ? '#fef2f2' : '#fffbeb'}; border: 2px solid ${overdue.length > 0 ? '#fca5a5' : '#fde68a'}; border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                <div style="font-size: 1.05rem; font-weight: 700; color: ${overdue.length > 0 ? '#dc2626' : '#d97706'};">
                    ${overdue.length > 0 ? '🚨' : '⏰'} ${totalUrgent} tarefa${totalUrgent > 1 ? 's' : ''} pendente${totalUrgent > 1 ? 's' : ''}
                    ${overdue.length > 0 ? `<span style="background: #dc2626; color: white; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.8rem; margin-left: 0.4rem;">${overdue.length} atrasada${overdue.length > 1 ? 's' : ''}</span>` : ''}
                    ${upcoming.length > 0 ? `<span style="background: #d97706; color: white; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.8rem; margin-left: 0.4rem;">${upcoming.length} esta semana</span>` : ''}
                </div>
                ${noFirstCall.length > 0 ? `<div style="font-size: 0.82rem; color: #64748b;">${noFirstCall.length} aluno${noFirstCall.length > 1 ? 's' : ''} sem 1ª call</div>` : ''}
            </div>`;

            if (overdue.length > 0) {
                html += `<div class="alert-card" style="border-color: #fca5a5; border-width: 2px;">
                    <div class="alert-header" style="background: #fef2f2; color: #dc2626; font-size: 0.95rem;">🚨 ATRASADOS (${overdue.length})</div>
                    <div class="alert-body">${overdue.sort((a,b) => a.nextDue - b.nextDue).map(item => `
                        <div class="alert-item">
                            <div><strong style="color: #dc2626;">${item.name}</strong> <span style="color: #64748b;">- ${item.task.label}</span>
                            <span style="color: #ef4444; font-weight: 600;"> (${Math.ceil((now - item.nextDue) / 86400000)}d atrasado)</span></div>
                            <button class="btn btn-xs btn-outline" onclick="dismissAlert('${item.student.id}','${item.alertTaskKey}')" title="Dispensar">✕</button>
                        </div>`).join('')}</div></div>`;
            }
            if (upcoming.length > 0) {
                html += `<div class="alert-card" style="border-color: #fde68a;">
                    <div class="alert-header" style="background: #fffbeb; color: #d97706;">⏰ Próximos 7 dias (${upcoming.length})</div>
                    <div class="alert-body">${upcoming.sort((a,b) => a.nextDue - b.nextDue).map(item => `
                        <div class="alert-item">
                            <div><strong>${item.name}</strong> <span style="color: #64748b;">- ${item.task.label}</span>
                            <span style="color: #d97706; font-weight: 600;"> (em ${Math.ceil((item.nextDue - now) / 86400000)}d)</span></div>
                            <button class="btn btn-xs btn-outline" onclick="dismissAlert('${item.student.id}','${item.alertTaskKey}')" title="Dispensar">✕</button>
                        </div>`).join('')}</div></div>`;
            }
            section.innerHTML = html;
        }

        async function dismissAlert(studentId, taskType) {
            if (!canEdit) { WardApp.showToast('Apenas o Guilherme pode editar estas tarefas', 'warning'); return; }
            const existing = tasksMap[studentId]?.[taskType];
            if (existing) {
                await WardApp.db.from('mentor_student_tasks').update({ dismissed: true }).eq('id', existing.id);
                existing.dismissed = true;
            } else {
                const { data } = await WardApp.db.from('mentor_student_tasks')
                    .insert({ mentor_id: String(guilhermeData.id), student_id: String(studentId), task_type: taskType, dismissed: true })
                    .select().single();
                if (data) { if (!tasksMap[studentId]) tasksMap[studentId] = {}; tasksMap[studentId][taskType] = data; }
            }
            renderAlerts();
        }

        function renderStudents() {
            const container = document.getElementById('students-container');
            const filtered = getFilteredStudents();

            // Save which students are currently expanded before re-rendering
            const expandedStudents = new Set();
            document.querySelectorAll('.student-body.open').forEach(el => {
                const id = el.id.replace('body-', '');
                if (id) expandedStudents.add(id);
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 3rem; color: #94a3b8;"><div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div><p>Nenhum aluno encontrado</p></div>';
                return;
            }

            container.innerHTML = `<div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.5rem; padding-left: 0.25rem;">${filtered.length} aluno${filtered.length > 1 ? 's' : ''}</div>` +
            filtered.map(student => {
                const name = _dn(student.full_name) || student.email || 'Sem nome';
                const st = tasksMap[student.id] || {};
                const anki = ankiDataMap[student.id];
                const firstCallDate = window._firstCalls?.[student.id] || null;
                const pauseTask = st['anki_paused'] || {};
                const isPaused = pauseTask.completed;

                let ankiHtml = '';
                if (isPaused) ankiHtml = '<span class="anki-badge" style="color: #ef4444; font-weight: 700;">⏸️ PAUSADO</span>';
                else if (anki) ankiHtml = `<span class="anki-badge">🃏 ${anki.anki_cards_today||0} hoje · ${anki.anki_avg_cards||0} avg · ${anki.anki_current_streak||0}🔥</span>`;
                else ankiHtml = '<span class="anki-badge">Sem dados</span>';

                const done = TASK_TYPES.filter(t => st[t.key]?.completed).length;
                const pct = Math.round((done / TASK_TYPES.length) * 100);
                const pColor = pct === 100 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444';

                // Pause HTML
                let pauseHtml = '';
                if (isPaused) {
                    pauseHtml = `<div class="pause-banner">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                            <strong style="color: #dc2626; font-size: 0.9rem;">⏸️ Anki Pausado</strong>
                            <button onclick="unpauseAnki('${student.id}')" style="background: #22c55e; color: white; border: none; border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.8rem; font-weight: 600;">▶️ Despausar</button>
                        </div>
                        <div style="font-size: 0.82rem; color: #64748b;"><strong>Motivo:</strong> ${pauseTask.notes || '<em>Não informado</em>'}</div>
                        ${pauseTask.task_date ? `<div style="font-size: 0.82rem; color: #64748b;"><strong>Retorno:</strong> ${new Date(pauseTask.task_date + 'T12:00:00').toLocaleDateString('pt-BR')}</div>` : ''}
                    </div>`;
                } else {
                    pauseHtml = `<div class="pause-form-area">
                        <button onclick="showPauseForm('${student.id}')" style="background: #f59e0b; color: white; border: none; border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.82rem; font-weight: 600;">⏸️ Pausar Anki</button>
                        <div id="pause-form-${student.id}" style="display: none; margin-top: 0.6rem;">
                            <div style="margin-bottom: 0.4rem;">
                                <label style="font-size: 0.82rem; font-weight: 600;">Motivo:</label>
                                <select id="pause-reason-${student.id}" style="width: 100%; padding: 0.35rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.82rem; margin-top: 0.2rem;">
                                    <option value="">Selecione...</option>
                                    <option value="Não quer usar Anki">Não quer usar Anki</option>
                                    <option value="Não se adaptou">Não se adaptou</option>
                                    <option value="Pausou os estudos">Pausou os estudos</option>
                                    <option value="Terminou o processo">Terminou o processo</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                            <div id="pause-other-${student.id}" style="display: none; margin-bottom: 0.4rem;">
                                <input type="text" id="pause-other-text-${student.id}" placeholder="Descreva o motivo..." style="width: 100%; padding: 0.35rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.82rem;">
                            </div>
                            <div style="margin-bottom: 0.4rem;">
                                <label style="font-size: 0.82rem; font-weight: 600;">Retorno previsto (opcional):</label>
                                <input type="date" id="pause-return-${student.id}" style="padding: 0.35rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.82rem; margin-top: 0.2rem;">
                            </div>
                            <button onclick="confirmPause('${student.id}')" style="background: #ef4444; color: white; border: none; border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.82rem; font-weight: 600;">Confirmar Pausa</button>
                        </div>
                    </div>`;
                }

                return `
                <div class="student-card ${isPaused ? 'paused' : ''}" id="student-${student.id}">
                    <div class="student-header" onclick="toggleStudent('${student.id}')">
                        <span class="student-name">${name}</span>
                        <div class="student-meta">
                            ${ankiHtml}
                            <div style="display: flex; align-items: center; gap: 0.4rem;">
                                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%; background:${pColor};"></div></div>
                                <span class="progress-label" style="color:${pColor};">${done}/${TASK_TYPES.length}</span>
                            </div>
                            <span class="expand-arrow" id="icon-${student.id}">▼</span>
                        </div>
                    </div>
                    <div class="student-body" id="body-${student.id}">
                        ${pauseHtml}
                        <table class="task-table" ${isPaused ? 'style="opacity:0.4; pointer-events:none;"' : ''}>
                            <thead><tr>
                                <th style="text-align:left;">Tarefa</th>
                                <th style="width:40px;">✓</th>
                                <th style="width:140px;">Data</th>
                                <th style="width:100px;">Status</th>
                                <th style="width:40px;">Msg</th>
                            </tr></thead>
                            <tbody>${getTaskRowsForStudent(student.id).map(row => {
                                const task = st[row.taskKey] || {};
                                const checked = task.completed ? 'checked' : '';
                                let dateVal = task.task_date || '';
                                if (!dateVal && row.isBase) {
                                    if (row.key === 'entry_date' && student.created_at) dateVal = student.created_at.split('T')[0];
                                    else if (row.key === 'first_call' && firstCallDate) dateVal = firstCallDate;
                                }
                                let statusHtml = '';
                                if (task.completed) {
                                    statusHtml = '<span style="color:#22c55e;">✅</span>';
                                } else if (row.recurring && task.task_date) {
                                    const due = new Date(task.task_date + 'T12:00:00');
                                    const diff = Math.ceil((due - new Date()) / 86400000);
                                    if (diff < 0) statusHtml = `<span style="color:#ef4444;font-weight:600;">🔴 ${Math.abs(diff)}d atraso</span>`;
                                    else if (diff <= 7) statusHtml = `<span style="color:#f59e0b;font-weight:600;">🟡 ${diff}d</span>`;
                                    else statusHtml = `<span style="color:#22c55e;">🟢 ${diff}d</span>`;
                                } else {
                                    statusHtml = '<span style="color:#94a3b8;">⏳</span>';
                                }
                                const rowStyle = !row.isBase ? ' style="background:#f0fdf4; border-left: 3px solid #22c55e;"' : '';
                                const labelPrefix = !row.isBase ? '↳ ' : '';
                                return `<tr${rowStyle}>
                                    <td>${labelPrefix}${row.label}</td>
                                    <td><input type="checkbox" ${checked} onchange="updateTask('${student.id}','${row.taskKey}','completed',this.checked)"></td>
                                    <td><input type="date" value="${dateVal}" onchange="updateTask('${student.id}','${row.taskKey}','task_date',this.value)"></td>
                                    <td>${statusHtml}</td>
                                    <td><button class="msg-btn" onclick="event.stopPropagation();openMsgModal('${student.id}','${row.taskKey}')" title="WhatsApp">💬</button></td>

                            }).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            }).join('');

            // Restore expanded state for students that were open before
            expandedStudents.forEach(id => {
                const body = document.getElementById('body-' + id);
                const icon = document.getElementById('icon-' + id);
                if (body) body.classList.add('open');
                if (icon) icon.classList.add('open');
            });
        }

        function toggleStudent(id) {
            const body = document.getElementById('body-' + id);
            const icon = document.getElementById('icon-' + id);
            body.classList.toggle('open');
            icon.classList.toggle('open');
        }

        async function updateTask(studentId, taskType, field, value) {
            if (!canEdit) { WardApp.showToast('Apenas o Guilherme pode editar estas tarefas', 'warning'); renderAll(); return; }
            const existing = tasksMap[studentId]?.[taskType];
            if (existing) {
                const upd = { [field]: value, updated_at: new Date().toISOString() };
                if (field === 'task_date') upd.dismissed = false;
                await WardApp.db.from('mentor_student_tasks').update(upd).eq('id', existing.id);
                Object.assign(existing, upd);
            } else {
                const newTask = {
                    mentor_id: String(guilhermeData.id), student_id: String(studentId), task_type: taskType,
                    completed: field === 'completed' ? value : false,
                    task_date: field === 'task_date' ? value : null, dismissed: false
                };
                const { data } = await WardApp.db.from('mentor_student_tasks').insert(newTask).select().single();
                if (data) { if (!tasksMap[studentId]) tasksMap[studentId] = {}; tasksMap[studentId][taskType] = data; }
            }

            // Auto-suggest dates when first call date is set
            if (taskType === 'first_call' && field === 'task_date' && value) {
                await suggestDatesFromFirstCall(studentId, value);
            }

            // Create next occurrence when recurring task is completed
            if (field === 'completed' && value === true) {
                const taskDef = getTaskDef(taskType);
                if (taskDef?.recurring) {
                    await createNextOccurrence(studentId, taskType);
                }
            }

            renderAll();
        }

        function showPauseForm(studentId) {
            const form = document.getElementById('pause-form-' + studentId);
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            const select = document.getElementById('pause-reason-' + studentId);
            select.onchange = function() {
                document.getElementById('pause-other-' + studentId).style.display = this.value === 'Outro' ? 'block' : 'none';
            };
        }

        async function confirmPause(studentId) {
            if (!canEdit) { WardApp.showToast('Apenas o Guilherme pode editar estas tarefas', 'warning'); return; }
            const select = document.getElementById('pause-reason-' + studentId);
            let reason = select.value;
            if (!reason) { WardApp.showToast('Selecione o motivo da pausa', 'warning'); return; }
            if (reason === 'Outro') {
                reason = document.getElementById('pause-other-text-' + studentId).value.trim();
                if (!reason) { WardApp.showToast('Descreva o motivo', 'warning'); return; }
            }
            const returnDate = document.getElementById('pause-return-' + studentId).value || null;
            const existing = tasksMap[studentId]?.['anki_paused'];
            if (existing) {
                await WardApp.db.from('mentor_student_tasks')
                    .update({ completed: true, notes: reason, task_date: returnDate, updated_at: new Date().toISOString() })
                    .eq('id', existing.id);
                Object.assign(existing, { completed: true, notes: reason, task_date: returnDate });
            } else {
                const { data } = await WardApp.db.from('mentor_student_tasks')
                    .insert({ mentor_id: String(guilhermeData.id), student_id: String(studentId), task_type: 'anki_paused', completed: true, notes: reason, task_date: returnDate })
                    .select().single();
                if (data) { if (!tasksMap[studentId]) tasksMap[studentId] = {}; tasksMap[studentId]['anki_paused'] = data; }
            }
            WardApp.showToast('Anki pausado para este aluno');
            renderAll();
        }

        async function unpauseAnki(studentId) {
            if (!canEdit) { WardApp.showToast('Apenas o Guilherme pode editar estas tarefas', 'warning'); return; }
            const existing = tasksMap[studentId]?.['anki_paused'];
            if (existing) {
                await WardApp.db.from('mentor_student_tasks')
                    .update({ completed: false, task_date: new Date().toISOString().split('T')[0], notes: (existing.notes || '') + ' | Retornou em ' + new Date().toLocaleDateString('pt-BR'), updated_at: new Date().toISOString() })
                    .eq('id', existing.id);
                existing.completed = false;
                existing.task_date = new Date().toISOString().split('T')[0];
            }
            WardApp.showToast('Anki despausado!');
            renderAll();
        }

        function openMsgModal(studentId, taskKey) {
            const student = allStudents.find(s => String(s.id) === String(studentId));
            if (!student) return;
            const name = _dn(student.full_name) || student.email || 'Aluno';
            const firstName = name.split(' ')[0];
            const baseKey = getBaseTaskKey(taskKey);
            const templates = MSG_TEMPLATES[baseKey] || MSG_TEMPLATES[taskKey] || [];
            const taskLabel = TASK_TYPES.find(t => t.key === baseKey)?.label || taskKey;

            document.getElementById('msg-modal-title').textContent = '💬 ' + taskLabel;
            document.getElementById('msg-modal-body').innerHTML = templates.length === 0
                ? '<p style="color:#64748b;">Nenhum template disponivel.</p>'
                : templates.map((tpl, i) => {
                    const msg = tpl.msg.replace(/\{nome\}/g, firstName);
                    return `<div class="msg-template">
                        <div class="msg-template-header">
                            <strong style="font-size:0.88rem;">${tpl.title}</strong>
                            <button class="copy-btn" onclick="copyMsg(this,${i})">📋 Copiar</button>
                        </div>
                        <p id="msg-text-${i}" style="margin:0; font-size:0.83rem; color:#475569; line-height:1.5; white-space:pre-wrap;">${msg}</p>
                    </div>`;
                }).join('');

            document.getElementById('msg-modal').classList.add('active');
        }

        function closeMsgModal() { document.getElementById('msg-modal').classList.remove('active'); }

        function copyMsg(btn, idx) {
            const text = document.getElementById('msg-text-' + idx).textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ Copiado!'; btn.style.background = '#64748b';
                setTimeout(() => { btn.textContent = '📋 Copiar'; btn.style.background = '#22c55e'; }, 2000);
            });
        }

    </script>
</body>
</html>
