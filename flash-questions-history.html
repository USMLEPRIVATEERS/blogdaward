<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Testes - Flash Questions - Ward Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .flash-history {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .flash-header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .flash-header-content h1 {
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .flash-header-content p {
            font-size: 1.1rem;
            color: #666;
        }

        .flash-header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-header {
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-header-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-header-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.4);
        }

        .btn-header-secondary {
            background: white;
            color: #d97706;
            border: 2px solid #d97706;
        }

        .btn-header-secondary:hover {
            background: #fff7ed;
            transform: translateY(-2px);
        }

        .filters-bar {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .filter-group label {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 0.95rem;
        }

        .filter-group select {
            padding: 0.65rem 1.25rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            background: white;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-group select:hover {
            border-color: #d97706;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .test-item {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .test-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d97706, #f59e0b);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .test-item:hover {
            border-color: #d97706;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.15);
            transform: translateY(-4px);
        }

        .test-item:hover::before {
            transform: scaleX(1);
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .test-info h3 {
            font-size: 1.3rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .test-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .test-status {
            display: inline-flex;
            align-items: center;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            gap: 0.3rem;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-paused {
            background: #fef3c7;
            color: #92400e;
        }

        .status-in-progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .test-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .test-stat {
            text-align: center;
            padding: 0.8rem;
            background: #f9fafb;
            border-radius: 8px;
        }

        .test-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d97706;
        }

        .test-stat-label {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.3rem;
        }

        .test-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-action {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #d97706;
            border: 2px solid #d97706;
        }

        .btn-secondary:hover {
            background: #fff7ed;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border: 2px dashed #e5e7eb;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 2rem;
        }

        .test-filters {
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .filter-tag {
            display: inline-block;
            background: #f3f4f6;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-right: 0.5rem;
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>

            <button class="mobile-menu-toggle">☰</button>

            <nav class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/flash-questions-dashboard" class="nav-link active">Flash Questions</a>
                <a href="/cronograma" class="nav-link">Cronograma</a>
                <a href="/landmarks" class="nav-link">Chamadas</a>
                <a href="/blog" class="nav-link">Curso</a>
            </nav>

            <div class="nav-user">
                <a href="/profile" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name" id="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <div class="flash-history">
        <div class="flash-header">
            <div class="flash-header-content">
                <h1>📊 Histórico de Testes</h1>
                <p>Revise seus testes anteriores e acompanhe seu progresso</p>
            </div>
            <div class="flash-header-actions">
                <a href="/flash-questions-dashboard" class="btn-header btn-header-secondary">
                    ← Dashboard
                </a>
                <a href="/flash-questions-create" class="btn-header btn-header-primary">
                    🚀 Novo Teste
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <div class="filter-group">
                <label for="filter-status">Status:</label>
                <select id="filter-status" onchange="filterTests()">
                    <option value="all">Todos</option>
                    <option value="completed">Completos</option>
                    <option value="in_progress">Em Progresso</option>
                    <option value="paused">Pausados</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-sort">Ordenar por:</label>
                <select id="filter-sort" onchange="filterTests()">
                    <option value="recent">Mais Recentes</option>
                    <option value="oldest">Mais Antigos</option>
                    <option value="best">Melhor Desempenho</option>
                    <option value="worst">Pior Desempenho</option>
                </select>
            </div>
        </div>

        <!-- Test List -->
        <div class="test-list" id="test-list">
            <!-- Tests will be loaded here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/flash-questions-history.js"></script>
</body>
</html>
