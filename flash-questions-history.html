<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Testes - Flash Questions - Ward Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .flash-history {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .flash-header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .flash-header-content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.015em;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .flash-header-content p {
            font-size: 1.1rem;
            color: #6b7280;
        }

        .flash-header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-header {
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-header:focus-visible {
            outline: 2px solid #C45700;
            outline-offset: 2px;
        }

        .btn-header-primary {
            background: linear-gradient(180deg, #d46312 0%, #C45700 100%);
            color: white;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 1px 2px rgba(163, 73, 0, 0.25);
        }

        .btn-header-primary:hover {
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 12px rgba(196, 87, 0, 0.32);
            color: white;
        }

        .btn-header-primary:active {
            transform: translateY(1px);
        }

        .btn-header-secondary {
            background: white;
            color: #C45700;
            border: 2px solid #C45700;
        }

        .btn-header-secondary:hover {
            background: #fdf3ec;
            transform: translateY(-1px);
        }

        .btn-header-secondary:active {
            transform: translateY(1px);
        }

        .filters-bar {
            background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 1.5rem 1.75rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .filter-group label {
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6b7280;
        }

        .filter-group select {
            padding: 0.6rem 1.1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            background: white;
            color: #111827;
            font-weight: 500;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .filter-group select:hover {
            border-color: #9ca3af;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #C45700;
            box-shadow: 0 0 0 4px rgba(196, 87, 0, 0.16);
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .test-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
            position: relative;
            overflow: hidden;
        }

        .test-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e66a00, #C45700);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        .test-item:hover {
            border-color: rgba(196, 87, 0, 0.55);
            box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 10px 24px -8px rgba(196, 87, 0, 0.18);
            transform: translateY(-2px);
        }

        .test-item:hover::before {
            transform: scaleX(1);
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .test-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .test-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .test-status {
            display: inline-flex;
            align-items: center;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            gap: 0.3rem;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-paused {
            background: #fef3c7;
            color: #92400e;
        }

        .status-in-progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .test-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .test-stat {
            text-align: center;
            padding: 0.85rem;
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 10px;
        }

        .test-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #C45700;
        }

        .test-stat-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6b7280;
            margin-top: 0.3rem;
        }

        .test-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn-action {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-action:focus-visible {
            outline: 2px solid #C45700;
            outline-offset: 2px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #d46312 0%, #C45700 100%);
            color: white;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 1px 2px rgba(163, 73, 0, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 12px rgba(196, 87, 0, 0.32);
            color: white;
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: white;
            color: #C45700;
            border: 2px solid #C45700;
        }

        .btn-secondary:hover {
            background: #fdf3ec;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border: 2px dashed #e5e7eb;
            border-radius: 14px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .test-filters {
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .filter-tag {
            display: inline-block;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #4b5563;
            font-weight: 500;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            margin-right: 0.5rem;
            margin-bottom: 0.3rem;
        }

        @media (max-width: 768px) {
            .flash-history {
                padding: 1.25rem;
            }

            .flash-header {
                margin-bottom: 2rem;
            }

            .flash-header-content h1 {
                font-size: 2rem;
            }

            .test-item {
                padding: 1.5rem;
            }
        }

        @media (max-width: 560px) {
            .flash-header-content h1 {
                font-size: 1.7rem;
            }

            .flash-header-actions {
                width: 100%;
            }

            .btn-header {
                flex: 1;
                justify-content: center;
            }

            .btn-action {
                flex: 1;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="javascript:void(0)" onclick="WardApp.goToDashboard()" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <span class="logo-icon">🎓</span>
                <span>WARD ACADEMY</span>
            </a>

            <button class="mobile-menu-toggle">☰</button>

            <nav class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/flash-questions-dashboard" class="nav-link active">Flash Questions</a>
                <a href="/cronograma" class="nav-link">Cronograma</a>
                <a href="/landmarks" class="nav-link">Chamadas</a>
                <a href="/blog" class="nav-link">Curso</a>
            </nav>

            <div class="nav-user">
                <a href="/profile" class="user-menu-btn">
                    <span>👤</span>
                    <span class="user-name" id="user-name">Perfil</span>
                </a>
                <button class="btn-logout" onclick="WardApp.logout()">🚪 Sair</button>
            </div>
        </div>
    </header>

    <div class="flash-history">
        <div class="flash-header">
            <div class="flash-header-content">
                <h1>📊 Histórico de Testes</h1>
                <p>Revise seus testes anteriores e acompanhe seu progresso</p>
            </div>
            <div class="flash-header-actions">
                <a href="/flash-questions-dashboard" class="btn-header btn-header-secondary">
                    ← Dashboard
                </a>
                <a href="/flash-questions-create" class="btn-header btn-header-primary">
                    🚀 Novo Teste
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <div class="filter-group">
                <label for="filter-status">Status:</label>
                <select id="filter-status" onchange="filterTests()">
                    <option value="all">Todos</option>
                    <option value="completed">Completos</option>
                    <option value="in_progress">Em Progresso</option>
                    <option value="paused">Pausados</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-sort">Ordenar por:</label>
                <select id="filter-sort" onchange="filterTests()">
                    <option value="recent">Mais Recentes</option>
                    <option value="oldest">Mais Antigos</option>
                    <option value="best">Melhor Desempenho</option>
                    <option value="worst">Pior Desempenho</option>
                </select>
            </div>
        </div>

        <!-- Test List -->
        <div class="test-list" id="test-list">
            <!-- Tests will be loaded here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/flash-questions-history.js"></script>
</body>
</html>
