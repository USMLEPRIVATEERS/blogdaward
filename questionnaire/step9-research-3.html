<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Colaboracao em Pesquisa</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Colaboracao em Pesquisa</span>
                <span class="progress-text">9/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 81%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Colaboracao em Pesquisa</h1>
            <p class="questionnaire-step">Etapa 9 de 11</p>
        </div>

        <!-- Form -->
        <form id="step9-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">🔬 Pesquisas na Ward Academy</h3>

                <div class="form-group">
                    <label class="form-label">
                        Pretende realizar pesquisas na Ward Academy? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="research_immediately" name="wants_research_ward" value="immediately" required>
                        <label class="form-check-label" for="research_immediately">Sim, imediatamente</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="research_after" name="wants_research_ward" value="after_usmle">
                        <label class="form-check-label" for="research_after">Sim, mas depois do USMLE</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="research_no" name="wants_research_ward" value="no">
                        <label class="form-check-label" for="research_no">Nao, ja tenho pesquisas suficientes</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="collaborate_stages">
                        Voce poderia colaborar em quais etapas de uma revisao sistematica dos outros membros?
                    </label>
                    <textarea id="collaborate_stages" class="form-textarea" rows="4"
                        placeholder="Ex: Triagem por titulo e resumo, extracao de dados, escrita cientifica..."></textarea>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">🤝 Networking</h3>

                <div class="form-group">
                    <label class="form-label">Voce possui contatos para networking em pesquisa?</label>
                    <div class="form-check">
                        <input type="radio" id="contacts_yes" name="has_networking_contacts" value="true">
                        <label class="form-check-label" for="contacts_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="contacts_no" name="has_networking_contacts" value="false">
                        <label class="form-check-label" for="contacts_no">Nao</label>
                    </div>
                </div>

                <div id="contacts-section" class="conditional-field">
                    <div id="contacts-list">
                        <div class="card mb-2 contact-card">
                            <div class="card-body">
                                <h4 class="mb-2">Contato 1</h4>
                                <div class="form-group">
                                    <label class="form-label">Nome</label>
                                    <input type="text" class="form-input contact-name" placeholder="Nome do contato">
                                </div>
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label">Especialidade</label>
                                        <input type="text" class="form-input contact-specialty">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Instituicao</label>
                                        <input type="text" class="form-input contact-institution">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-outline btn-sm" onclick="addContact()">
                        + Adicionar outro contato
                    </button>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('step8-research-2.html')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        let contactCount = 1;

        // Load existing data
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(9);
            if (data) {
                if (data.wants_research_ward) {
                    document.querySelector(`input[name="wants_research_ward"][value="${data.wants_research_ward}"]`).checked = true;
                }
                document.getElementById('collaborate_stages').value = data.can_collaborate_stages || '';

                if (data.has_networking_contacts !== null) {
                    document.querySelector(`input[name="has_networking_contacts"][value="${data.has_networking_contacts}"]`).checked = true;
                    if (data.has_networking_contacts === true || data.has_networking_contacts === 'true') {
                        document.getElementById('contacts-section').classList.add('visible');
                    }
                }
            }
        });

        // Conditional: has contacts
        document.querySelectorAll('input[name="has_networking_contacts"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('contacts-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                }
            });
        });

        function addContact() {
            contactCount++;
            const contactHtml = `
                <div class="card mb-2 contact-card">
                    <div class="card-body">
                        <h4 class="mb-2">Contato ${contactCount}</h4>
                        <div class="form-group">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-input contact-name" placeholder="Nome do contato">
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Especialidade</label>
                                <input type="text" class="form-input contact-specialty">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Instituicao</label>
                                <input type="text" class="form-input contact-institution">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('contacts-list').insertAdjacentHTML('beforeend', contactHtml);
        }

        function getContacts() {
            const contacts = [];
            document.querySelectorAll('.contact-card').forEach(card => {
                const name = card.querySelector('.contact-name').value.trim();
                const specialty = card.querySelector('.contact-specialty').value.trim();
                const institution = card.querySelector('.contact-institution').value.trim();

                if (name) {
                    contacts.push({ name, specialty, institution });
                }
            });
            return contacts;
        }

        function getFormData() {
            return {
                wants_research_ward: document.querySelector('input[name="wants_research_ward"]:checked')?.value,
                can_collaborate_stages: document.getElementById('collaborate_stages').value,
                has_networking_contacts: document.querySelector('input[name="has_networking_contacts"]:checked')?.value === 'true',
                networking_contacts: JSON.stringify(getContacts())
            };
        }

        // Form submission
        document.getElementById('step9-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(9, getFormData());
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('step10-observerships.html');
            }
        });

        async function continueLater() {
            await WardApp.saveQuestionnaireProgress(9, getFormData());
            // Redirect to correct dashboard based on role
            let userData = JSON.parse(localStorage.getItem('userData') || 'null');

            // If no userData, try to get from checkAuth
            if (!userData || !userData.role) {
                const userId = localStorage.getItem('userId');
                if (userId) {
                    // Fetch from database
                    const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                    if (data) userData = data;
                }
            }

            const dashboardUrl = (userData?.role === 'assessoria') ? '../dashboard-assessoria-avulsa.html' : '../dashboard.html';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }
    </script>
</body>
</html>
