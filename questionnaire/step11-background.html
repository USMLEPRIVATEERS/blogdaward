<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Sua História</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Sua História</span>
                <span class="progress-text">11/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 100%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Sua História</h1>
            <p class="questionnaire-step">Etapa 11 de 11 - Última etapa!</p>
        </div>

        <!-- Form -->
        <form id="step11-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">🌍 Onde Você Mora</h3>

                <div class="form-group">
                    <label class="form-label">
                        Onde você mora atualmente? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="location_brazil" name="current_location" value="brazil" required>
                        <label class="form-check-label" for="location_brazil">Brasil</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="location_usa" name="current_location" value="usa">
                        <label class="form-check-label" for="location_usa">Estados Unidos</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="location_other" name="current_location" value="other">
                        <label class="form-check-label" for="location_other">Outro</label>
                    </div>

                    <div id="other-location-field" class="conditional-field">
                        <label class="form-label" for="other_location">Especifique o país:</label>
                        <input type="text" id="other_location" class="form-input">
                    </div>
                </div>
            </div>

            <!-- Section for Brazil/Other -->
            <div id="brazil-section" class="questionnaire-section" style="display: none;">
                <h3 class="section-title">📖 Conte sua História</h3>

                <div class="form-group">
                    <label class="form-label" for="personal_story">
                        Conte um pouco sobre sua história: vida, família, trabalho, o que te fez escolher USMLE
                    </label>
                    <textarea id="personal_story" class="form-textarea" rows="6"
                        placeholder="Compartilhe sua trajetória, motivações e sonhos..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Sua família está de acordo com o processo de equivalência nos EUA?
                    </label>
                    <div class="form-check">
                        <input type="radio" id="family_yes" name="family_agreement" value="totally_agree">
                        <label class="form-check-label" for="family_yes">Sim, totalmente de acordo</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_some" name="family_agreement" value="some_reservations">
                        <label class="form-check-label" for="family_some">Sim, com algumas ressalvas</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_discussion" name="family_agreement" value="in_discussion">
                        <label class="form-check-label" for="family_discussion">Ainda em discussão</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_no" name="family_agreement" value="disagree">
                        <label class="form-check-label" for="family_no">Não estão de acordo</label>
                    </div>
                </div>
            </div>

            <!-- Section for USA -->
            <div id="usa-section" class="questionnaire-section" style="display: none;">
                <h3 class="section-title">🇺🇸 Sua Vida nos EUA</h3>

                <div class="form-group">
                    <label class="form-label" for="how_got_usa">
                        Como você foi para os EUA?
                    </label>
                    <textarea id="how_got_usa" class="form-textarea" rows="3"
                        placeholder="Conte como foi sua ida para os EUA..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="visa_type_usa">
                        Qual visto possui?
                    </label>
                    <input type="text" id="visa_type_usa" class="form-input" placeholder="Ex: H1B, J1, Green Card...">
                </div>

                <div class="form-group">
                    <label class="form-label" for="how_got_visa">
                        Como conseguiu o visto?
                    </label>
                    <textarea id="how_got_visa" class="form-textarea" rows="3"
                        placeholder="Descreva o processo..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Trabalha nos EUA atualmente?
                    </label>
                    <div class="form-check">
                        <input type="radio" id="works_usa_yes" name="works_in_usa" value="true">
                        <label class="form-check-label" for="works_usa_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="works_usa_no" name="works_in_usa" value="false">
                        <label class="form-check-label" for="works_usa_no">Não</label>
                    </div>
                </div>

                <div id="work-details-field" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label" for="how_got_job">
                            Como conseguiu esse trabalho?
                        </label>
                        <textarea id="how_got_job" class="form-textarea" rows="3"
                            placeholder="Descreva como conseguiu o emprego..."></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="personal_story_usa">
                        Conte um pouco sobre sua história: vida, família, trabalho, o que te fez escolher USMLE
                    </label>
                    <textarea id="personal_story_usa" class="form-textarea" rows="6"
                        placeholder="Compartilhe sua trajetória, motivações e sonhos..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Sua família está de acordo com o processo de equivalência nos EUA?
                    </label>
                    <div class="form-check">
                        <input type="radio" id="family_usa_yes" name="family_agreement_usa" value="totally_agree">
                        <label class="form-check-label" for="family_usa_yes">Sim, totalmente de acordo</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_usa_some" name="family_agreement_usa" value="some_reservations">
                        <label class="form-check-label" for="family_usa_some">Sim, com algumas ressalvas</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_usa_discussion" name="family_agreement_usa" value="in_discussion">
                        <label class="form-check-label" for="family_usa_discussion">Ainda em discussão</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="family_usa_no" name="family_agreement_usa" value="disagree">
                        <label class="form-check-label" for="family_usa_no">Não estão de acordo</label>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('/questionnaire/step10-observerships')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary btn-lg">
                        🎉 FINALIZAR CADASTRO
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        // Load saved data on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(11);
            if (data) {
                // Current location
                if (data.current_location) {
                    const locationRadio = document.querySelector(`input[name="current_location"][value="${data.current_location}"]`);
                    if (locationRadio) {
                        locationRadio.checked = true;
                        locationRadio.dispatchEvent(new Event('change'));
                    }
                }

                // Other location
                if (data.other_location) {
                    document.getElementById('other_location').value = data.other_location;
                }

                // Brazil/Other section
                if (data.personal_story) {
                    document.getElementById('personal_story').value = data.personal_story;
                }
                if (data.family_agreement) {
                    const famRadio = document.querySelector(`input[name="family_agreement"][value="${data.family_agreement}"]`);
                    if (famRadio) famRadio.checked = true;
                }

                // USA section
                if (data.how_got_to_usa) {
                    document.getElementById('how_got_usa').value = data.how_got_to_usa;
                }
                if (data.visa_type_usa) {
                    document.getElementById('visa_type_usa').value = data.visa_type_usa;
                }
                if (data.how_got_visa) {
                    document.getElementById('how_got_visa').value = data.how_got_visa;
                }
                if (data.works_in_usa !== undefined) {
                    const worksRadio = document.querySelector(`input[name="works_in_usa"][value="${data.works_in_usa}"]`);
                    if (worksRadio) {
                        worksRadio.checked = true;
                        worksRadio.dispatchEvent(new Event('change'));
                    }
                }
                if (data.how_got_job) {
                    document.getElementById('how_got_job').value = data.how_got_job;
                }
                if (data.personal_story && data.current_location === 'usa') {
                    document.getElementById('personal_story_usa').value = data.personal_story;
                }
                if (data.family_agreement && data.current_location === 'usa') {
                    const famUsaRadio = document.querySelector(`input[name="family_agreement_usa"][value="${data.family_agreement}"]`);
                    if (famUsaRadio) famUsaRadio.checked = true;
                }
            }
        });

        // Conditional: location
        document.querySelectorAll('input[name="current_location"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const brazilSection = document.getElementById('brazil-section');
                const usaSection = document.getElementById('usa-section');
                const otherField = document.getElementById('other-location-field');

                brazilSection.style.display = 'none';
                usaSection.style.display = 'none';
                otherField.classList.remove('visible');

                if (this.value === 'brazil' || this.value === 'other') {
                    brazilSection.style.display = 'block';
                    if (this.value === 'other') {
                        otherField.classList.add('visible');
                    }
                } else if (this.value === 'usa') {
                    usaSection.style.display = 'block';
                }
            });
        });

        // Conditional: works in usa
        document.querySelectorAll('input[name="works_in_usa"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const field = document.getElementById('work-details-field');
                if (this.value === 'true') {
                    field.classList.add('visible');
                } else {
                    field.classList.remove('visible');
                }
            });
        });

        function getFormData() {
            const location = document.querySelector('input[name="current_location"]:checked')?.value;

            const formData = {
                current_location: location,
                other_location: document.getElementById('other_location').value
            };

            if (location === 'brazil' || location === 'other') {
                formData.personal_story = document.getElementById('personal_story').value;
                formData.family_agreement = document.querySelector('input[name="family_agreement"]:checked')?.value;
            } else if (location === 'usa') {
                formData.how_got_to_usa = document.getElementById('how_got_usa').value;
                formData.visa_type_usa = document.getElementById('visa_type_usa').value;
                formData.how_got_visa = document.getElementById('how_got_visa').value;
                formData.works_in_usa = document.querySelector('input[name="works_in_usa"]:checked')?.value === 'true';
                formData.how_got_job = document.getElementById('how_got_job').value;
                formData.personal_story = document.getElementById('personal_story_usa').value;
                formData.family_agreement = document.querySelector('input[name="family_agreement_usa"]:checked')?.value;
            }

            return formData;
        }

        // Form submission
        document.getElementById('step11-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(11, getFormData());

            if (success) {
                // Mark questionnaire as complete
                await WardApp.completeQuestionnaire();

                // Create default landmarks for this student
                await createDefaultLandmarksForNewStudent();

                WardApp.hideLoading();
                WardApp.showToast('Cadastro finalizado com sucesso!');

                setTimeout(async () => {
                    // Redirect to correct dashboard based on role
                    let userData = JSON.parse(localStorage.getItem('userData') || 'null');

                    // If no userData, try to get from checkAuth
                    if (!userData || !userData.role) {
                        const userId = localStorage.getItem('userId');
                        if (userId) {
                            // Fetch from database
                            const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                            if (data) userData = data;
                        }
                    }

                    const dashboardUrl = (userData?.role === 'assessoria') ? '/dashboard-assessoria-avulsa' : '/dashboard';
                    window.location.href = addViewAsToUrl(dashboardUrl);
                }, 1500);
            } else {
                WardApp.hideLoading();
            }
        });

        async function continueLater() {
            await WardApp.saveQuestionnaireProgress(11, getFormData());
            // Redirect to correct dashboard based on role
            let userData = JSON.parse(localStorage.getItem('userData') || 'null');
            
            // If no userData, try to get from checkAuth
            if (!userData || !userData.role) {
                const userId = localStorage.getItem('userId');
                if (userId) {
                    // Fetch from database
                    const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                    if (data) userData = data;
                }
            }
            
            const dashboardUrl = (userData?.role === 'assessoria') ? '/dashboard-assessoria-avulsa' : '/dashboard';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }

        async function createDefaultLandmarksForNewStudent() {
            try {
                const userId = parseInt(localStorage.getItem('userId'));
                if (!userId) return;

                // Check if landmarks already exist
                const { data: existing } = await WardApp.db
                    .from('landmarks')
                    .select('id')
                    .eq('user_id', userId)
                    .limit(1);

                if (existing && existing.length > 0) return; // Already has landmarks

                // Check research interest from step 9
                const { data: researchData } = await WardApp.db
                    .from('questionnaire_data')
                    .select('data')
                    .eq('user_id', userId)
                    .eq('step', 9)
                    .maybeSingle();

                const wantsResearchWard = researchData?.data?.wants_research_ward;
                const wantsResearch = wantsResearchWard === 'immediately' || wantsResearchWard === 'after_usmle';

                const defaultLandmarks = [
                    { group: 'setup', title: 'Entrada na Ward Academy', type: 'entry' },
                    { group: 'first-round', title: '1a Chamada - Dra. Iria: Background e USMLE', type: 'call_iria_1' },
                    { group: 'first-round', title: '1a Chamada - Guilherme: Configurando Anki', type: 'call_guilherme_1' },
                    { group: 'first-round', title: '1a Chamada - Marcos: Organizando proximos passos', type: 'call_marcos_1' },
                    { group: 'second-round', title: '2a Chamada - Dra. Iria: Como usar o UWorld', type: 'call_iria_2' },
                    { group: 'second-round', title: '2a Chamada - Guilherme: Uso do Anki nas ultimas semanas', type: 'call_guilherme_2' },
                    { group: 'second-round', title: '3a Chamada - Dra. Iria: Inscrição no MyIntealth', type: 'call_iria_3' },
                    { group: 'second-round', title: '4a Chamada - Dra. Iria: Desempenho no Blocao', type: 'call_iria_4' },
                    { group: 'research', title: '2a Chamada - Marcos: Conversa sobre pesquisa', type: 'call_marcos_research_2', conditional: true },
                    { group: 'research', title: '3a Chamada - Marcos: Usar databases corretamente', type: 'call_marcos_research_3', conditional: true },
                    { group: 'research', title: '4a Chamada - Marcos: Validando ideia de revisao', type: 'call_marcos_research_4', conditional: true },
                    { group: 'research', title: '5a Chamada - Marcos: Triagem por titulo e resumo', type: 'call_marcos_research_5', conditional: true },
                    { group: 'research', title: '6a Chamada - Marcos: Triagem por manuscritos', type: 'call_marcos_research_6', conditional: true },
                    { group: 'research', title: '7a Chamada - Marcos: Extracao de dados', type: 'call_marcos_research_7', conditional: true },
                    { group: 'research', title: '8a Chamada - Marcos: Risco de vies', type: 'call_marcos_research_8', conditional: true },
                    { group: 'research', title: '9a Chamada - Marcos: Escrita cientifica', type: 'call_marcos_research_9', conditional: true },
                    { group: 'research', title: '10a Chamada - Marcos: Submissao do manuscrito', type: 'call_marcos_research_10', conditional: true },
                    { group: 'second-pass', title: 'Chamada - Dra. Iria: Second Pass', type: 'call_iria_second_pass' },
                    { group: 'second-pass', title: 'Chamada - Dra. Iria: Simulados (NBMEs)', type: 'call_iria_nbmes' },
                    { group: 'dedicated', title: 'Chamada - Dra. Iria: Dedicated', type: 'call_iria_dedicated' },
                    { group: 'dedicated', title: 'Chamada - Dra. Iria: Agendar a prova', type: 'call_iria_schedule' },
                    { group: 'dedicated', title: 'Chamada - Dra. Iria: Pre-prova', type: 'call_iria_pre_exam' },
                    { group: 'dedicated', title: 'Chamada - Dra. Iria: Pos-prova', type: 'call_iria_post_exam' }
                ];

                const filtered = defaultLandmarks.filter(lm => !lm.conditional || wantsResearch);
                const rows = filtered.map((lm, i) => ({
                    user_id: userId,
                    landmark_type: lm.type,
                    title: lm.title,
                    completed: lm.type === 'entry',
                    completion_date: lm.type === 'entry' ? new Date().toISOString() : null,
                    is_urgent: false,
                    notes: [],
                    order_position: i,
                    group_name: lm.group
                }));

                await WardApp.db.from('landmarks').insert(rows);
                console.log('Default landmarks created for new student');
            } catch (err) {
                console.error('Error creating default landmarks:', err);
            }
        }
    </script>
</body>
</html>
