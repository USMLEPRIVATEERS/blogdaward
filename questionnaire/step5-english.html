<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Nível de Inglês</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Avaliação do Inglês</span>
                <span class="progress-text">5/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 45%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Avaliação do Inglês</h1>
            <p class="questionnaire-step">Etapa 5 de 11</p>
        </div>

        <!-- Form -->
        <form id="step5-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">📖 Leitura e Compreensão</h3>

                <div class="form-group">
                    <label class="form-label">
                        Como está sua leitura em inglês? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="reading_good" name="reading_level" value="good" required>
                        <label class="form-check-label" for="reading_good">
                            Consigo ler e entender as questões do UWorld sem problemas
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="reading_search" name="reading_level" value="needs_search">
                        <label class="form-check-label" for="reading_search">
                            Preciso pesquisar palavras com frequência
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="reading_translating" name="reading_level" value="translating">
                        <label class="form-check-label" for="reading_translating">
                            Estou traduzindo o UWorld
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="reading_difficulty" name="reading_level" value="much_difficulty">
                        <label class="form-check-label" for="reading_difficulty">
                            Tenho muita dificuldade com leitura
                        </label>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">🎧 Escuta e Compreensão</h3>

                <div class="form-group">
                    <label class="form-label">
                        Como está sua compreensão auditiva? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="listening_good" name="listening_level" value="good" required>
                        <label class="form-check-label" for="listening_good">
                            Consigo entender aulas do B&B e outros cursos normalmente
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="listening_subtitles" name="listening_level" value="needs_subtitles">
                        <label class="form-check-label" for="listening_subtitles">
                            Entendo parcialmente, preciso de legendas
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="listening_difficulty" name="listening_level" value="difficulty">
                        <label class="form-check-label" for="listening_difficulty">
                            Não consigo entender bem escuta em inglês
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="listening_much_difficulty" name="listening_level" value="much_difficulty">
                        <label class="form-check-label" for="listening_much_difficulty">
                            Tenho muita dificuldade com áudio
                        </label>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">💬 Comentários Adicionais</h3>

                <div class="form-group">
                    <label class="form-label" for="additional_comments">
                        Comentários adicionais sobre seu inglês (opcional)
                    </label>
                    <textarea id="additional_comments" class="form-textarea" rows="4"
                        placeholder="Conte-nos mais sobre sua experiência com o idioma, cursos que já fez, etc..."></textarea>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('/questionnaire/step4-uworld-progress')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        // Load existing data
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(5);
            if (data) {
                if (data.reading_level) {
                    document.querySelector(`input[name="reading_level"][value="${data.reading_level}"]`).checked = true;
                }
                if (data.listening_level) {
                    document.querySelector(`input[name="listening_level"][value="${data.listening_level}"]`).checked = true;
                }
                document.getElementById('additional_comments').value = data.additional_comments || '';
            }
        });

        // Form submission
        document.getElementById('step5-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                reading_level: document.querySelector('input[name="reading_level"]:checked')?.value,
                listening_level: document.querySelector('input[name="listening_level"]:checked')?.value,
                additional_comments: document.getElementById('additional_comments').value
            };

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(5, formData);
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('/questionnaire/step6-anki');
            }
        });

        async function continueLater() {
            const formData = {
                reading_level: document.querySelector('input[name="reading_level"]:checked')?.value,
                listening_level: document.querySelector('input[name="listening_level"]:checked')?.value,
                additional_comments: document.getElementById('additional_comments').value
            };

            await WardApp.saveQuestionnaireProgress(5, formData);
            // Redirect to correct dashboard based on role
            let userData = JSON.parse(localStorage.getItem('userData') || 'null');

            // If no userData, try to get from checkAuth
            if (!userData || !userData.role) {
                const userId = localStorage.getItem('userId');
                if (userId) {
                    // Fetch from database
                    const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                    if (data) userData = data;
                }
            }

            const dashboardUrl = (userData?.role === 'assessoria') ? '/dashboard-assessoria-avulsa' : '/dashboard';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }
    </script>
</body>
</html>
