<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Uso do Anki</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Uso do Anki</span>
                <span class="progress-text">6/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 54%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Uso do Anki</h1>
            <p class="questionnaire-step">Etapa 6 de 11</p>
        </div>

        <!-- Form -->
        <form id="step6-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">📱 Status do Anki</h3>

                <div class="form-group">
                    <label class="form-label">
                        Ja baixou o Anki? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="downloaded_yes" name="downloaded" value="true" required>
                        <label class="form-check-label" for="downloaded_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="downloaded_no" name="downloaded" value="false">
                        <label class="form-check-label" for="downloaded_no">Nao</label>
                    </div>
                </div>

                <div id="used-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label">Ja usou o Anki?</label>
                        <div class="form-check">
                            <input type="radio" id="used_yes" name="used" value="true">
                            <label class="form-check-label" for="used_yes">Sim</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="used_no" name="used" value="false">
                            <label class="form-check-label" for="used_no">Nao</label>
                        </div>
                    </div>
                </div>
            </div>

            <div id="usage-details-section" class="questionnaire-section" style="display: none;">
                <h3 class="section-title">📊 Detalhes de Uso</h3>

                <div class="form-group">
                    <label class="form-label">Usa o deck do AnKing?</label>
                    <div class="form-check">
                        <input type="radio" id="anking_yes" name="uses_anking" value="true">
                        <label class="form-check-label" for="anking_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="anking_no" name="uses_anking" value="false">
                        <label class="form-check-label" for="anking_no">Nao</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="anking_unknown" name="uses_anking" value="unknown">
                        <label class="form-check-label" for="anking_unknown">Nao conheco</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Com que frequencia usa?</label>
                    <div class="form-check">
                        <input type="radio" id="freq_daily" name="frequency" value="daily">
                        <label class="form-check-label" for="freq_daily">Todos os dias</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="freq_alternate" name="frequency" value="alternate">
                        <label class="form-check-label" for="freq_alternate">Dia sim, dia nao</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="freq_few" name="frequency" value="few_times">
                        <label class="form-check-label" for="freq_few">Poucas vezes na semana</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="freq_rarely" name="frequency" value="rarely">
                        <label class="form-check-label" for="freq_rarely">Quase nao tenho usado</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Cria seus proprios flashcards?</label>
                    <div class="form-check">
                        <input type="radio" id="creates_yes" name="creates_own_cards" value="yes">
                        <label class="form-check-label" for="creates_yes">Sim, crio meus proprios cards</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="creates_no" name="creates_own_cards" value="no">
                        <label class="form-check-label" for="creates_no">Nao, uso apenas o AnKing</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="creates_both" name="creates_own_cards" value="both">
                        <label class="form-check-label" for="creates_both">Uso o AnKing e tambem crio alguns cards</label>
                    </div>
                </div>
            </div>

            <div id="devices-section" class="questionnaire-section" style="display: none;">
                <h3 class="section-title">💻 Dispositivos</h3>

                <div class="form-group">
                    <label class="form-label">Em quais dispositivos usa? (marque todos)</label>
                    <div class="form-check">
                        <input type="checkbox" id="device_windows" name="devices" value="windows">
                        <label class="form-check-label" for="device_windows">Computador (Windows/Linux)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="device_mac" name="devices" value="mac">
                        <label class="form-check-label" for="device_mac">Mac</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="device_iphone" name="devices" value="iphone">
                        <label class="form-check-label" for="device_iphone">iPhone</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="device_android" name="devices" value="android">
                        <label class="form-check-label" for="device_android">Android</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="device_tablet" name="devices" value="tablet">
                        <label class="form-check-label" for="device_tablet">Tablet</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="device_ipad" name="devices" value="ipad">
                        <label class="form-check-label" for="device_ipad">iPad</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Qual dispositivo usa COM MAIS FREQUENCIA?</label>
                    <div class="form-check">
                        <input type="radio" id="main_windows" name="main_device" value="windows">
                        <label class="form-check-label" for="main_windows">Computador</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="main_mac" name="main_device" value="mac">
                        <label class="form-check-label" for="main_mac">Mac</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="main_iphone" name="main_device" value="iphone">
                        <label class="form-check-label" for="main_iphone">iPhone</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="main_android" name="main_device" value="android">
                        <label class="form-check-label" for="main_android">Android</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="main_tablet" name="main_device" value="tablet">
                        <label class="form-check-label" for="main_tablet">Tablet</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="main_ipad" name="main_device" value="ipad">
                        <label class="form-check-label" for="main_ipad">iPad</label>
                    </div>
                </div>

                <div class="input-group">
                    <div class="form-group">
                        <label class="form-label" for="average_cards">Media de cards por dia</label>
                        <input type="number" id="average_cards" class="form-input" min="0" placeholder="Ex: 200">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="using_since">Desde quando usa?</label>
                        <input type="date" id="using_since" class="form-input">
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('/questionnaire/step5-english')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        // Load existing data
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(6);
            if (data) {
                if (data.downloaded !== null) {
                    document.querySelector(`input[name="downloaded"][value="${data.downloaded}"]`).checked = true;
                    if (data.downloaded) {
                        document.getElementById('used-section').classList.add('visible');
                    }
                }
                if (data.used !== null) {
                    document.querySelector(`input[name="used"][value="${data.used}"]`).checked = true;
                    if (data.used) {
                        document.getElementById('usage-details-section').style.display = 'block';
                        document.getElementById('devices-section').style.display = 'block';
                    }
                }
                if (data.uses_anking) {
                    document.querySelector(`input[name="uses_anking"][value="${data.uses_anking}"]`).checked = true;
                }
                if (data.frequency) {
                    document.querySelector(`input[name="frequency"][value="${data.frequency}"]`).checked = true;
                }
                if (data.creates_own_cards) {
                    document.querySelector(`input[name="creates_own_cards"][value="${data.creates_own_cards}"]`).checked = true;
                }
                if (data.devices) {
                    const devices = JSON.parse(data.devices);
                    devices.forEach(d => {
                        const cb = document.querySelector(`input[name="devices"][value="${d}"]`);
                        if (cb) cb.checked = true;
                    });
                }
                if (data.main_device) {
                    document.querySelector(`input[name="main_device"][value="${data.main_device}"]`).checked = true;
                }
                document.getElementById('average_cards').value = data.average_cards_per_day || '';
                document.getElementById('using_since').value = data.using_since || '';
            }
        });

        // Conditional: downloaded
        document.querySelectorAll('input[name="downloaded"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('used-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                    document.getElementById('usage-details-section').style.display = 'none';
                    document.getElementById('devices-section').style.display = 'none';
                }
            });
        });

        // Conditional: used
        document.querySelectorAll('input[name="used"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const usageSection = document.getElementById('usage-details-section');
                const devicesSection = document.getElementById('devices-section');
                if (this.value === 'true') {
                    usageSection.style.display = 'block';
                    devicesSection.style.display = 'block';
                } else {
                    usageSection.style.display = 'none';
                    devicesSection.style.display = 'none';
                }
            });
        });

        // Form submission
        document.getElementById('step6-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const devices = Array.from(document.querySelectorAll('input[name="devices"]:checked'))
                .map(cb => cb.value);

            const formData = {
                downloaded: document.querySelector('input[name="downloaded"]:checked')?.value === 'true',
                used: document.querySelector('input[name="used"]:checked')?.value === 'true',
                uses_anking: document.querySelector('input[name="uses_anking"]:checked')?.value,
                frequency: document.querySelector('input[name="frequency"]:checked')?.value,
                creates_own_cards: document.querySelector('input[name="creates_own_cards"]:checked')?.value,
                devices: JSON.stringify(devices),
                main_device: document.querySelector('input[name="main_device"]:checked')?.value,
                average_cards_per_day: parseInt(document.getElementById('average_cards').value) || null,
                using_since: document.getElementById('using_since').value || null
            };

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(6, formData);
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('/questionnaire/step7-research-1');
            }
        });

        async function continueLater() {
            const devices = Array.from(document.querySelectorAll('input[name="devices"]:checked'))
                .map(cb => cb.value);

            const formData = {
                downloaded: document.querySelector('input[name="downloaded"]:checked')?.value === 'true',
                used: document.querySelector('input[name="used"]:checked')?.value === 'true',
                uses_anking: document.querySelector('input[name="uses_anking"]:checked')?.value,
                frequency: document.querySelector('input[name="frequency"]:checked')?.value,
                creates_own_cards: document.querySelector('input[name="creates_own_cards"]:checked')?.value,
                devices: JSON.stringify(devices),
                main_device: document.querySelector('input[name="main_device"]:checked')?.value,
                average_cards_per_day: parseInt(document.getElementById('average_cards').value) || null,
                using_since: document.getElementById('using_since').value || null
            };

            await WardApp.saveQuestionnaireProgress(6, formData);
            // Redirect to correct dashboard based on role
            let userData = JSON.parse(localStorage.getItem('userData') || 'null');
            
            // If no userData, try to get from checkAuth
            if (!userData || !userData.role) {
                const userId = localStorage.getItem('userId');
                if (userId) {
                    // Fetch from database
                    const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                    if (data) userData = data;
                }
            }
            
            const dashboardUrl = (userData?.role === 'assessoria') ? '/dashboard-assessoria-avulsa' : '/dashboard';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }
    </script>
</body>
</html>
