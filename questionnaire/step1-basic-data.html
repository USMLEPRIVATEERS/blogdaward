<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Dados Basicos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Cadastro Inicial</span>
                <span class="progress-text">1/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 9%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Seus Dados Profissionais</h1>
            <p class="questionnaire-step">Etapa 1 de 11</p>
        </div>

        <!-- Form -->
        <form id="step1-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">📋 Informacoes Pessoais</h3>

                <div class="form-group">
                    <label class="form-label" for="full_name">
                        Nome Completo <span class="required">*</span>
                    </label>
                    <input type="text" id="full_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email_confirm">
                        Confirme seu Email <span class="required">*</span>
                    </label>
                    <input type="email" id="email_confirm" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cpf">
                        CPF <span class="required">*</span>
                    </label>
                    <input type="text" id="cpf" class="form-input" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="orcid">
                        ORCID
                        <span class="form-hint">(opcional - pode adicionar depois)</span>
                    </label>
                    <input type="text" id="orcid" class="form-input" placeholder="0000-0000-0000-0000">
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">📍 Endereco Completo</h3>
                <p class="form-hint mb-2">Compativel com Brasil, EUA, Europa, etc.</p>

                <div class="form-group">
                    <label class="form-label" for="address_line1">
                        Rua/Avenida <span class="required">*</span>
                    </label>
                    <input type="text" id="address_line1" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="address_line2">
                        Numero/Complemento
                    </label>
                    <input type="text" id="address_line2" class="form-input">
                </div>

                <div class="input-group">
                    <div class="form-group">
                        <label class="form-label" for="city">
                            Cidade <span class="required">*</span>
                        </label>
                        <input type="text" id="city" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="state">
                            Estado/Provincia <span class="required">*</span>
                        </label>
                        <input type="text" id="state" class="form-input" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="form-group">
                        <label class="form-label" for="zip_code">
                            CEP/Zip Code <span class="required">*</span>
                        </label>
                        <input type="text" id="zip_code" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="country">
                            Pais <span class="required">*</span>
                        </label>
                        <select id="country" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option value="BR">Brasil</option>
                            <option value="US">Estados Unidos</option>
                            <option value="PT">Portugal</option>
                            <option value="ES">Espanha</option>
                            <option value="DE">Alemanha</option>
                            <option value="FR">Franca</option>
                            <option value="IT">Italia</option>
                            <option value="UK">Reino Unido</option>
                            <option value="CA">Canada</option>
                            <option value="OTHER">Outro</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">🎓 Formacao e Carreira</h3>

                <div class="form-group">
                    <label class="form-label" for="graduation_date">
                        Data de Formatura em Medicina <span class="required">*</span>
                    </label>
                    <input type="date" id="graduation_date" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="medical_school">
                        Faculdade de Medicina <span class="required">*</span>
                    </label>
                    <input type="text" id="medical_school" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="current_institution">
                        Instituicao Atual em que Trabalha <span class="required">*</span>
                    </label>
                    <input type="text" id="current_institution" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="current_specialty">
                        Especialidade Atual <span class="required">*</span>
                    </label>
                    <input type="text" id="current_specialty" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="intended_specialty_usa">
                        Especialidade Pretendida nos EUA <span class="required">*</span>
                    </label>
                    <input type="text" id="intended_specialty_usa" class="form-input" required>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <div></div>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script>
        // Load existing data on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(1);
            if (data) {
                document.getElementById('full_name').value = data.full_name || '';
                document.getElementById('email_confirm').value = data.email_confirm || '';
                document.getElementById('cpf').value = data.cpf || '';
                document.getElementById('orcid').value = data.orcid || '';
                document.getElementById('address_line1').value = data.address_line1 || '';
                document.getElementById('address_line2').value = data.address_line2 || '';
                document.getElementById('city').value = data.city || '';
                document.getElementById('state').value = data.state || '';
                document.getElementById('zip_code').value = data.zip_code || '';
                document.getElementById('country').value = data.country || '';
                document.getElementById('graduation_date').value = data.graduation_date || '';
                document.getElementById('medical_school').value = data.medical_school || '';
                document.getElementById('current_institution').value = data.current_institution || '';
                document.getElementById('current_specialty').value = data.current_specialty || '';
                document.getElementById('intended_specialty_usa').value = data.intended_specialty_usa || '';
            }
        });

        // CPF Mask
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 9) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/(\d{3})(\d{3})/, '$1.$2');
            }
            e.target.value = value;
        });

        // Form submission
        document.getElementById('step1-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                full_name: document.getElementById('full_name').value,
                email_confirm: document.getElementById('email_confirm').value,
                cpf: document.getElementById('cpf').value,
                orcid: document.getElementById('orcid').value,
                address_line1: document.getElementById('address_line1').value,
                address_line2: document.getElementById('address_line2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip_code: document.getElementById('zip_code').value,
                country: document.getElementById('country').value,
                graduation_date: document.getElementById('graduation_date').value,
                medical_school: document.getElementById('medical_school').value,
                current_institution: document.getElementById('current_institution').value,
                current_specialty: document.getElementById('current_specialty').value,
                intended_specialty_usa: document.getElementById('intended_specialty_usa').value
            };

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(1, formData);
            WardApp.hideLoading();

            if (success) {
                window.location.href = 'step2-usmle-data.html';
            }
        });

        // Continue later
        async function continueLater() {
            const formData = {
                full_name: document.getElementById('full_name').value,
                email_confirm: document.getElementById('email_confirm').value,
                cpf: document.getElementById('cpf').value,
                orcid: document.getElementById('orcid').value,
                address_line1: document.getElementById('address_line1').value,
                address_line2: document.getElementById('address_line2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip_code: document.getElementById('zip_code').value,
                country: document.getElementById('country').value,
                graduation_date: document.getElementById('graduation_date').value,
                medical_school: document.getElementById('medical_school').value,
                current_institution: document.getElementById('current_institution').value,
                current_specialty: document.getElementById('current_specialty').value,
                intended_specialty_usa: document.getElementById('intended_specialty_usa').value
            };

            await WardApp.saveQuestionnaireProgress(1, formData);
            window.location.href = '../dashboard.html';
        }
    </script>
</body>
</html>
