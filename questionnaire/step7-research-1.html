<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Pesquisa Academica</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Pesquisa Academica</span>
                <span class="progress-text">7/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 63%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Pesquisa Academica</h1>
            <p class="questionnaire-step">Etapa 7 de 11</p>
        </div>

        <!-- Form -->
        <form id="step7-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">🔬 Dados para Publicacoes</h3>
                <p class="form-hint mb-3">Esses dados serao usados para submissoes de pesquisas para congressos e revistas.</p>

                <div class="form-group">
                    <label class="form-label" for="orcid">
                        ORCID <span class="required">*</span>
                    </label>
                    <input type="text" id="orcid" class="form-input" placeholder="0000-0000-0000-0000" required>
                    <span class="form-hint">Obrigatorio para publicacoes. Crie em <a href="https://orcid.org" target="_blank">orcid.org</a></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email_confirm">
                        Confirme seu Email <span class="required">*</span>
                    </label>
                    <input type="email" id="email_confirm" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="full_name">
                        Nome Completo <span class="required">*</span>
                    </label>
                    <input type="text" id="full_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="institution">
                        Instituicao Afiliada Atualmente <span class="required">*</span>
                    </label>
                    <input type="text" id="institution" class="form-input" required>
                </div>

                <div class="input-group">
                    <div class="form-group">
                        <label class="form-label" for="specialty">
                            Especialidade <span class="required">*</span>
                        </label>
                        <input type="text" id="specialty" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="department">
                            Departamento
                        </label>
                        <input type="text" id="department" class="form-input">
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">📚 Experiencia com Pesquisa</h3>

                <div class="form-group">
                    <label class="form-label">
                        Qual sua experiencia com pesquisa? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="exp_none" name="experience_level" value="none" required>
                        <label class="form-check-label" for="exp_none">Nenhuma experiencia</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="exp_ongoing" name="experience_level" value="ongoing">
                        <label class="form-check-label" for="exp_ongoing">Ja participei de projetos ainda nao concluidos</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="exp_congress" name="experience_level" value="congress">
                        <label class="form-check-label" for="exp_congress">Ja tive projetos apresentados em congresso</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="exp_not_indexed" name="experience_level" value="not_indexed">
                        <label class="form-check-label" for="exp_not_indexed">Ja tive publicacoes nao indexadas no PubMed</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="exp_pubmed" name="experience_level" value="pubmed">
                        <label class="form-check-label" for="exp_pubmed">Tenho publicacoes indexadas no PubMed</label>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">📖 Revisao Sistematica</h3>

                <div class="form-group">
                    <label class="form-label">Ja participou de alguma revisao sistematica?</label>
                    <div class="form-check">
                        <input type="radio" id="sr_never" name="participated_systematic_review" value="never">
                        <label class="form-check-label" for="sr_never">Nunca participei</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="sr_punctual" name="participated_systematic_review" value="punctual">
                        <label class="form-check-label" for="sr_punctual">Fiz algo pontual</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="sr_first_author" name="participated_systematic_review" value="first_author">
                        <label class="form-check-label" for="sr_first_author">Fui primeiro autor</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="sr_other" name="participated_systematic_review" value="other">
                        <label class="form-check-label" for="sr_other">Outro</label>
                    </div>

                    <div id="sr-other-field" class="conditional-field">
                        <label class="form-label" for="sr_other_details">Especifique:</label>
                        <input type="text" id="sr_other_details" class="form-input">
                    </div>
                </div>

                <div id="sr-status-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label">Qual o status dessa revisao?</label>
                        <div class="form-check">
                            <input type="radio" id="status_indexed" name="review_status" value="published_indexed">
                            <label class="form-check-label" for="status_indexed">Publicada e indexada</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="status_not_indexed" name="review_status" value="published_not_indexed">
                            <label class="form-check-label" for="status_not_indexed">Publicada, nao indexada</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="status_congress" name="review_status" value="congress">
                            <label class="form-check-label" for="status_congress">Apresentada em congresso</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="status_ongoing" name="review_status" value="ongoing">
                            <label class="form-check-label" for="status_ongoing">Ainda em producao</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="status_abandoned" name="review_status" value="abandoned">
                            <label class="form-check-label" for="status_abandoned">Abandonada</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('step6-anki.html')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        // Load existing data
        document.addEventListener('DOMContentLoaded', async () => {
            // Try to load from basic data first
            const basicData = await WardApp.loadQuestionnaireData(1);
            if (basicData) {
                document.getElementById('orcid').value = basicData.orcid || '';
                document.getElementById('email_confirm').value = basicData.email_confirm || '';
                document.getElementById('full_name').value = basicData.full_name || '';
                document.getElementById('institution').value = basicData.current_institution || '';
                document.getElementById('specialty').value = basicData.current_specialty || '';
            }

            const data = await WardApp.loadQuestionnaireData(7);
            if (data) {
                if (data.orcid) document.getElementById('orcid').value = data.orcid;
                if (data.email_confirm) document.getElementById('email_confirm').value = data.email_confirm;
                if (data.full_name) document.getElementById('full_name').value = data.full_name;
                if (data.institution) document.getElementById('institution').value = data.institution;
                if (data.specialty) document.getElementById('specialty').value = data.specialty;
                if (data.department) document.getElementById('department').value = data.department;

                if (data.experience_level) {
                    document.querySelector(`input[name="experience_level"][value="${data.experience_level}"]`).checked = true;
                }
                if (data.participated_systematic_review) {
                    document.querySelector(`input[name="participated_systematic_review"][value="${data.participated_systematic_review}"]`).checked = true;
                    if (['punctual', 'first_author', 'other'].includes(data.participated_systematic_review)) {
                        document.getElementById('sr-status-section').classList.add('visible');
                    }
                    if (data.participated_systematic_review === 'other') {
                        document.getElementById('sr-other-field').classList.add('visible');
                    }
                }
                if (data.sr_other_details) {
                    document.getElementById('sr_other_details').value = data.sr_other_details;
                }
                if (data.review_status) {
                    document.querySelector(`input[name="review_status"][value="${data.review_status}"]`).checked = true;
                }
            }
        });

        // Conditional: other SR
        document.getElementById('sr_other').addEventListener('change', function() {
            document.getElementById('sr-other-field').classList.toggle('visible', this.checked);
        });

        // Conditional: SR participated
        document.querySelectorAll('input[name="participated_systematic_review"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const statusSection = document.getElementById('sr-status-section');
                const otherField = document.getElementById('sr-other-field');

                if (['punctual', 'first_author', 'other'].includes(this.value)) {
                    statusSection.classList.add('visible');
                } else {
                    statusSection.classList.remove('visible');
                }

                if (this.value === 'other') {
                    otherField.classList.add('visible');
                } else {
                    otherField.classList.remove('visible');
                }
            });
        });

        // Form submission
        document.getElementById('step7-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                orcid: document.getElementById('orcid').value,
                email_confirm: document.getElementById('email_confirm').value,
                full_name: document.getElementById('full_name').value,
                institution: document.getElementById('institution').value,
                specialty: document.getElementById('specialty').value,
                department: document.getElementById('department').value,
                experience_level: document.querySelector('input[name="experience_level"]:checked')?.value,
                participated_systematic_review: document.querySelector('input[name="participated_systematic_review"]:checked')?.value,
                sr_other_details: document.getElementById('sr_other_details').value,
                review_status: document.querySelector('input[name="review_status"]:checked')?.value
            };

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(7, formData);
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('step8-research-2.html');
            }
        });

        async function continueLater() {
            const formData = {
                orcid: document.getElementById('orcid').value,
                email_confirm: document.getElementById('email_confirm').value,
                full_name: document.getElementById('full_name').value,
                institution: document.getElementById('institution').value,
                specialty: document.getElementById('specialty').value,
                department: document.getElementById('department').value,
                experience_level: document.querySelector('input[name="experience_level"]:checked')?.value,
                participated_systematic_review: document.querySelector('input[name="participated_systematic_review"]:checked')?.value,
                sr_other_details: document.getElementById('sr_other_details').value,
                review_status: document.querySelector('input[name="review_status"]:checked')?.value
            };

            await WardApp.saveQuestionnaireProgress(7, formData);
            window.location.href = addViewAsToUrl('../dashboard.html');
        }
    </script>
</body>
</html>
