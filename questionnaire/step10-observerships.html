<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Estagios Medicos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Estagios Medicos</span>
                <span class="progress-text">10/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 90%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">Experiencia Clinica</h1>
            <p class="questionnaire-step">Etapa 10 de 11</p>
        </div>

        <!-- Form -->
        <form id="step10-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">🏥 Clerkships</h3>

                <div class="form-group">
                    <label class="form-label">
                        Durante a faculdade, fez clerkship nos EUA? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="clerkship_yes" name="did_clerkship" value="true" required>
                        <label class="form-check-label" for="clerkship_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="clerkship_no" name="did_clerkship" value="false">
                        <label class="form-check-label" for="clerkship_no">Nao</label>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">👁️ Observerships Realizados</h3>

                <div class="form-group">
                    <label class="form-label">
                        Ja fez observerships? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="observer_yes" name="did_observership" value="true" required>
                        <label class="form-check-label" for="observer_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="observer_no" name="did_observership" value="false">
                        <label class="form-check-label" for="observer_no">Nao</label>
                    </div>
                </div>

                <div id="past-observers-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label" for="past_observer_count">Quantos observerships ja fez?</label>
                        <input type="number" id="past_observer_count" class="form-input" min="1" max="10" value="1">
                    </div>

                    <div id="past-observers-list">
                        <div class="card mb-3 observer-card" data-type="past">
                            <div class="card-header">Observership #1</div>
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label">Instituicao</label>
                                    <input type="text" class="form-input obs-institution">
                                </div>
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label">Ano</label>
                                        <input type="number" class="form-input obs-year" min="2000" max="2030">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Especialidade</label>
                                        <input type="text" class="form-input obs-specialty">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Local</label>
                                    <div class="form-check">
                                        <input type="radio" name="obs_1_location" value="hospital" class="obs-location">
                                        <label class="form-check-label">Hospital</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" name="obs_1_location" value="private_clinic" class="obs-location">
                                        <label class="form-check-label">Clinica Privada</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Custo aproximado (R$)</label>
                                    <input type="number" class="form-input obs-cost" min="0">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Conseguiu carta de recomendacao?</label>
                                    <div class="form-check">
                                        <input type="radio" name="obs_1_letter" value="true" class="obs-letter">
                                        <label class="form-check-label">Sim</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" name="obs_1_letter" value="false" class="obs-letter">
                                        <label class="form-check-label">Nao</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Comentarios</label>
                                    <textarea class="form-textarea obs-comments" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="questionnaire-section">
                <h3 class="section-title">📅 Planejamento Futuro</h3>

                <div class="form-group">
                    <label class="form-label">Pretende fazer mais observerships?</label>
                    <div class="form-check">
                        <input type="radio" id="future_yes" name="plans_more" value="true">
                        <label class="form-check-label" for="future_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="future_no" name="plans_more" value="false">
                        <label class="form-check-label" for="future_no">Nao</label>
                    </div>
                </div>

                <div id="future-observers-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label" for="future_observer_count">Quantos pretende fazer?</label>
                        <input type="number" id="future_observer_count" class="form-input" min="1" max="10" value="1">
                    </div>

                    <div id="future-observers-list">
                        <div class="card mb-3 observer-card" data-type="future">
                            <div class="card-header">Observership Planejado #1</div>
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label">Instituicao desejada</label>
                                    <input type="text" class="form-input obs-institution">
                                </div>
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label">Quando pretende?</label>
                                        <input type="text" class="form-input obs-when" placeholder="Ex: 2025">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Especialidade</label>
                                        <input type="text" class="form-input obs-specialty">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Local preferido</label>
                                    <div class="form-check">
                                        <input type="radio" name="future_obs_1_location" value="hospital" class="obs-location">
                                        <label class="form-check-label">Hospital</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" name="future_obs_1_location" value="private_clinic" class="obs-location">
                                        <label class="form-check-label">Clinica Privada</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('step9-research-3.html')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        // Load saved data on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await WardApp.loadQuestionnaireData(10);
            if (data) {
                // Did clerkship
                if (data.did_clerkship !== undefined) {
                    document.querySelector(`input[name="did_clerkship"][value="${data.did_clerkship}"]`).checked = true;
                }

                // Did observership
                if (data.did_observership !== undefined) {
                    const radioVal = data.did_observership ? 'true' : 'false';
                    document.querySelector(`input[name="did_observership"][value="${radioVal}"]`).checked = true;
                    if (data.did_observership) {
                        document.getElementById('past-observers-section').classList.add('visible');
                    }
                }

                // Load past observerships
                if (data.past_observerships) {
                    try {
                        const pastObs = JSON.parse(data.past_observerships);
                        if (pastObs.length > 0) {
                            document.getElementById('past_observer_count').value = pastObs.length;
                            updateObserverCards('past', pastObs.length);

                            const cards = document.querySelectorAll('.observer-card[data-type="past"]');
                            pastObs.forEach((obs, i) => {
                                if (cards[i]) {
                                    cards[i].querySelector('.obs-institution').value = obs.institution || '';
                                    cards[i].querySelector('.obs-specialty').value = obs.specialty || '';
                                    if (obs.year) cards[i].querySelector('.obs-year').value = obs.year;
                                    if (obs.approximate_cost) cards[i].querySelector('.obs-cost').value = obs.approximate_cost;
                                    if (obs.comments) cards[i].querySelector('.obs-comments').value = obs.comments;
                                    if (obs.location_type) {
                                        const locRadio = cards[i].querySelector(`.obs-location[value="${obs.location_type}"]`);
                                        if (locRadio) locRadio.checked = true;
                                    }
                                    if (obs.got_recommendation_letter !== undefined) {
                                        const letterRadio = cards[i].querySelector(`.obs-letter[value="${obs.got_recommendation_letter}"]`);
                                        if (letterRadio) letterRadio.checked = true;
                                    }
                                }
                            });
                        }
                    } catch (e) { console.error('Error loading past observerships:', e); }
                }

                // Plans more
                if (data.plans_more_observerships !== undefined) {
                    const radioVal = data.plans_more_observerships ? 'true' : 'false';
                    document.querySelector(`input[name="plans_more"][value="${radioVal}"]`).checked = true;
                    if (data.plans_more_observerships) {
                        document.getElementById('future-observers-section').classList.add('visible');
                    }
                }

                // Load future observerships
                if (data.future_observerships) {
                    try {
                        const futureObs = JSON.parse(data.future_observerships);
                        if (futureObs.length > 0) {
                            document.getElementById('future_observer_count').value = futureObs.length;
                            updateObserverCards('future', futureObs.length);

                            const cards = document.querySelectorAll('.observer-card[data-type="future"]');
                            futureObs.forEach((obs, i) => {
                                if (cards[i]) {
                                    cards[i].querySelector('.obs-institution').value = obs.institution || '';
                                    cards[i].querySelector('.obs-specialty').value = obs.specialty || '';
                                    if (obs.when_planned) cards[i].querySelector('.obs-when').value = obs.when_planned;
                                    if (obs.location_type) {
                                        const locRadio = cards[i].querySelector(`.obs-location[value="${obs.location_type}"]`);
                                        if (locRadio) locRadio.checked = true;
                                    }
                                }
                            });
                        }
                    } catch (e) { console.error('Error loading future observerships:', e); }
                }
            }
        });

        // Conditional: did observership
        document.querySelectorAll('input[name="did_observership"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('past-observers-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                }
            });
        });

        // Conditional: plans more
        document.querySelectorAll('input[name="plans_more"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('future-observers-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                }
            });
        });

        // Dynamic observer count
        document.getElementById('past_observer_count').addEventListener('change', function() {
            updateObserverCards('past', parseInt(this.value) || 1);
        });

        document.getElementById('future_observer_count').addEventListener('change', function() {
            updateObserverCards('future', parseInt(this.value) || 1);
        });

        function updateObserverCards(type, count) {
            const listId = type === 'past' ? 'past-observers-list' : 'future-observers-list';
            const list = document.getElementById(listId);
            const currentCards = list.querySelectorAll('.observer-card').length;

            if (count > currentCards) {
                for (let i = currentCards + 1; i <= count; i++) {
                    addObserverCard(type, i);
                }
            } else if (count < currentCards) {
                const cards = list.querySelectorAll('.observer-card');
                for (let i = currentCards - 1; i >= count; i--) {
                    cards[i].remove();
                }
            }
        }

        function addObserverCard(type, index) {
            const listId = type === 'past' ? 'past-observers-list' : 'future-observers-list';
            const list = document.getElementById(listId);
            const prefix = type === 'past' ? 'obs' : 'future_obs';

            const cardHtml = type === 'past' ? `
                <div class="card mb-3 observer-card" data-type="past">
                    <div class="card-header">Observership #${index}</div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label">Instituicao</label>
                            <input type="text" class="form-input obs-institution">
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Ano</label>
                                <input type="number" class="form-input obs-year" min="2000" max="2030">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Especialidade</label>
                                <input type="text" class="form-input obs-specialty">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Local</label>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_location" value="hospital" class="obs-location">
                                <label class="form-check-label">Hospital</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_location" value="private_clinic" class="obs-location">
                                <label class="form-check-label">Clinica Privada</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Custo aproximado (R$)</label>
                            <input type="number" class="form-input obs-cost" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Conseguiu carta de recomendacao?</label>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_letter" value="true" class="obs-letter">
                                <label class="form-check-label">Sim</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_letter" value="false" class="obs-letter">
                                <label class="form-check-label">Nao</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Comentarios</label>
                            <textarea class="form-textarea obs-comments" rows="2"></textarea>
                        </div>
                    </div>
                </div>
            ` : `
                <div class="card mb-3 observer-card" data-type="future">
                    <div class="card-header">Observership Planejado #${index}</div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label">Instituicao desejada</label>
                            <input type="text" class="form-input obs-institution">
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label">Quando pretende?</label>
                                <input type="text" class="form-input obs-when" placeholder="Ex: 2025">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Especialidade</label>
                                <input type="text" class="form-input obs-specialty">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Local preferido</label>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_location" value="hospital" class="obs-location">
                                <label class="form-check-label">Hospital</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" name="${prefix}_${index}_location" value="private_clinic" class="obs-location">
                                <label class="form-check-label">Clinica Privada</label>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            list.insertAdjacentHTML('beforeend', cardHtml);
        }

        function getObserverData(type) {
            const cards = document.querySelectorAll(`.observer-card[data-type="${type}"]`);
            const data = [];

            cards.forEach((card, index) => {
                const obs = {
                    is_past: type === 'past',
                    institution: card.querySelector('.obs-institution')?.value || '',
                    specialty: card.querySelector('.obs-specialty')?.value || ''
                };

                if (type === 'past') {
                    obs.year = parseInt(card.querySelector('.obs-year')?.value) || null;
                    obs.approximate_cost = parseInt(card.querySelector('.obs-cost')?.value) || null;
                    obs.comments = card.querySelector('.obs-comments')?.value || '';
                    obs.location_type = card.querySelector('.obs-location:checked')?.value || null;
                    obs.got_recommendation_letter = card.querySelector('.obs-letter:checked')?.value === 'true';
                } else {
                    obs.when_planned = card.querySelector('.obs-when')?.value || '';
                    obs.location_type = card.querySelector('.obs-location:checked')?.value || null;
                }

                if (obs.institution) {
                    data.push(obs);
                }
            });

            return data;
        }

        function getFormData() {
            return {
                did_clerkship: document.querySelector('input[name="did_clerkship"]:checked')?.value === 'true',
                did_observership: document.querySelector('input[name="did_observership"]:checked')?.value === 'true',
                past_observerships: JSON.stringify(getObserverData('past')),
                plans_more_observerships: document.querySelector('input[name="plans_more"]:checked')?.value === 'true',
                future_observerships: JSON.stringify(getObserverData('future'))
            };
        }

        // Form submission
        document.getElementById('step10-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(10, getFormData());
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('step11-background.html');
            }
        });

        async function continueLater() {
            await WardApp.saveQuestionnaireProgress(10, getFormData());
            // Redirect to correct dashboard based on role
            const dashboardUrl = (userData.role === 'assessoria') ? '../dashboard-assessoria-avulsa.html' : '../dashboard.html';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }
    </script>
</body>
</html>
