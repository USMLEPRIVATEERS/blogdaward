<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/devtools-protection.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - UWorld Preparacao</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="questionnaire-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">UWorld - Sua Preparacao</span>
                <span class="progress-text">3/11</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 27%"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="questionnaire-header">
            <div class="login-logo">🎓</div>
            <h1 class="questionnaire-title">UWorld - Sua Preparacao</h1>
            <p class="questionnaire-step">Etapa 3 de 11</p>
        </div>

        <!-- Form -->
        <form id="step3-form" class="questionnaire-form">
            <div class="questionnaire-section">
                <h3 class="section-title">📚 Status do UWorld</h3>

                <div class="form-group">
                    <label class="form-label">
                        Voce ja comprou o UWorld? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="purchased_yes" name="purchased" value="true" required>
                        <label class="form-check-label" for="purchased_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="purchased_no" name="purchased" value="false">
                        <label class="form-check-label" for="purchased_no">Nao</label>
                    </div>
                </div>

                <div id="activated-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label">
                            Ja ativou sua assinatura?
                        </label>
                        <div class="form-check">
                            <input type="radio" id="activated_yes" name="activated" value="true">
                            <label class="form-check-label" for="activated_yes">Sim</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" id="activated_no" name="activated" value="false">
                            <label class="form-check-label" for="activated_no">Nao</label>
                        </div>
                    </div>

                    <div id="expiration-section" class="conditional-field">
                        <div class="form-group">
                            <label class="form-label" for="expiration_date">Quando vence?</label>
                            <input type="date" id="expiration_date" class="form-input">
                        </div>
                    </div>

                    <div id="subscription-section" class="conditional-field">
                        <div class="form-group">
                            <label class="form-label">Quanto tempo de assinatura escolheu?</label>
                            <div class="form-check">
                                <input type="radio" id="sub_6months" name="subscription_length" value="6_months">
                                <label class="form-check-label" for="sub_6months">6 meses</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="sub_1year" name="subscription_length" value="1_year">
                                <label class="form-check-label" for="sub_1year">1 ano</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="sub_other" name="subscription_length" value="other">
                                <label class="form-check-label" for="sub_other">Outro</label>
                            </div>
                            <div id="sub-other-field" class="conditional-field">
                                <input type="text" id="subscription_other" class="form-input" placeholder="Especifique...">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="usage-section" class="questionnaire-section" style="display: none;">
                <h3 class="section-title">📊 Uso do UWorld</h3>

                <div class="form-group">
                    <label class="form-label" for="questions_done">Quantas questoes ja fez?</label>
                    <input type="number" id="questions_done" class="form-input" min="0" placeholder="Ex: 500">
                </div>

                <div class="form-group">
                    <label class="form-label" for="overall_percentage">Qual sua porcentagem geral de acertos?</label>
                    <input type="number" id="overall_percentage" class="form-input" min="0" max="100" placeholder="Ex: 65">
                    <span class="form-hint">%</span>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        📊 Desempenho por System (Opcional)
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="lowest_percentage">Menor %</label>
                                <input type="number" id="lowest_percentage" class="form-input" min="0" max="100">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="lowest_system">Em qual System?</label>
                                <input type="text" id="lowest_system" class="form-input" placeholder="Ex: Pharmacology">
                            </div>
                        </div>
                        <div class="input-group">
                            <div class="form-group">
                                <label class="form-label" for="highest_percentage">Maior %</label>
                                <input type="number" id="highest_percentage" class="form-input" min="0" max="100">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="highest_system">Em qual System?</label>
                                <input type="text" id="highest_system" class="form-input" placeholder="Ex: Cardiovascular">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- UWSA Section -->
            <div class="questionnaire-section">
                <h3 class="section-title">📝 Status dos UWSA</h3>

                <div class="form-group">
                    <label class="form-label">
                        Você já fez algum UWSA? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="did_uwsa_yes" name="did_uwsa" value="true" required>
                        <label class="form-check-label" for="did_uwsa_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="did_uwsa_no" name="did_uwsa" value="false">
                        <label class="form-check-label" for="did_uwsa_no">Não</label>
                    </div>
                </div>

                <div id="uwsa-exams-section" class="conditional-field">
                    <div class="form-group">
                        <label class="form-label">Marque quais UWSA já fez:</label>

                        <div id="uwsa-step1-section" style="display: none;">
                            <p class="form-hint" style="font-weight: 600; margin-bottom: 0.5rem;">Step 1:</p>
                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step1_1" name="uwsa_completed" value="step1_uwsa1">
                                <label class="form-check-label" for="uwsa_step1_1">UWSA 1</label>
                            </div>
                            <div id="uwsa-step1-1-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_1_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step1_1_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_1_date">Data</label>
                                        <input type="date" id="uwsa_step1_1_date" class="form-input">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step1_2" name="uwsa_completed" value="step1_uwsa2">
                                <label class="form-check-label" for="uwsa_step1_2">UWSA 2</label>
                            </div>
                            <div id="uwsa-step1-2-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_2_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step1_2_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_2_date">Data</label>
                                        <input type="date" id="uwsa_step1_2_date" class="form-input">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step1_3" name="uwsa_completed" value="step1_uwsa3">
                                <label class="form-check-label" for="uwsa_step1_3">UWSA 3</label>
                            </div>
                            <div id="uwsa-step1-3-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_3_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step1_3_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step1_3_date">Data</label>
                                        <input type="date" id="uwsa_step1_3_date" class="form-input">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="uwsa-step2ck-section" style="display: none;">
                            <p class="form-hint" style="font-weight: 600; margin-bottom: 0.5rem;">Step 2 CK:</p>
                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step2ck_1" name="uwsa_completed" value="step2ck_uwsa1">
                                <label class="form-check-label" for="uwsa_step2ck_1">UWSA 1</label>
                            </div>
                            <div id="uwsa-step2ck-1-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_1_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step2ck_1_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_1_date">Data</label>
                                        <input type="date" id="uwsa_step2ck_1_date" class="form-input">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step2ck_2" name="uwsa_completed" value="step2ck_uwsa2">
                                <label class="form-check-label" for="uwsa_step2ck_2">UWSA 2</label>
                            </div>
                            <div id="uwsa-step2ck-2-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_2_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step2ck_2_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_2_date">Data</label>
                                        <input type="date" id="uwsa_step2ck_2_date" class="form-input">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step2ck_3" name="uwsa_completed" value="step2ck_uwsa3">
                                <label class="form-check-label" for="uwsa_step2ck_3">UWSA 3</label>
                            </div>
                            <div id="uwsa-step2ck-3-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_3_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step2ck_3_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step2ck_3_date">Data</label>
                                        <input type="date" id="uwsa_step2ck_3_date" class="form-input">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="uwsa-step3-section" style="display: none;">
                            <p class="form-hint" style="font-weight: 600; margin-bottom: 0.5rem;">Step 3:</p>
                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step3_1" name="uwsa_completed" value="step3_uwsa1">
                                <label class="form-check-label" for="uwsa_step3_1">UWSA 1</label>
                            </div>
                            <div id="uwsa-step3-1-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step3_1_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step3_1_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step3_1_date">Data</label>
                                        <input type="date" id="uwsa_step3_1_date" class="form-input">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="uwsa_step3_2" name="uwsa_completed" value="step3_uwsa2">
                                <label class="form-check-label" for="uwsa_step3_2">UWSA 2</label>
                            </div>
                            <div id="uwsa-step3-2-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                                <div class="input-group">
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step3_2_percentage">% Acertos</label>
                                        <input type="number" id="uwsa_step3_2_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="uwsa_step3_2_date">Data</label>
                                        <input type="date" id="uwsa_step3_2_date" class="form-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- NBME Section -->
            <div class="questionnaire-section">
                <h3 class="section-title">🎯 Status dos NBMEs</h3>

                <div class="form-group">
                    <label class="form-label">
                        Você já fez algum NBME? <span class="required">*</span>
                    </label>
                    <div class="form-check">
                        <input type="radio" id="did_nbme_yes" name="did_nbme" value="true" required>
                        <label class="form-check-label" for="did_nbme_yes">Sim</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="did_nbme_no" name="did_nbme" value="false">
                        <label class="form-check-label" for="did_nbme_no">Não</label>
                    </div>
                </div>

                <div id="nbme-forms-section" class="conditional-field">
                    <div id="nbme-forms-list">
                        <!-- Will be populated by JavaScript based on next_exam from step 2 -->
                    </div>

                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label class="form-label">
                            <input type="checkbox" id="has_other_assessments" style="display: inline; width: auto; margin-right: 0.5rem;">
                            Fez outros Self Assessments?
                        </label>
                    </div>

                    <div id="other-assessments-section" class="conditional-field">
                        <div id="other-assessments-list">
                            <!-- Dynamic list will be added here -->
                        </div>
                        <button type="button" class="btn btn-sm btn-outline" onclick="addOtherAssessment()">
                            + Adicionar Outro Assessment
                        </button>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="questionnaire-nav">
                <button type="button" class="btn btn-secondary" onclick="window.location.href=addViewAsToUrl('/questionnaire/step2-usmle-data')">
                    ← Voltar
                </button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="continueLater()">
                        Continuar Depois →
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Avancar →
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Helper function to preserve view_as parameter in URLs
        function getViewAsParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('view_as');
        }

        function addViewAsToUrl(url) {
            const viewAs = getViewAsParam();
            if (viewAs) {
                const separator = url.includes('?') ? '&' : '?';
                return url + separator + 'view_as=' + viewAs;
            }
            return url;
        }

        let otherAssessmentsCount = 0;
        let nextExam = 'step1'; // Default

        // Generate NBME forms list based on next_exam
        function generateNBMEForms(exam) {
            const container = document.getElementById('nbme-forms-list');
            let forms = [];

            if (exam === 'step1') {
                // Forms 33 to 1 for Step 1
                for (let i = 33; i >= 1; i--) {
                    forms.push(i);
                }
            } else if (exam === 'step2ck') {
                // Forms 16 to 1 for Step 2 CK
                for (let i = 16; i >= 1; i--) {
                    forms.push(i);
                }
            } else if (exam === 'step3') {
                // Forms 7 to 1 for Step 3
                for (let i = 7; i >= 1; i--) {
                    forms.push(i);
                }
            }

            container.innerHTML = forms.map(num => `
                <div class="form-check">
                    <input type="checkbox" id="nbme_form_${num}" name="nbme_completed" value="form_${num}">
                    <label class="form-check-label" for="nbme_form_${num}">NBME Form ${num}</label>
                </div>
                <div id="nbme-form-${num}-details" class="conditional-field" style="margin-left: 2rem; margin-bottom: 1rem;">
                    <div class="input-group">
                        <div class="form-group">
                            <label class="form-label" for="nbme_form_${num}_percentage">% Acertos</label>
                            <input type="number" id="nbme_form_${num}_percentage" class="form-input" min="0" max="100" placeholder="Ex: 75">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="nbme_form_${num}_date">Data</label>
                            <input type="date" id="nbme_form_${num}_date" class="form-input">
                        </div>
                    </div>
                </div>
            `).join('');

            // Add event listeners after creating elements
            forms.forEach(num => {
                const checkbox = document.getElementById(`nbme_form_${num}`);
                const details = document.getElementById(`nbme-form-${num}-details`);
                if (checkbox && details) {
                    checkbox.addEventListener('change', function() {
                        if (this.checked) {
                            details.classList.add('visible');
                        } else {
                            details.classList.remove('visible');
                        }
                    });
                }
            });
        }

        // Add other assessment input
        function addOtherAssessment() {
            otherAssessmentsCount++;
            const container = document.getElementById('other-assessments-list');
            const div = document.createElement('div');
            div.className = 'input-group';
            div.style.marginBottom = '1rem';
            div.id = `other-assessment-${otherAssessmentsCount}`;
            div.innerHTML = `
                <div class="form-group" style="flex: 2;">
                    <label class="form-label">Nome do Assessment</label>
                    <input type="text" id="other_assessment_${otherAssessmentsCount}_name" class="form-input" placeholder="Ex: Free 120">
                </div>
                <div class="form-group">
                    <label class="form-label">% Acertos</label>
                    <input type="number" id="other_assessment_${otherAssessmentsCount}_percentage" class="form-input" min="0" max="100" placeholder="75">
                </div>
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" id="other_assessment_${otherAssessmentsCount}_date" class="form-input">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="removeOtherAssessment(${otherAssessmentsCount})" style="margin-bottom: 0.5rem;">
                        🗑️
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        function removeOtherAssessment(id) {
            const element = document.getElementById(`other-assessment-${id}`);
            if (element) {
                element.remove();
            }
        }

        // Load existing data
        document.addEventListener('DOMContentLoaded', async () => {
            // First load step 2 data to get next_exam
            const step2Data = await WardApp.loadQuestionnaireData(2);
            if (step2Data && step2Data.next_exam) {
                nextExam = step2Data.next_exam;
            }

            // Show appropriate UWSA section based on next_exam
            if (nextExam === 'step1') {
                document.getElementById('uwsa-step1-section').style.display = 'block';
            } else if (nextExam === 'step2ck') {
                document.getElementById('uwsa-step2ck-section').style.display = 'block';
            } else if (nextExam === 'step3') {
                document.getElementById('uwsa-step3-section').style.display = 'block';
            }

            // Generate NBME forms based on next_exam
            generateNBMEForms(nextExam);

            const data = await WardApp.loadQuestionnaireData(3);
            if (data) {
                if (data.purchased !== null) {
                    document.querySelector(`input[name="purchased"][value="${data.purchased}"]`).checked = true;
                    if (data.purchased) {
                        document.getElementById('activated-section').classList.add('visible');
                    }
                }
                if (data.activated !== null) {
                    document.querySelector(`input[name="activated"][value="${data.activated}"]`).checked = true;
                    if (data.activated) {
                        document.getElementById('expiration-section').classList.add('visible');
                        document.getElementById('usage-section').style.display = 'block';
                    } else {
                        document.getElementById('subscription-section').classList.add('visible');
                    }
                }
                document.getElementById('expiration_date').value = data.expiration_date || '';
                if (data.subscription_length) {
                    const radio = document.querySelector(`input[name="subscription_length"][value="${data.subscription_length}"]`);
                    if (radio) radio.checked = true;
                }
                document.getElementById('questions_done').value = data.questions_done || '';
                document.getElementById('overall_percentage').value = data.overall_percentage || '';
                document.getElementById('lowest_percentage').value = data.lowest_percentage || '';
                document.getElementById('lowest_system').value = data.lowest_system || '';
                document.getElementById('highest_percentage').value = data.highest_percentage || '';
                document.getElementById('highest_system').value = data.highest_system || '';

                // Load UWSA data
                if (data.did_uwsa !== null) {
                    const uwsaRadio = document.querySelector(`input[name="did_uwsa"][value="${data.did_uwsa}"]`);
                    if (uwsaRadio) uwsaRadio.checked = true;
                    if (data.did_uwsa) {
                        document.getElementById('uwsa-exams-section').classList.add('visible');
                        // Load each UWSA
                        if (data.uwsa_exams) {
                            data.uwsa_exams.forEach(exam => {
                                const checkbox = document.getElementById(exam.id);
                                if (checkbox) {
                                    checkbox.checked = true;
                                    document.getElementById(`${exam.id}-details`).classList.add('visible');
                                    document.getElementById(`${exam.id}_percentage`).value = exam.percentage || '';
                                    document.getElementById(`${exam.id}_date`).value = exam.date || '';
                                }
                            });
                        }
                    }
                }

                // Load NBME data
                if (data.did_nbme !== null) {
                    const nbmeRadio = document.querySelector(`input[name="did_nbme"][value="${data.did_nbme}"]`);
                    if (nbmeRadio) nbmeRadio.checked = true;
                    if (data.did_nbme) {
                        document.getElementById('nbme-forms-section').classList.add('visible');
                        // Load each NBME
                        if (data.nbme_forms) {
                            data.nbme_forms.forEach(form => {
                                const checkbox = document.getElementById(`nbme_${form.id}`);
                                if (checkbox) {
                                    checkbox.checked = true;
                                    const formIdHyphen = form.id.replace('_', '-');
                                    document.getElementById(`nbme-${formIdHyphen}-details`).classList.add('visible');
                                    document.getElementById(`nbme_${form.id}_percentage`).value = form.percentage || '';
                                    document.getElementById(`nbme_${form.id}_date`).value = form.date || '';
                                }
                            });
                        }
                    }
                }

                // Load other assessments
                if (data.has_other_assessments) {
                    document.getElementById('has_other_assessments').checked = true;
                    document.getElementById('other-assessments-section').classList.add('visible');
                    if (data.other_assessments && data.other_assessments.length > 0) {
                        data.other_assessments.forEach((assess, index) => {
                            addOtherAssessment();
                            document.getElementById(`other_assessment_${otherAssessmentsCount}_name`).value = assess.name || '';
                            document.getElementById(`other_assessment_${otherAssessmentsCount}_percentage`).value = assess.percentage || '';
                            document.getElementById(`other_assessment_${otherAssessmentsCount}_date`).value = assess.date || '';
                        });
                    }
                }
            }
        });

        // Purchased conditional
        document.querySelectorAll('input[name="purchased"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('activated-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                    document.getElementById('usage-section').style.display = 'none';
                }
            });
        });

        // Activated conditional
        document.querySelectorAll('input[name="activated"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const expirationSection = document.getElementById('expiration-section');
                const subscriptionSection = document.getElementById('subscription-section');
                const usageSection = document.getElementById('usage-section');

                if (this.value === 'true') {
                    expirationSection.classList.add('visible');
                    subscriptionSection.classList.remove('visible');
                    usageSection.style.display = 'block';
                } else {
                    expirationSection.classList.remove('visible');
                    subscriptionSection.classList.add('visible');
                    usageSection.style.display = 'none';
                }
            });
        });

        // Subscription other
        document.getElementById('sub_other').addEventListener('change', function() {
            document.getElementById('sub-other-field').classList.toggle('visible', this.checked);
        });

        // UWSA conditional
        document.querySelectorAll('input[name="did_uwsa"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('uwsa-exams-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                }
            });
        });

        // UWSA checkboxes - add event listeners for all possible UWSAs
        ['step1_1', 'step1_2', 'step1_3', 'step2ck_1', 'step2ck_2', 'step2ck_3', 'step3_1', 'step3_2'].forEach(id => {
            const checkbox = document.getElementById(`uwsa_${id}`);
            if (checkbox) {
                checkbox.addEventListener('change', function() {
                    const details = document.getElementById(`uwsa-${id}-details`);
                    if (details) {
                        if (this.checked) {
                            details.classList.add('visible');
                        } else {
                            details.classList.remove('visible');
                        }
                    }
                });
            }
        });

        // NBME conditional
        document.querySelectorAll('input[name="did_nbme"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const section = document.getElementById('nbme-forms-section');
                if (this.value === 'true') {
                    section.classList.add('visible');
                } else {
                    section.classList.remove('visible');
                }
            });
        });

        // Other assessments conditional
        document.getElementById('has_other_assessments').addEventListener('change', function() {
            const section = document.getElementById('other-assessments-section');
            if (this.checked) {
                section.classList.add('visible');
            } else {
                section.classList.remove('visible');
            }
        });

        // Helper function to collect all form data
        function collectFormData() {
            // Collect UWSA data
            const uwsa_exams = [];
            document.querySelectorAll('input[name="uwsa_completed"]:checked').forEach(checkbox => {
                const id = checkbox.value.replace('step1_', '').replace('step2ck_', '').replace('step3_', '');
                const fullId = checkbox.id.replace('uwsa_', '');
                uwsa_exams.push({
                    id: checkbox.id,
                    name: checkbox.value,
                    percentage: parseInt(document.getElementById(`${checkbox.id}_percentage`)?.value) || null,
                    date: document.getElementById(`${checkbox.id}_date`)?.value || null
                });
            });

            // Collect NBME data
            const nbme_forms = [];
            document.querySelectorAll('input[name="nbme_completed"]:checked').forEach(checkbox => {
                nbme_forms.push({
                    id: checkbox.value,
                    percentage: parseInt(document.getElementById(`${checkbox.id}_percentage`)?.value) || null,
                    date: document.getElementById(`${checkbox.id}_date`)?.value || null
                });
            });

            // Collect other assessments
            const other_assessments = [];
            for (let i = 1; i <= otherAssessmentsCount; i++) {
                const nameEl = document.getElementById(`other_assessment_${i}_name`);
                if (nameEl && nameEl.value) {
                    other_assessments.push({
                        name: nameEl.value,
                        percentage: parseInt(document.getElementById(`other_assessment_${i}_percentage`)?.value) || null,
                        date: document.getElementById(`other_assessment_${i}_date`)?.value || null
                    });
                }
            }

            return {
                purchased: document.querySelector('input[name="purchased"]:checked')?.value === 'true',
                activated: document.querySelector('input[name="activated"]:checked')?.value === 'true',
                expiration_date: document.getElementById('expiration_date').value || null,
                subscription_length: document.querySelector('input[name="subscription_length"]:checked')?.value,
                questions_done: parseInt(document.getElementById('questions_done').value) || null,
                overall_percentage: parseInt(document.getElementById('overall_percentage').value) || null,
                lowest_percentage: parseInt(document.getElementById('lowest_percentage').value) || null,
                lowest_system: document.getElementById('lowest_system').value,
                highest_percentage: parseInt(document.getElementById('highest_percentage').value) || null,
                highest_system: document.getElementById('highest_system').value,
                did_uwsa: document.querySelector('input[name="did_uwsa"]:checked')?.value === 'true',
                uwsa_exams: uwsa_exams,
                did_nbme: document.querySelector('input[name="did_nbme"]:checked')?.value === 'true',
                nbme_forms: nbme_forms,
                has_other_assessments: document.getElementById('has_other_assessments').checked,
                other_assessments: other_assessments
            };
        }

        // Form submission
        document.getElementById('step3-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = collectFormData();

            WardApp.showLoading();
            const success = await WardApp.saveQuestionnaireProgress(3, formData);
            WardApp.hideLoading();

            if (success) {
                window.location.href = addViewAsToUrl('/questionnaire/step4-uworld-progress');
            }
        });

        // Continue later
        async function continueLater() {
            const formData = collectFormData();

            await WardApp.saveQuestionnaireProgress(3, formData);
            // Redirect to correct dashboard based on role
            let userData = JSON.parse(localStorage.getItem('userData') || 'null');

            // If no userData, try to get from checkAuth
            if (!userData || !userData.role) {
                const userId = localStorage.getItem('userId');
                if (userId) {
                    // Fetch from database
                    const { data } = await WardApp.db.from('users').select('role').eq('id', userId).single();
                    if (data) userData = data;
                }
            }

            const dashboardUrl = (userData?.role === 'assessoria') ? '/dashboard-assessoria-avulsa' : '/dashboard';
            window.location.href = addViewAsToUrl(dashboardUrl);
        }
    </script>
</body>
</html>
